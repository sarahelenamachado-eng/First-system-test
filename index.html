<script>
/* Armazenamento local: uma pasta do computador escolhida pelo usuário (File System Access API, Edge/Chrome).
 *
 *   <pasta escolhida>/
 *     db.json                                         -> base de dados de governança
 *     PROJECTS/PROJ001 INFOS AND GENERAL OVERVIEW/master_schedule/...
 *     RISKS/RISK001 INFOS AND GENERAL OVERVIEW/...
 *     MEETINGS/MEET001/...
 *     SUMMARIES/...
 *
 * A referência à pasta e a chave da IA ficam no IndexedDB do navegador (nunca dentro da pasta,
 * que pode ser compartilhada).
 */
const KV = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("governanca-ia", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res((this._db = r.result));
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  },
};

const Store = {
  root: null,
  name: "",

  supported: () => typeof window.showDirectoryPicker === "function",

  async pick() {
    const h = await window.showDirectoryPicker({ id: "governanca-ia", mode: "readwrite" });
    await this.use(h);
  },
  async use(h) {
    this.root = h;
    this.name = h.name;
    await KV.set("root", h).catch(() => {});
  },
  /** Pasta usada da última vez; precisa de permissão (clique do usuário) para reabrir. */
  async remembered() {
    try { return (await KV.get("root")) || null; } catch { return null; }
  },
  async hasPermission(h) {
    return (await h.queryPermission({ mode: "readwrite" })) === "granted";
  },
  async requestPermission(h) {
    return (await h.requestPermission({ mode: "readwrite" })) === "granted";
  },

  _split(path) { return path.split("/").filter(Boolean); },
  async dir(path, create = true) {
    let h = this.root;
    for (const p of this._split(path)) h = await h.getDirectoryHandle(p, { create });
    return h;
  },
  async fileHandle(path, create = false) {
    const parts = this._split(path), name = parts.pop();
    const d = await this.dir(parts.join("/"), create);
    return d.getFileHandle(name, { create });
  },
  async write(path, data) {
    const fh = await this.fileHandle(path, true);
    const w = await fh.createWritable();
    await w.write(data);
    await w.close();
  },
  async read(path) {
    try { return await (await this.fileHandle(path)).getFile(); } catch { return null; }
  },
  async exists(path) { return (await this.read(path)) !== null; },
  async remove(path) {
    const parts = this._split(path), name = parts.pop();
    try { await (await this.dir(parts.join("/"), false)).removeEntry(name); } catch { /* já removido */ }
  },
  /** Lista arquivos recursivamente: [{name, rel, folder, size, modified}] */
  async list(path) {
    const out = [];
    let base;
    try { base = await this.dir(path, false); } catch { return out; }
    const walk = async (h, rel) => {
      for await (const [n, e] of h.entries()) {
        const r = rel ? rel + "/" + n : n;
        if (e.kind === "directory") await walk(e, r);
        else {
          const f = await e.getFile();
          out.push({ name: n, rel: path + "/" + r, folder: rel || ".", size: f.size, modified: new Date(f.lastModified).toISOString().slice(0, 19) });
        }
      }
    };
    await walk(base, "");
    return out.sort((a, b) => a.rel.localeCompare(b.rel));
  },
  safeName(name) {
    return (String(name || "arquivo").split(/[\\/]/).pop().replace(/[^\p{L}\p{N}\-. ()_]+/gu, "_").trim()) || "arquivo";
  },
  /** Grava sem sobrescrever: "arquivo (1).xlsx" se já existir. */
  async writeUnique(folder, name, data) {
    name = this.safeName(name);
    const dot = name.lastIndexOf("."), root = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : "";
    let rel = folder + "/" + name, n = 1;
    while (await this.exists(rel)) rel = `${folder}/${root} (${n++})${ext}`;
    await this.write(rel, data);
    return rel;
  },
};
</script>

 *
 * A chave de cada texto é o próprio texto em português. Valores guardados nos dados (status,
 * prioridade, origem, impactos…) também são chaves em português e só são traduzidos na tela.
 * Parâmetros {x} são substituídos; parâmetros que são listas têm cada item traduzido. */
const I18N = {
  lang: "pt",
  LANGS: { pt: "Português", en: "English", zh: "中文" },

  async init() {
    let l = null;
    try { l = await KV.get("lang"); } catch { /* sem IndexedDB */ }
    if (!l) { const nav = (navigator.language || "pt").toLowerCase(); l = nav.startsWith("zh") ? "zh" : nav.startsWith("en") ? "en" : "pt"; }
    this.lang = this.LANGS[l] ? l : "pt";
  },
  async set(l) {
    this.lang = this.LANGS[l] ? l : "pt";
    try { await KV.set("lang", this.lang); } catch { /* sem IndexedDB */ }
  },
  htmlLang() { return { pt: "pt-BR", en: "en", zh: "zh-CN" }[this.lang]; },
  /** Nome do idioma para instruir a IA. */
  aiLanguage() { return { pt: "português do Brasil", en: "inglês (English)", zh: "chinês simplificado (简体中文)" }[this.lang]; },

  /** Preenche {params} num modelo já traduzido. */
  fill(tpl, params = {}, tr = (x) => x) {
    return String(tpl).replace(/\{(\w+)\}/g, (m, k) => {
      const v = params[k];
      if (v === undefined || v === null) return "";
      return Array.isArray(v) ? v.map(tr).join(", ") : String(v);
    });
  },
  t(key, params) {
    const e = D[key];
    const tpl = e ? (this.lang === "pt" ? e[2] ?? key : this.lang === "en" ? e[0] : e[1]) : key;
    return params ? this.fill(tpl, params, (x) => I18N.t(x)) : tpl;
  },
};

  "Projeto {id} — {name}: {d} dias sem monitoramento/atualização.": ["Project {id} — {name}: {d} days without monitoring/update.", "项目 {id} — {name}：已 {d} 天未跟进 / 更新。"],

  "{id} recebeu {n} entradas: tema recorrente.": ["{id} received {n} inputs: recurring topic.", "{id} 已收到 {n} 条输入：重复出现的议题。"],
  "Risco {id} sem atualização há {d} dias.": ["Risk {id} not updated for {d} days.", "风险 {id} 已 {d} 天未更新。"],
  "{n} entradas aguardando classificação.": ["{n} inputs waiting for classification.", "{n} 条输入等待分类。"],

  // ---- planilha (CSV)
  "Detalhe origem": ["Source detail", "来源详情"],
  "De onde veio": ["Came from", "来自"],
  "Data emitida": ["Issue date", "提出日期"],
  "Escopo (o que é)": ["Scope (what it is)", "范围（是什么）"],
  "O que fazer": ["What to do", "处理方式"],
  "Justificativa risco": ["Risk rationale", "风险理由"],
  "Detalhe impactos": ["Impact details", "影响详情"],

<script>
/* Leitor mínimo de .xlsx (primeira planilha) e .csv, sem bibliotecas externas.
 * .xlsx é um zip de XMLs: lemos o diretório central do zip e descompactamos com DecompressionStream. */
const Sheet = {
  async unzip(buf) {
    const dv = new DataView(buf), dec = new TextDecoder();
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("Arquivo .xlsx inválido");
    const count = dv.getUint16(e + 10, true);
    let off = dv.getUint32(e + 16, true);
    const files = {};
    for (let i = 0; i < count; i++) {
      const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
      const nl = dv.getUint16(off + 28, true), xl = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
      const local = dv.getUint32(off + 42, true);
      files[dec.decode(new Uint8Array(buf, off + 46, nl))] = { method, csize, local };
      off += 46 + nl + xl + cl;
    }
    return async (name) => {
      const f = files[name];
      if (!f) return null;
      const start = f.local + 30 + dv.getUint16(f.local + 26, true) + dv.getUint16(f.local + 28, true);
      const data = new Uint8Array(buf, start, f.csize);
      if (f.method === 0) return dec.decode(data);
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    };
  },

  async readXlsx(file) {
    const get = await this.unzip(await file.arrayBuffer());
    const xml = (s) => (s ? new DOMParser().parseFromString(s, "application/xml") : null);
    const byTag = (doc, tag) => (doc ? [...doc.getElementsByTagNameNS("*", tag)] : []);

    // primeira aba
    let sheetPath = "xl/worksheets/sheet1.xml";
    const wb = xml(await get("xl/workbook.xml")), rels = xml(await get("xl/_rels/workbook.xml.rels"));
    const first = byTag(wb, "sheet")[0];
    if (first && rels) {
      const rid = first.getAttribute("r:id") || first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      const rel = byTag(rels, "Relationship").find((r) => r.getAttribute("Id") === rid);
      if (rel) { const t = rel.getAttribute("Target"); sheetPath = t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, ""); }
    }
    const shared = byTag(xml(await get("xl/sharedStrings.xml")), "si").map((si) => byTag(si, "t").map((t) => t.textContent).join(""));

    // estilos de data (para converter o número serial do Excel em AAAA-MM-DD)
    const styles = xml(await get("xl/styles.xml"));
    const customDate = new Set(byTag(styles, "numFmt").filter((n) => /[dmy]/i.test((n.getAttribute("formatCode") || "").replace(/"[^"]*"|\[[^\]]*\]/g, ""))).map((n) => +n.getAttribute("numFmtId")));
    const xfs = (() => { const cx = byTag(styles, "cellXfs")[0]; return cx ? byTag(cx, "xf").map((x) => +x.getAttribute("numFmtId")) : []; })();
    const isDateFmt = (id) => (id >= 14 && id <= 22) || (id >= 45 && id <= 47) || customDate.has(id);
    const serialToDate = (n) => new Date(Date.UTC(1899, 11, 30) + Math.round(n * 864e5)).toISOString().slice(0, 10);

    const colIdx = (ref) => { let n = 0; for (const ch of ref.replace(/\d+/g, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const sheet = xml(await get(sheetPath));
    const rows = [];
    for (const row of byTag(sheet, "row")) {
      const r = [];
      for (const c of byTag(row, "c")) {
        const t = c.getAttribute("t"), v = byTag(c, "v")[0]?.textContent ?? "";
        let val = v;
        if (t === "s") val = shared[+v] ?? "";
        else if (t === "inlineStr") val = byTag(c, "t").map((x) => x.textContent).join("");
        else if (t === "b") val = v === "1" ? "VERDADEIRO" : "FALSO";
        else if (v !== "" && !t && isDateFmt(xfs[+(c.getAttribute("s") || 0)] ?? 0)) val = serialToDate(+v);
        r[colIdx(c.getAttribute("r") || "A")] = val;
      }
      const filled = Array.from(r, (x) => x ?? "");
      if (filled.some((x) => x !== "")) rows.push(filled);
    }
    return rows;
  },

  parseCsv(text) {
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [";", "\t", ","].sort((a, b) => first.split(b).length - first.split(a).length)[0];
    const rows = [];
    let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = "";
        if (row.some((x) => x !== "")) rows.push(row);
        row = [];
      } else cell += ch;
    }
    row.push(cell);
    if (row.some((x) => x !== "")) rows.push(row);
    return rows;
  },

  /** Retorna linhas da tabela ou null se o formato não for legível. */
  async table(file) {
    const ext = file.name.toLowerCase().split(".").pop();
    if (ext === "csv" || ext === "txt") return this.parseCsv((await file.text()).replace(/^﻿/, ""));
    if (ext === "xlsx" || ext === "xlsm") return this.readXlsx(file);
    return null;
  },
};
</script>
<script>
/* Camada de IA.
 *
 * Chama o Claude direto do navegador (API HTTP da Anthropic) quando há uma chave configurada em
 * Config. Sem chave — ou se a chamada falhar — usa heurísticas locais, para a plataforma funcionar offline.
 *
 * "Aprendizado": cada vez que o usuário confirma/corrige uma sugestão, o par (sugestão da IA,
 * decisão final) é guardado em db.feedback. Os exemplos mais parecidos com a nova demanda são
 * enviados ao Claude como referência, e a heurística local também os reutiliza.
 */
const AI = {
  key: "",
  model: "claude-opus-5-5",

  IMPACT_TYPES: ["Custo", "Eficiência", "Operação", "Compliance", "People"],
  DEFINITIONS: {
    risco_monitorar: "Risco a monitorar",
    risco_investigar: "Risco a investigar",
    info_reportar: "Info a ser reportada",
    novo_projeto: "Criação de um novo projeto",
    acao_projeto: "Ação dentro de um projeto",
    acao_geral: "Ação geral",
  },

  get SYSTEM_PROMPT() { return `Você é o assistente de governança corporativa de uma diretoria.
Você recebe demandas vindas da diretora, de reuniões, de departamentos ou do HQ e ajuda a fazer o
"demand management": verificar relação com itens já levantados, classificar (escopo, prioridade,
impactos) e sugerir a definição (risco, info a reportar, novo projeto, ação em projeto, ação geral).
Use a lógica de Hoshin Kanri para alinhar demandas à estratégia: conecte cada demanda aos objetivos
e projetos existentes, destaque desdobramentos e interfaces entre áreas, e aponte gaps (por que algo
não foi previsto antes). Responda sempre em ${I18N.aiLanguage()}, de forma objetiva (todos os textos livres
do JSON também nesse idioma; os valores de enum ficam exatamente como definidos no schema).
O usuário sempre confirma ou corrige suas sugestões; trate os exemplos de decisões anteriores como
critério da organização e siga-os quando aplicáveis.`; },

  async init() {
    this.key = (await KV.get("api_key").catch(() => "")) || "";
    this.model = (await KV.get("model").catch(() => "")) || "claude-opus-5-5";
  },
  async configure(key, model) {
    this.key = (key || "").trim();
    this.model = (model || "").trim() || "claude-opus-5-5";
    await KV.set("api_key", this.key);
    await KV.set("model", this.model);
  },
  enabled() { return !!this.key; },
  status() {
    return this.enabled() ? { enabled: true, model: this.model, detail: null }
      : { enabled: false, model: null, detail: "sem chave do Claude (configure em Config.)" };  // traduzido na exibição
  },

  /** Chama o Claude. Retorna objeto (se schema) ou texto. Lança Error em falha. */
  async call(content, schema = null, effort = "medium", maxTokens = 16000) {
    if (!this.key) throw new Error(t("IA sem chave configurada"));
    const body = {
      model: this.model,
      max_tokens: maxTokens,
      system: this.SYSTEM_PROMPT,
      messages: [{ role: "user", content }],
      output_config: { effort },
      // Se um classificador de segurança recusar, o servidor tenta outro modelo automaticamente.
      fallbacks: "default",
    };
    if (schema) body.output_config.format = { type: "json_schema", schema };
    let r;
    try {
      r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": this.key,
          "anthropic-version": "2023-06-01",
          "anthropic-beta": "server-side-fallback-2026-07-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify(body),
      });
    } catch (e) {
      throw new Error(t("Sem conexão com a API do Claude (rede/proxy bloqueado?)"));
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = data?.error?.message || r.statusText;
      if (r.status === 401) throw new Error(t("Chave da IA inválida (401)"));
      if (r.status === 429) throw new Error(t("Limite de requisições atingido; tente novamente em instantes"));
      throw new Error(t("Erro da API do Claude ({status}): {msg}", { status: r.status, msg }));
    }
    if (data.stop_reason === "refusal") throw new Error(t("O modelo recusou a solicitação"));
    const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    if (!schema) return text;
    try { return JSON.parse(text); } catch { throw new Error(t("Resposta da IA em formato inválido")); }
  },

  // ---------------------------------------------------------------- utilidades de texto
  STOP: new Set("a o os as de da do das dos e em no na nos nas um uma para por com sem que se ao à é ser sobre the of and to in".split(" ")),
  norm: (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, ""),
  tokens(s) {
    // radical simples (6 primeiras letras) para aproximar plural/gênero: gerador ~ geradores
    return new Set((this.norm(s).match(/[a-z0-9]{3,}/g) || []).filter((w) => !this.STOP.has(w)).map((w) => w.slice(0, 6)));
  },
  similarity(a, b) {
    const ta = this.tokens(a), tb = this.tokens(b);
    if (!ta.size || !tb.size) return 0;
    let inter = 0;
    for (const t of ta) if (tb.has(t)) inter++;
    return (inter / Math.min(ta.size, tb.size)) * 0.6 + (inter / (ta.size + tb.size - inter)) * 0.4;
  },
  itemText: (it) => ["title", "description", "background", "area_main", "scope"].map((k) => it[k] || "").join(" "),
  inputText: (i) => ["title", "description", "background", "origin", "area_main", "areas_impacted", "areas_impacting"].map((k) => i[k] || "").join(" "),
  relatedItems(db, text, limit = 5, threshold = 0.18) {
    return db.items.map((it) => [this.similarity(text, this.itemText(it)), it]).filter(([s]) => s >= threshold)
      .sort((a, b) => b[0] - a[0]).slice(0, limit)
      .map(([s, it]) => ({ id: it.id, title: it.title, score: Math.round(s * 100) / 100, status: it.status }));
  },
  similarFeedback(db, text, limit = 5) {
    return db.feedback.map((f) => [this.similarity(text, f.text || ""), f]).filter(([s]) => s > 0.1)
      .sort((a, b) => b[0] - a[0]).slice(0, limit).map(([, f]) => f);
  },

  // ---------------------------------------------------------------- avaliação de demandas
  get ASSESS_SCHEMA() {
    const S = (d) => (d ? { type: "string", description: d } : { type: "string" });
    const lvl = { type: "string", enum: ["Alta", "Média", "Baixa"] };
    return {
      type: "object", additionalProperties: false,
      required: ["related", "relation_mode", "include_in", "relation_explanation", "scope", "scope_action", "priority", "urgency",
        "risk_reason", "impacts", "impact_details", "definitions", "project_id", "gap_analysis", "rationale"],
      properties: {
        related: { type: "array", items: { type: "object", additionalProperties: false, required: ["id", "relation"], properties: { id: S(), relation: S() } } },
        relation_mode: { type: "string", enum: ["novo", "incluir_existente"] },
        include_in: S("ID do item on going quando relation_mode=incluir_existente, senão vazio"),
        relation_explanation: S(),
        scope: S("O que é?"), scope_action: S("O que deve ser feito com isso?"),
        priority: lvl, urgency: lvl,
        risk_reason: S("Por que há risco e por que essa urgência"),
        impacts: { type: "array", items: { type: "string", enum: this.IMPACT_TYPES } },
        impact_details: S("Impactos em quais projetos/operações, por quê"),
        definitions: { type: "array", items: { type: "string", enum: Object.keys(this.DEFINITIONS) } },
        project_id: S("Projeto existente relacionado, ou vazio"),
        gap_analysis: S("Possíveis gaps / por que a ação não foi prevista antes"),
        rationale: S(),
      },
    };
  },

  PRIORITY_WORDS: ["urgente", "imediato", "critico", "ministerio", "multa", "acidente", "parada", "parado", "seguranca", "investigacao", "processo", "hq", "diretora"],
  IMPACT_WORDS: {
    Custo: ["custo", "multa", "orcamento", "contrato", "preco", "pagamento", "budget", "financeiro"],
    Eficiência: ["atraso", "produtividade", "eficiencia", "retrabalho", "prazo", "lento", "fluxo"],
    Operação: ["operacao", "gerador", "equipamento", "parada", "parado", "manutencao", "pecas", "yard", "patio", "energia", "voltage"],
    Compliance: ["ministerio", "lei", "auditoria", "norma", "compliance", "regulatorio", "fiscalizacao", "investigacao", "legal"],
    People: ["turnover", "funcionarios", "ambiente", "rh", "saude", "pessoas", "colaboradores", "ventiladores", "treinamento", "clima"],
  },

  heuristicAssess(db, inp, related) {
    const text = this.norm(this.inputText(inp));
    const has = (w) => text.includes(w);
    const learned = this.similarFeedback(db, this.inputText(inp), 1);
    const impacts = Object.entries(this.IMPACT_WORDS).filter(([, ws]) => ws.some(has)).map(([k]) => k);
    const hits = this.PRIORITY_WORDS.filter(has).length;
    const priority = hits >= 2 ? "Alta" : hits === 1 ? "Média" : "Baixa";
    const defs = [];
    if (["risco", "investig", "ministerio", "acidente", "multa"].some(has)) defs.push(has("investig") ? "risco_investigar" : "risco_monitorar");
    const project = db.projects.find((p) => this.similarity(this.inputText(inp), `${p.name || ""} ${p.description || ""}`) > 0.3)?.id || "";
    if (project) defs.push("acao_projeto");
    else if (related.length >= (db.settings.links_for_project_alert || 3)) defs.push("novo_projeto");
    if (!defs.length) defs.push("acao_geral");
    const mode = related.length && related[0].score >= 0.55 ? "incluir_existente" : "novo";
    const out = {
      related: related.map((r) => ({ id: r.id, relation: `${t("similaridade")} ${r.score}` })),
      relation_mode: mode,
      include_in: mode === "incluir_existente" ? related[0].id : "",
      relation_explanation: mode === "incluir_existente" ? "Relação direta (alta similaridade) com item on going."
        : related.length ? "Relacionado em impacto, mas não diretamente: criar item novo e vincular." : "Nenhum item relacionado encontrado.",
      scope: inp.title || "", scope_action: "", priority, urgency: priority, risk_reason: "", impacts, impact_details: "",
      definitions: defs, project_id: project, gap_analysis: "",
      rationale: t("Sugestão heurística (IA offline): palavras-chave, similaridade com o histórico e decisões anteriores."),
    };
    out.msg = ["Sugestão heurística (IA offline): palavras-chave, similaridade com o histórico e decisões anteriores.", {}];
    if (learned.length) {
      const fin = learned[0].final || {};
      for (const k of ["priority", "urgency", "impacts", "definitions"]) if (fin[k] && (!Array.isArray(fin[k]) || fin[k].length)) out[k] = fin[k];
      out.rationale += " " + t("Baseado na decisão anterior em {ref}.", { ref: learned[0].ref });
      out.msg = ["HEUR_LEARNED", { ref: learned[0].ref }];
    }
    return out;
  },

  /** Etapa 2 do fluxo (Assessment): relação com itens on going + classificação + definição sugerida. */
  async assessInput(db, inp) {
    const text = this.inputText(inp);
    const related = this.relatedItems(db, text, 8, 0.12);
    if (!this.enabled()) return { ...this.heuristicAssess(db, inp, related), engine: "heuristica" };
    const pick = (o, ks) => Object.fromEntries(ks.map((k) => [k, o[k]]));
    const ongoing = db.items.filter((it) => it.status !== "Concluído").slice(-80)
      .map((it) => ({ id: it.id, title: it.title, status: it.status, scope: it.scope, priority: it.priority, projects: it.links?.projects || [] }));
    const projects = db.projects.map((p) => ({ id: p.id, name: p.name, description: (p.description || "").slice(0, 300) }));
    const examples = this.similarFeedback(db, text).map((f) => ({ demanda: (f.text || "").slice(0, 500), sugestao_ia: f.ai, decisao_final_usuario: f.final }));
    const J = (x) => JSON.stringify(x);
    const prompt = "Nova demanda (input):\n" + JSON.stringify(pick(inp, ["source", "source_detail", "title", "description", "background", "origin", "area_main", "areas_impacted", "areas_impacting", "owner", "due_date"]), null, 1)
      + "\n\nItens on going na lista geral de governança:\n" + J(ongoing)
      + "\n\nCandidatos mais parecidos (similaridade textual):\n" + J(related)
      + "\n\nProjetos existentes:\n" + J(projects)
      + "\n\nDecisões anteriores do usuário em demandas parecidas (aprenda com elas):\n" + J(examples)
      + "\n\nTarefa: 1) Verifique se tem relação com item já levantado. Relação direta -> relation_mode=incluir_existente "
      + "e include_in=<id>. Relacionado só em impacto -> relation_mode=novo, e liste o vínculo em related. "
      + "2) Classifique escopo (o que é / o que fazer), prioridade, urgência com justificativa do risco, impactos "
      + "(Custo, Eficiência, Operação, Compliance, People) e em quais projetos/operações. "
      + "3) Sugira uma ou mais definições. Use project_id quando for ação dentro de projeto existente. "
      + "4) Aponte gaps: por que isso não foi previsto antes.";
    try {
      const out = await this.call(prompt, this.ASSESS_SCHEMA, "medium");
      const valid = new Set(db.items.map((i) => i.id));
      out.related = (out.related || []).filter((r) => valid.has(r.id));
      if (!valid.has(out.include_in)) { out.include_in = ""; out.relation_mode = "novo"; }
      if (!db.projects.some((p) => p.id === out.project_id)) out.project_id = "";
      out.engine = this.model;
      return out;
    } catch (e) {
      const out = { ...this.heuristicAssess(db, inp, related), engine: "heuristica" };
      out.rationale += ` (${t("Claude falhou:")} ${e.message})`;
      delete out.msg;
      return out;
    }
  },

  // ---------------------------------------------------------------- reuniões
  EXTRACT_SCHEMA: {
    type: "object", additionalProperties: false, required: ["summary", "decisions", "demands"],
    properties: {
      summary: { type: "string" },
      decisions: { type: "array", items: { type: "string" } },
      demands: { type: "array", items: { type: "object", additionalProperties: false,
        required: ["title", "description", "owner", "due_date", "area_main", "related_item"],
        properties: { title: { type: "string" }, description: { type: "string" }, owner: { type: "string" },
          due_date: { type: "string", description: "AAAA-MM-DD ou vazio" }, area_main: { type: "string" },
          related_item: { type: "string", description: "ID de item existente ou vazio" } } } },
    },
  },

  async extractMeeting(db, m) {
    const text = `${m.minutes || ""}\n${m.notes || ""}`;
    if (!this.enabled()) {
      const KW = /^(a[cç][aã]o|action|to-?do|task|pend[eê]ncia|demanda|tarefa|行动|待办|任务)\s*[:：\-]\s*/i;
      const demands = [];
      for (const line of text.split(/\r?\n/)) {
        const l = line.replace(/^[\s\-•*]+|[\s\-•*]+$/g, "");
        if (!KW.test(l)) continue;
        let title = l.replace(KW, "");
        const OWNER = /\s*(?:resp(?:ons[aá]vel)?|owner|负责人)\s*[:：\-]\s*/i;
        const owner = (l.match(new RegExp(OWNER.source + "([^\\d,;，；]+)", "i")) || [, ""])[1].trim();
        const due = (l.match(/(\d{4}-\d{2}-\d{2})/) || [, ""])[1];
        title = title.replace(new RegExp(OWNER.source + ".*$", "i"), "").trim() || title;
        const rel = this.relatedItems(db, title, 1, 0.4);
        demands.push({ title: title.slice(0, 120), description: l, owner, due_date: due, area_main: "", related_item: rel[0]?.id || "" });
      }
      const decisions = text.split(/\r?\n/).filter((l) => /^\s*[-•*]?\s*(decis|决定|决策)/i.test(l)).map((l) => l.replace(/^[\s\-•*]+/, ""));
      return { summary: text.slice(0, 400), decisions, demands, engine: "heuristica",
        hint: "EXTRACT_HINT" };
    }
    const items = db.items.slice(-120).map((it) => ({ id: it.id, title: it.title }));
    const prompt = `Reunião: ${m.title} em ${m.date} — participantes: ${m.participants || ""}\nAta / anotações:\n${text}\n\n`
      + `Itens já existentes na lista de governança:\n${JSON.stringify(items)}\n\n`
      + "Resuma a reunião, liste as decisões e extraia cada demanda/ação nova ou atualização (com responsável e prazo "
      + "quando citados). Se a demanda se refere a um item existente, informe o ID em related_item.";
    try {
      return { ...(await this.call(prompt, this.EXTRACT_SCHEMA, "medium")), engine: this.model };
    } catch (e) {
      return { summary: "", decisions: [], demands: [], engine: "erro", hint: e.message };
    }
  },

  // ---------------------------------------------------------------- master schedule
  heuristicSchedule(rows, ref) {
    if (!rows || !rows.length) return { overview: t("Arquivo armazenado. Formato sem leitura automática (envie .xlsx/.csv/.pdf para análise)."), tasks_count: 0 };
    let hi = rows.slice(0, 15).findIndex((r) => /tarefa|task|atividade|activity/.test(this.norm(r.join(" "))));
    if (hi < 0) hi = 0;
    const head = rows[hi].map((h) => this.norm(h));
    const col = (...ns) => { const i = head.findIndex((h) => ns.some((n) => h.includes(n))); return i < 0 ? null : i; };
    const ci = col("tarefa", "task", "atividade", "activity", "nome", "name"), cs = col("inicio", "start"),
      cf = col("termino", "fim", "finish", "end"), cp = col("%", "progress", "conclu");
    const toDate = (v) => { v = String(v || ""); return /^\d{5}(\.\d+)?$/.test(v) ? new Date(Date.UTC(1899, 11, 30) + Math.round(+v * 864e5)).toISOString().slice(0, 10)
      : /^\d{2}\/\d{2}\/\d{4}/.test(v) ? `${v.slice(6, 10)}-${v.slice(3, 5)}-${v.slice(0, 2)}` : v.slice(0, 10); };
    const tasks = [];
    for (const r of rows.slice(hi + 1)) {
      const g = (c) => (c !== null && c < r.length ? r[c] ?? "" : "");
      const name = g(ci);
      if (!name) continue;
      const raw = String(g(cp));
      let pct = parseFloat(raw.replace("%", "").replace(",", ".")) || 0;
      if (pct > 0 && pct <= 1 && !raw.includes("%")) pct *= 100;
      tasks.push({ task: name, start: toDate(g(cs)), finish: toDate(g(cf)), progress: Math.round(pct) });
    }
    const late = tasks.filter((t) => t.finish && t.finish < ref && t.progress < 100);
    const upcoming = tasks.filter((t) => t.finish && t.finish >= ref && t.progress < 100).sort((a, b) => a.finish.localeCompare(b.finish)).slice(0, 10);
    const done = tasks.filter((t) => t.progress >= 100).length;
    const p = { n: tasks.length, done, late: late.length };
    return { overview: t("{n} atividades lidas; {done} concluídas; {late} atrasadas.", p), msg: ["{n} atividades lidas; {done} concluídas; {late} atrasadas.", p], late: late.slice(0, 20), upcoming, tasks_count: tasks.length };
  },

  SCHEDULE_SCHEMA: (() => {
    const task = { type: "object", additionalProperties: false, required: ["task", "finish", "progress"],
      properties: { task: { type: "string" }, finish: { type: "string" }, progress: { type: "number" } } };
    return {
      type: "object", additionalProperties: false,
      required: ["overview", "phases", "late", "upcoming", "critical_points", "suggested_actions"],
      properties: {
        overview: { type: "string" },
        phases: { type: "array", items: { type: "object", additionalProperties: false, required: ["name", "start", "finish", "status"],
          properties: { name: { type: "string" }, start: { type: "string" }, finish: { type: "string" }, status: { type: "string" } } } },
        late: { type: "array", items: task }, upcoming: { type: "array", items: task },
        critical_points: { type: "array", items: { type: "string" } },
        suggested_actions: { type: "array", items: { type: "string" } },
      },
    };
  })(),

  async analyzeSchedule(project, file, ref) {
    const ext = file.name.toLowerCase().split(".").pop();
    let rows = null;
    try { rows = await Sheet.table(file); } catch (e) { rows = null; }
    if (!this.enabled() || (rows === null && ext !== "pdf")) return { ...this.heuristicSchedule(rows, ref), engine: "heuristica" };
    const intro = `Projeto ${project.id} — ${project.name}. Data de referência: ${ref}.\n`
      + "Organize esta master schedule: visão geral, fases/marcos, atividades atrasadas, próximas entregas "
      + "(próximas 4 semanas), pontos críticos (caminho crítico, interfaces com outras áreas) e ações sugeridas.";
    const content = ext === "pdf"
      ? [{ type: "document", source: { type: "base64", media_type: "application/pdf", data: await fileToB64(file) } }, { type: "text", text: intro }]
      : intro + "\n\nCronograma (tabela):\n" + rows.map((r) => r.join(" | ")).join("\n");
    try {
      return { ...(await this.call(content, this.SCHEDULE_SCHEMA, "medium")), engine: this.model };
    } catch (e) {
      const out = { ...this.heuristicSchedule(rows, ref), engine: "heuristica" };
      out.overview += ` (${t("Claude falhou:")} ${e.message})`;
      delete out.msg;
      return out;
    }
  },

  // ---------------------------------------------------------------- riscos
  RISK_SCHEMA: {
    type: "object", additionalProperties: false,
    required: ["summary", "probability", "impact", "causes", "consequences", "mitigations", "report_points"],
    properties: {
      summary: { type: "string" }, probability: { type: "string", enum: ["Alta", "Média", "Baixa"] },
      impact: { type: "string", enum: ["Alto", "Médio", "Baixo"] },
      causes: { type: "array", items: { type: "string" } }, consequences: { type: "array", items: { type: "string" } },
      mitigations: { type: "array", items: { type: "string" } }, report_points: { type: "array", items: { type: "string" } },
    },
  },

  async analyzeRisk(db, risk, filesText) {
    const empty = { causes: [], consequences: [], mitigations: [], report_points: [] };
    if (!this.enabled()) return { summary: t("IA offline — análise automática indisponível. Preencha manualmente."),
      probability: risk.probability || "Média", impact: risk.impact || "Médio", ...empty, engine: "heuristica" };
    const linked = db.items.filter((it) => (risk.links?.items || []).includes(it.id)).map((i) => ({ id: i.id, title: i.title, risk_reason: i.risk_reason }));
    const prompt = `Risco ${risk.id}: ${risk.title} (${risk.mode})\nDescrição: ${risk.description || ""}\n`
      + `Itens vinculados: ${JSON.stringify(linked)}\nNotas: ${risk.notes || ""}\nConteúdo dos documentos da pasta (texto):\n${filesText.slice(0, 60000)}\n\n`
      + "Compile as informações do risco para análise e reporte. As sugestões serão confirmadas pelo usuário.";
    try {
      return { ...(await this.call(prompt, this.RISK_SCHEMA, "medium")), engine: this.model };
    } catch (e) {
      return { summary: `${t("Falha na análise:")} ${e.message}`, probability: "Média", impact: "Médio", ...empty, engine: "erro" };
    }
  },

  // ---------------------------------------------------------------- summaries
  async narrative(summary) {
    const k = summary.kpis;
    const basic = t("NARRATIVE_BASIC", { ...k, alerts: summary.alerts.length });
    if (!this.enabled()) return basic;
    const prompt = `Escreva os DESTAQUES deste summary de governança (${summary.type}) em até 8 bullets curtos, em ${I18N.aiLanguage()}: `
      + "o que mudou, o que exige atenção da diretoria, riscos, decisões e próximos passos. Use Hoshin Kanri "
      + "para conectar com os objetivos estratégicos. Dados:\n" + JSON.stringify(summary).slice(0, 80000);
    try { return await this.call(prompt, null, "low", 4000); }
    catch (e) { return `${basic}\n(${t("Destaques da IA indisponíveis:")} ${e.message})`; }
  },
};

function fileToB64(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(file); });
}
</script>
<script>
/* Núcleo: base de dados (db.json na pasta escolhida), regras de governança e um "roteador" local
 * com as mesmas rotas que a interface usa (api("inputs/INP001/commit", "POST", {...})). */
const PREFIX = { inputs: "INP", items: "GOV", projects: "PROJ", risks: "RISK", meetings: "MEET", actions: "ACT" };
const COLLECTIONS = Object.keys(PREFIX);
const DB_FILE = "db.json";

const pad = (n) => String(n).padStart(2, "0");
const localISO = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const nowISO = () => localISO();
const todayISO = () => localISO().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso.slice(0, 10) + "T12:00:00"); d.setDate(d.getDate() + n); return localISO(d).slice(0, 10); };
const daysSince = (iso) => (iso ? Math.floor((new Date(todayISO() + "T12:00:00") - new Date(iso.slice(0, 10) + "T12:00:00")) / 864e5) : 0);

class ApiError extends Error {}

function emptyDb() {
  const db = Object.fromEntries(COLLECTIONS.map((c) => [c, []]));
  return Object.assign(db, {
    seq: Object.fromEntries(COLLECTIONS.map((c) => [c, 0])),
    events: [], feedback: [], summaries: [],
    settings: {
      alert_days_without_update: 15,
      project_meeting_cadence_days: 15,
      links_for_project_alert: 3,
      areas: ["Operação", "Manutenção", "RH", "Financeiro", "Jurídico", "Compras", "SSMA", "TI", "Comercial", "Engenharia"],
    },
  });
}

const Core = {
  db: null,

  async load() {
    const f = await Store.read(DB_FILE);
    const base = emptyDb();
    let db = base;
    if (f) {
      try { db = JSON.parse(await f.text()); } catch { throw new Error(t("db.json corrompido na pasta escolhida")); }
      for (const [k, v] of Object.entries(base)) if (db[k] === undefined) db[k] = v;
      for (const c of COLLECTIONS) db.seq[c] ??= 0;
      db.settings = { ...base.settings, ...db.settings };
    }
    this.db = db;
    if (!f) await this.save();
  },
  _saving: Promise.resolve(),
  save() {
    const json = JSON.stringify(this.db, null, 2);
    this._saving = this._saving.then(() => Store.write(DB_FILE, json));
    return this._saving;
  },

  nextId(col) { this.db.seq[col] += 1; return `${PREFIX[col]}${String(this.db.seq[col]).padStart(3, "0")}`; },
  find(col, id) { return this.db[col].find((r) => r.id === id) || null; },
  /** Eventos guardam a chave da mensagem + parâmetros, para serem exibidos no idioma atual. */
  log(type, ref, key, params = {}) { this.db.events.push({ ts: nowISO(), date: todayISO(), type, ref, msg: [key, params], text: I18N.fill(key, params) }); },
  hist(rec, key, params = {}) { (rec.history ??= []).push({ date: nowISO(), msg: [key, params], text: I18N.fill(key, params) }); },
  touch(rec) { rec.updated_at = nowISO(); },
  /** Vínculo bidirecional entre dois registros (ex.: item <-> projeto). */
  link(aCol, aId, bCol, bId) {
    const a = this.find(aCol, aId), b = this.find(bCol, bId);
    if (!a || !b) return;
    for (const [rec, col, id] of [[a, bCol, bId], [b, aCol, aId]]) {
      rec.links ??= {};
      rec.links[col] ??= [];
      if (!rec.links[col].includes(id)) rec.links[col].push(id);
    }
  },
  folderFor(col, id) {
    return { projects: `PROJECTS/${id} INFOS AND GENERAL OVERVIEW`, risks: `RISKS/${id} INFOS AND GENERAL OVERVIEW`, meetings: `MEETINGS/${id}`, items: `ITEMS/${id}` }[col];
  },

  // ------------------------------------------------------------ regras de negócio
  async createRecord(col, data) {
    const db = this.db;
    const rec = { ...data, id: this.nextId(col), created_at: nowISO(), updated_at: nowISO() };
    rec.links ??= {};
    rec.history ??= [];
    if (col === "projects") {
      rec.status ??= "Em andamento";
      rec.actions ??= [];
      rec.schedules ??= [];
      rec.last_monitored = todayISO();
      rec.next_meeting ??= addDays(todayISO(), +db.settings.project_meeting_cadence_days || 15);
      rec.folder = this.folderFor("projects", rec.id);
      await Store.dir(rec.folder + "/master_schedule");
      await Store.dir(rec.folder + "/documentos");
    } else if (col === "risks") {
      rec.status ??= "Aberto";
      rec.mode ??= "Monitorar";
      rec.folder = this.folderFor("risks", rec.id);
      await Store.write(rec.folder + "/LEIA-ME.txt", `${rec.id} INFOS AND GENERAL OVERVIEW\n${rec.title || ""}\n\n`
        + "Coloque aqui todas as informações e documentos a cerca do problema.\n"
        + "A plataforma compila estes arquivos para análise e reporte.\n");
    } else if (col === "meetings") {
      rec.date ||= todayISO();
    } else if (col === "items") {
      rec.status ??= "Aberto";
    }
    db[col].push(rec);
    this.log(`${col}.created`, rec.id, "{id} criado: {label}", { id: rec.id, label: rec.title || rec.name || "" });
    return rec;
  },

  /** Etapas 2 e 3 do fluxo: registra a classificação e a definição, cria/atualiza o item e os módulos ligados. */
  async commitInput(inp, body) {
    const a = body.assessment || {}, defs = body.definitions || [], related = body.related || [];
    const mode = body.relation_mode || "novo";
    let item = mode === "incluir_existente" ? this.find("items", body.include_in || "") : null;
    const included = !!item;
    if (item) {
      const order = { Baixa: 0, Média: 1, Alta: 2 };
      this.hist(item, "Nova entrada {inp} ({source}): {title}", { inp: inp.id, source: [inp.source], title: inp.title });
      for (const k of ["priority", "urgency"]) if ((order[a[k]] ?? -1) > (order[item[k]] ?? -1)) item[k] = a[k];
      item.impacts = [...new Set([...(item.impacts || []), ...(a.impacts || [])])].sort();
      item.definitions = [...new Set([...(item.definitions || []), ...defs])].sort();
      if (item.status === "Concluído") item.status = "Em andamento";
      this.touch(item);
      this.log("items.updated", item.id, "{id} atualizado com a entrada {inp}", { id: item.id, inp: inp.id });
    } else {
      item = await this.createRecord("items", {
        title: inp.title, description: inp.description, background: inp.background, source: inp.source, source_detail: inp.source_detail,
        origin: a.origin || inp.origin, area_main: inp.area_main, areas_impacted: inp.areas_impacted, areas_impacting: inp.areas_impacting,
        owner: inp.owner, due_date: inp.due_date, emitted_at: (inp.created_at || "").slice(0, 10),
        scope: a.scope, scope_action: a.scope_action, priority: a.priority, urgency: a.urgency, risk_reason: a.risk_reason,
        impacts: a.impacts || [], impact_details: a.impact_details, gap_analysis: a.gap_analysis, definitions: defs,
      });
    }
    this.link("inputs", inp.id, "items", item.id);
    for (const rid of related) if (rid !== item.id && this.find("items", rid)) this.link("items", item.id, "items", rid);
    if (inp.meeting_id && this.find("meetings", inp.meeting_id)) this.link("items", item.id, "meetings", inp.meeting_id);

    const created = { item: item.id };
    for (const d of defs) {
      const openRisks = (item.links.risks || []).map((x) => this.find("risks", x)).filter((r) => r && r.status !== "Fechado");
      if ((d === "risco_monitorar" || d === "risco_investigar") && included && openRisks.length) {
        // item on going já tem risco aberto: registra a nova informação nele em vez de duplicar
        for (const r of openRisks) {
          this.hist(r, "Nova entrada {inp}: {title}", { inp: inp.id, title: inp.title });
          if (d === "risco_investigar") r.mode = "Investigar";
          this.touch(r);
        }
        (created.risks ??= []).push(...openRisks.map((r) => r.id));
      } else if (d === "novo_projeto" && included && item.links.projects?.length) {
        created.project = item.links.projects[0];
      } else if (d === "risco_monitorar" || d === "risco_investigar") {
        const risk = await this.createRecord("risks", {
          title: inp.title, description: inp.description, owner: inp.owner, mode: d === "risco_investigar" ? "Investigar" : "Monitorar",
          probability: a.urgency || "Média", impact: { Alta: "Alto", Média: "Médio", Baixa: "Baixo" }[a.priority] || "Médio", notes: a.risk_reason || "",
        });
        this.link("items", item.id, "risks", risk.id);
        (created.risks ??= []).push(risk.id);
      } else if (d === "novo_projeto") {
        const proj = await this.createRecord("projects", { name: body.new_project_name || inp.title, description: inp.description, owner: inp.owner, origin_item: item.id });
        this.link("items", item.id, "projects", proj.id);
        created.project = proj.id;
      } else if (d === "acao_projeto") {
        const proj = this.find("projects", body.project_id || "");
        if (!proj) throw new ApiError(t("Selecione o projeto para 'Ação dentro de um projeto'."));
        const actId = this.nextId("actions");
        proj.actions.push({ id: actId, text: inp.title, item_id: item.id, owner: inp.owner, due: inp.due_date, status: "Aberta",
          gap_reason: body.gap_reason || a.gap_analysis || "", created_at: nowISO() });
        this.touch(proj);
        this.link("items", item.id, "projects", proj.id);
        this.log("projects.action", proj.id, "Ação {act} incluída no portfólio de {id}: {title}", { act: actId, id: proj.id, title: inp.title });
        created.action = actId;
      } else if (d === "info_reportar") {
        item.report = true;
      }
    }
    // aprendizado: guarda sugestão x decisão
    this.db.feedback.push({ date: nowISO(), ref: inp.id, text: AI.inputText(inp), ai: inp.ai_suggestion || null, final: { ...a, definitions: defs, relation_mode: mode } });
    Object.assign(inp, { status: "Registrado", item_id: item.id, assessment: a, definitions: defs });
    this.touch(inp);
    this.log("inputs.committed", inp.id, "{inp} classificado e registrado em {item} ({defs})", { inp: inp.id, item: item.id, defs: defs.map((d) => AI.DEFINITIONS[d] || d) });
    return created;
  },

  alerts() {
    const db = this.db, s = db.settings, out = [], today = todayISO();
    const add = (level, ref, key, params) => out.push({ level, ref, msg: [key, params], text: I18N.fill(key, params) });
    const limit = +s.alert_days_without_update || 15, n = +s.links_for_project_alert || 3;
    for (const p of db.projects) {
      if (["Concluído", "Cancelado"].includes(p.status)) continue;
      const d = daysSince(p.last_monitored || p.updated_at);
      if (d >= limit) add("alta", p.id, "Projeto {id} — {name}: {d} dias sem monitoramento/atualização.", { id: p.id, name: p.name, d });
      if (p.next_meeting && p.next_meeting <= today) add("media", p.id, "Reunião de acompanhamento de {id} prevista para {date}.", { id: p.id, date: p.next_meeting });
    }
    for (const it of db.items) {
      if (it.status === "Concluído") continue;
      const L = it.links || {};
      if ((L.items || []).length >= n && !(L.projects || []).length)
        add("alta", it.id, "{id} está interligado a {n} itens: avaliar criação de um projeto com overview maior.", { id: it.id, n: L.items.length });
      if (it.due_date && it.due_date < today) add("alta", it.id, "{id} — {title}: prazo vencido em {date}.", { id: it.id, title: it.title, date: it.due_date });
      if ((L.inputs || []).length >= n) add("media", it.id, "{id} recebeu {n} entradas: tema recorrente.", { id: it.id, n: L.inputs.length });
    }
    for (const r of db.risks) {
      if (r.status !== "Fechado" && daysSince(r.updated_at) >= limit) add("media", r.id, "Risco {id} sem atualização há {d} dias.", { id: r.id, d: daysSince(r.updated_at) });
    }
    const pending = db.inputs.filter((i) => i.status !== "Registrado").length;
    if (pending) add("baixa", "inputs", "{n} entradas aguardando classificação.", { n: pending });
    return out;
  },

  buildSummary(kind, ref) {
    const db = this.db, today = todayISO();
    let s = ref, e = ref;
    if (kind === "weekly") {
      const wd = (new Date(ref + "T12:00:00").getDay() + 6) % 7; // segunda = 0
      s = addDays(ref, -wd); e = addDays(s, 6);
    }
    const inr = (iso) => !!iso && s <= iso.slice(0, 10) && iso.slice(0, 10) <= e;
    const events = db.events.filter((ev) => inr(ev.date));
    const open = db.items.filter((i) => i.status !== "Concluído");
    const newInputs = db.inputs.filter((i) => inr(i.created_at));
    const bySource = {};
    for (const i of newInputs) (bySource[i.source || "Outro"] ??= []).push({ id: i.id, title: i.title, status: i.status });
    const updIds = new Set(events.filter((ev) => ev.type.startsWith("items.")).map((ev) => ev.ref));
    const horizon = addDays(e, 7);
    const brief = (i) => ({ id: i.id, title: i.title, owner: i.owner, due_date: i.due_date, priority: i.priority, status: i.status });
    const activeP = db.projects.filter((p) => !["Concluído", "Cancelado"].includes(p.status));
    const openR = db.risks.filter((r) => r.status !== "Fechado");
    const summary = {
      type: kind === "weekly" ? "Summary semanal" : "Summary diário",
      period: { start: s, end: e },
      generated_at: nowISO(),
      kpis: {
        new_inputs: newInputs.length,
        items_created: db.items.filter((i) => inr(i.created_at)).length,
        items_updated: updIds.size,
        open_items: open.length,
        high_priority_open: open.filter((i) => i.priority === "Alta").length,
        overdue: open.filter((i) => i.due_date && i.due_date < today).length,
        meetings: db.meetings.filter((m) => inr(m.date)).length,
        open_risks: openR.length,
        active_projects: activeP.length,
      },
      inputs_by_source: bySource,
      critical_items: open.filter((i) => i.priority === "Alta").slice(0, 25).map(brief),
      due_items: open.filter((i) => i.due_date && i.due_date <= horizon).map(brief).sort((a, b) => a.due_date.localeCompare(b.due_date)),
      projects: activeP.map((p) => ({ id: p.id, name: p.name, status: p.status, next_meeting: p.next_meeting,
        open_actions: (p.actions || []).filter((a) => a.status !== "Concluída").length, last_monitored: p.last_monitored })),
      risks: openR.map((r) => ({ id: r.id, title: r.title, mode: r.mode, probability: r.probability, impact: r.impact, status: r.status })),
      meetings: db.meetings.filter((m) => inr(m.date)).map((m) => ({ id: m.id, title: m.title, date: m.date, decisions: m.decisions || [], items: m.links?.items || [] })),
      report_items: open.filter((i) => i.report).map(brief),
      activity: events.slice(-200).map((ev) => ({ ts: ev.ts, msg: ev.msg, text: ev.text })),
      alerts: this.alerts(),
    };
    if (kind === "weekly") {
      summary.activity_per_day = {};
      for (const ev of events) summary.activity_per_day[ev.date] = (summary.activity_per_day[ev.date] || 0) + 1;
    }
    return summary;
  },

  exportCsv() {
    const q = (v) => { v = Array.isArray(v) ? v.join(", ") : String(v ?? ""); return /[;"\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
    const tv = (v) => (Array.isArray(v) ? v.map((x) => t(x)) : v ? t(v) : "");
    const lines = [["ID", "Título", "Status", "Origem", "Detalhe origem", "De onde veio", "Responsável", "Data emitida", "Prazo",
      "Escopo (o que é)", "O que fazer", "Prioridade", "Urgência", "Justificativa risco", "Impactos", "Detalhe impactos",
      "Área principal", "Áreas impactadas", "Definições", "Projetos", "Riscos", "Reuniões", "Itens relacionados", "Atualizado em"].map((h) => (h === "ID" ? h : t(h)))];
    for (const i of this.db.items) {
      const L = i.links || {};
      lines.push([i.id, i.title, tv(i.status), tv(i.source), tv(i.source_detail), i.origin, i.owner, i.emitted_at || (i.created_at || "").slice(0, 10), i.due_date,
        i.scope, i.scope_action, tv(i.priority), tv(i.urgency), i.risk_reason, tv(i.impacts || []), i.impact_details, i.area_main, i.areas_impacted,
        tv((i.definitions || []).map((d) => AI.DEFINITIONS[d] || d)), L.projects || [], L.risks || [], L.meetings || [], L.items || [], i.updated_at]);
    }
    return "﻿" + lines.map((r) => r.map(q).join(";")).join("\r\n");
  },

  /** Registra arquivos colocados diretamente na pasta local master_schedule. */
  async syncSchedules(p) {
    const files = await Store.list(p.folder + "/master_schedule");
    const known = new Set((p.schedules || []).map((s) => s.rel));
    for (const f of files) if (!known.has(f.rel)) p.schedules.push({ rel: f.rel, name: f.name, uploaded_at: f.modified, size: f.size, analysis: null });
    const present = new Set(files.map((f) => f.rel));
    const before = p.schedules.length;
    p.schedules = p.schedules.filter((s) => present.has(s.rel));
    return files.length !== known.size || before !== p.schedules.length;
  },

  async filesText(folder) {
    const parts = [];
    for (const f of await Store.list(folder)) {
      const file = await Store.read(f.rel), n = f.name.toLowerCase();
      if (/\.(txt|md|csv)$/.test(n) && f.size < 500000) parts.push(`--- ${f.name} ---\n${await file.text()}`);
      else if (/\.xlsx?$/.test(n)) {
        try { parts.push(`--- ${f.name} ---\n` + ((await Sheet.table(file)) || []).slice(0, 300).map((r) => r.join(" | ")).join("\n")); }
        catch { parts.push(`--- ${f.name} (unreadable) ---`); }
      } else parts.push(`--- ${f.name} (binary file, ${f.size} bytes) ---`);
    }
    return parts.join("\n");
  },

  /** Versão do summary salva na pasta local SUMMARIES (abre no navegador / imprime em PDF). */
  summaryHtml(s, text) {
    const esc = (x) => String(x ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const coded = ["status", "mode", "probability", "impact", "priority"];
    const rows = (lst, cols) => lst.map((r) => "<tr>" + cols.map((c) => `<td>${esc(coded.includes(c) && r[c] ? t(r[c]) : r[c])}</td>`).join("") + "</tr>").join("") || `<tr><td colspan=${cols.length}>—</td></tr>`;
    const th = (hs) => "<tr>" + hs.map((h) => `<th>${esc(h === "ID" ? h : t(h))}</th>`).join("") + "</tr>";
    const k = s.kpis;
    const kp = [["Novas demandas", k.new_inputs], ["Itens criados", k.items_created], ["Itens atualizados", k.items_updated], ["Em aberto", k.open_items],
      ["Alta prioridade", k.high_priority_open], ["Vencidos", k.overdue], ["Reuniões", k.meetings], ["Riscos abertos", k.open_risks], ["Projetos ativos", k.active_projects]];
    const msgOf = (a) => (a.msg ? t(a.msg[0], a.msg[1]) : a.text);
    return `<!doctype html><html lang="${I18N.htmlLang()}"><meta charset="utf-8"><title>${esc(t(s.type))} ${esc(s.period.start)}</title>
<style>body{font:14px system-ui;margin:32px;color:#1f2937}h1{margin:0}h2{border-bottom:2px solid #1e3a8a;padding-bottom:4px;margin-top:28px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #d1d5db;padding:4px 8px;text-align:left}.k{display:inline-block;margin:6px 12px 6px 0;padding:8px 12px;background:#eef2ff;border-radius:8px}</style>
<h1>${esc(t(s.type))}</h1><p>${esc(t("Período"))}: ${esc(s.period.start)} – ${esc(s.period.end)} · ${esc(t("gerado"))} ${esc(s.generated_at)}</p>
<h2>1. ${esc(t("Destaques"))}</h2><div style="white-space:pre-wrap">${esc(text)}</div>
<h2>2. ${esc(t("Indicadores"))}</h2>${kp.map(([n, v]) => `<span class=k><b>${v}</b> ${esc(t(n))}</span>`).join("")}
<h2>3. ${esc(t("Novas demandas por origem"))}</h2>${Object.entries(s.inputs_by_source).map(([src, l]) => `<h3>${esc(t(src))}</h3><table>${rows(l, ["id", "title", "status"])}</table>`).join("") || "<p>—</p>"}
<h2>4. ${esc(t("Itens críticos (alta prioridade)"))}</h2><table>${th(["ID", "Título", "Responsável", "Prazo", "Status"])}${rows(s.critical_items, ["id", "title", "owner", "due_date", "status"])}</table>
<h2>5. ${esc(t("Prazos — vencidos e próximos 7 dias"))}</h2><table>${th(["ID", "Título", "Responsável", "Prazo"])}${rows(s.due_items, ["id", "title", "owner", "due_date"])}</table>
<h2>6. ${esc(t("Projetos"))}</h2><table>${th(["ID", "Projeto", "Status", "Ações abertas", "Próx. reunião"])}${rows(s.projects, ["id", "name", "status", "open_actions", "next_meeting"])}</table>
<h2>7. ${esc(t("Riscos"))}</h2><table>${th(["ID", "Risco", "Modo", "Prob.", "Impacto"])}${rows(s.risks, ["id", "title", "mode", "probability", "impact"])}</table>
<h2>8. ${esc(t("Reuniões e decisões"))}</h2>${s.meetings.map((m) => `<p><b>${esc(m.id)} — ${esc(m.title)}</b> (${esc(m.date)})<br>${m.decisions.map(esc).join("<br>") || esc(t("Sem decisões registradas"))}</p>`).join("") || "<p>—</p>"}
<h2>9. ${esc(t("Infos a reportar"))}</h2><table>${th(["ID", "Título", "Responsável", "Status"])}${rows(s.report_items, ["id", "title", "owner", "status"])}</table>
<h2>10. ${esc(t("Alertas"))}</h2><ul>${s.alerts.map((a) => `<li>${esc(msgOf(a))}</li>`).join("") || "<li>—</li>"}</ul>`;
  },

  // ------------------------------------------------------------ roteador local
  async api(path, method = "GET", body = {}) {
    const res = await this.route(path.split("?")[0].replace(/^\/+|\/+$/g, "").split("/"), method, body || {});
    if (method !== "GET" || res?._dirty) await this.save();
    if (res && res._dirty) delete res._dirty;
    return res === undefined ? res : structuredClone(res);
  },

  async route(parts, method, body) {
    const db = this.db;
    const [head, rid, action] = parts;

    if (head === "state" && method === "GET") {
      let dirty = false;
      for (const p of db.projects) dirty = (await this.syncSchedules(p)) || dirty;
      return { _dirty: dirty, db: Object.fromEntries([...COLLECTIONS, "settings"].map((k) => [k, db[k]])), events: db.events.slice(-60),
        alerts: this.alerts(), ai: AI.status(), workspace: Store.name, definitions: AI.DEFINITIONS, impact_types: AI.IMPACT_TYPES,
        summaries: db.summaries.slice(-30), today: todayISO() };
    }
    if (head === "settings" && method === "PATCH") { Object.assign(db.settings, body); return db.settings; }

    if (head === "summary" && method === "POST") {
      const kind = body.type || "daily";
      const summary = this.buildSummary(kind, body.date || todayISO());
      const text = body.narrative === false ? "" : await AI.narrative(summary);
      const file = `SUMMARIES/${kind === "weekly" ? "semanal" : "diario"}_${summary.period.start}_${I18N.lang}.html`;
      await Store.write(file, this.summaryHtml(summary, text));
      db.summaries = db.summaries.filter((x) => x.file !== file);
      db.summaries.push({ type: kind, period: summary.period, file, generated_at: nowISO() });
      return { summary, narrative: text, file };
    }

    if (!COLLECTIONS.includes(head) || head === "actions") throw new ApiError("Unknown route");
    const col = head;

    if (method === "POST" && !rid) {
      const data = { ...body };
      delete data.id;
      const rec = await this.createRecord(col, data);
      if (col === "inputs") {
        rec.status = "Novo";
        if (rec.meeting_id) this.link("inputs", rec.id, "meetings", rec.meeting_id);
      }
      const proj = col === "meetings" && rec.project_id ? this.find("projects", rec.project_id) : null;
      if (proj) {
        this.link("meetings", rec.id, "projects", proj.id);
        proj.next_meeting = addDays(rec.date, +db.settings.project_meeting_cadence_days || 15);
        proj.last_monitored = todayISO();
      }
      return rec;
    }

    const rec = rid ? this.find(col, rid) : null;
    if (rid && !rec) throw new ApiError(t("{id} não encontrado", { id: rid }));

    if (method === "GET" && rec && !action) return rec;
    if (method === "PATCH" && rec && !action) {
      const data = { ...body };
      for (const k of ["id", "created_at", "links", "folder"]) delete data[k];
      const note = data._note;
      delete data._note;
      Object.assign(rec, data);
      if (note) (rec.history ??= []).push({ date: nowISO(), text: note });  // texto do usuário: não traduzido
      if (col === "projects") rec.last_monitored = todayISO();
      this.touch(rec);
      if (note) this.log(`${col}.updated`, rid, "{id} atualizado: {note}", { id: rid, note });
      else this.log(`${col}.updated`, rid, "{id} atualizado", { id: rid });
      return rec;
    }
    if (method === "DELETE" && rec) {
      db[col] = db[col].filter((r) => r.id !== rid);
      for (const other of COLLECTIONS) for (const r of db[other]) {
        const lst = r.links?.[col];
        if (lst?.includes(rid)) lst.splice(lst.indexOf(rid), 1);
      }
      this.log(`${col}.deleted`, rid, "{id} removido (a pasta local foi mantida)", { id: rid });
      return { ok: true };
    }

    // ---- ações específicas
    if (method === "POST" && action === "link") {
      if (!this.find(body.collection, body.id)) throw new ApiError(t("{id} não encontrado", { id: body.id }));
      this.link(col, rid, body.collection, body.id);
      this.log("link", rid, "{a} vinculado a {b}", { a: rid, b: body.id });
      return rec;
    }
    if (col === "inputs" && action === "suggest") {
      rec.ai_suggestion = await AI.assessInput(db, rec);
      rec.status = "Em avaliação";
      this.touch(rec);
      return rec;
    }
    if (col === "inputs" && action === "commit") return { input: rec, created: await this.commitInput(rec, body) };
    if (col === "projects" && action === "upload") {
      const sub = (body.kind || "schedule") === "schedule" ? "master_schedule" : "documentos";
      const rel = await Store.writeUnique(`${rec.folder}/${sub}`, body.file.name, body.file);
      await this.syncSchedules(rec);
      rec.last_monitored = todayISO();
      this.touch(rec);
      this.log("projects.upload", rid, "Upload em {id}: {file}", { id: rid, file: rel.split("/").pop() });
      return rec;
    }
    if (col === "projects" && action === "analyze") {
      const sched = rec.schedules.find((s) => s.rel === body.rel);
      const file = sched && (await Store.read(sched.rel));
      if (!file) throw new ApiError(t("Cronograma não encontrado na pasta"));
      sched.analysis = await AI.analyzeSchedule(rec, file, todayISO());
      sched.analyzed_at = nowISO();
      this.touch(rec);
      this.log("projects.analyzed", rid, "Master schedule de {id} analisada: {file}", { id: rid, file: sched.name });
      return rec;
    }
    if (col === "projects" && action === "actions") {
      if (body.id) {
        const act = rec.actions.find((a) => a.id === body.id);
        if (!act) throw new ApiError(t("Ação não encontrada"));
        Object.assign(act, body);
      } else {
        rec.actions.push({ ...body, id: this.nextId("actions"), status: body.status || "Aberta", created_at: nowISO() });
      }
      rec.last_monitored = todayISO();
      this.touch(rec);
      if (body.id) this.log("projects.action", rid, "Portfólio {id}: ação {act} → {status}", { id: rid, act: body.id, status: [body.status || ""] });
      else this.log("projects.action", rid, "Portfólio {id}: ação {act} criada", { id: rid, act: rec.actions.at(-1).id });
      return rec;
    }
    if (["risks", "meetings", "items"].includes(col) && action === "upload") {
      const rel = await Store.writeUnique(this.folderFor(col, rid), body.file.name, body.file);
      this.touch(rec);
      this.log(`${col}.upload`, rid, "Documento anexado a {id}: {file}", { id: rid, file: rel.split("/").pop() });
      return rec;
    }
    if (action === "files" && method === "GET") return Store.list(rec.folder || this.folderFor(col, rid));
    if (col === "risks" && action === "analyze") {
      rec.analysis = await AI.analyzeRisk(db, rec, await this.filesText(rec.folder));
      this.touch(rec);
      this.log("risks.analyzed", rid, "Risco {id} analisado", { id: rid });
      return rec;
    }
    if (col === "meetings" && action === "extract") {
      const out = await AI.extractMeeting(db, rec);
      rec.extraction = out;
      if (out.decisions?.length) rec.decisions = out.decisions;
      this.touch(rec);
      return rec;
    }
    throw new ApiError("Unknown route");
  },
};
</script>
<script>
/* Plataforma de Governança — interface (JS puro, sem build).
 * Textos de tela passam por t() (i18n.js). Valores guardados nos dados (status, prioridade, origem…)
 * ficam como códigos fixos em português e são traduzidos só na exibição, com tv(). */
let S = null; // estado vindo de Core.api("state")

const SOURCES = ["Diretora", "Reunião", "Departamento", "HQ", "Outro"];
const INPUT_KIND = ["Pedido pontual", "Direcionamento / estratégia (reclamação, opinião)", "Nova solicitação do HQ", "Decisão conjunta entre departamentos", "Atualização de item existente", "Outro"];
const STATUS_ITEM = ["Aberto", "Em andamento", "Aguardando", "Concluído"];
const LEVELS = ["Alta", "Média", "Baixa"];

// ------------------------------------------------------------------ utilidades
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pill = (txt, cls = "") => (txt ? `<span class="pill ${esc(cls)}">${esc(txt)}</span>` : "");
const tv = (v) => (v ? t(v) : "");
const prio = (p) => pill(tv(p), "p-" + p);
const opts = (list, sel) => list.map((o) => `<option value="${esc(o)}" ${o === sel ? "selected" : ""}>${esc(t(o))}</option>`).join("");
const msg = (r) => (r.msg ? t(r.msg[0], r.msg[1]) : r.text || "");
const byId = (col, id) => (S.db[col] || []).find((r) => r.id === id);
const defLabel = (d) => t(S.definitions[d] || d);
const fmt = (iso) => (iso ? iso.replace("T", " ").slice(0, 16) : "");
const th = (heads) => `<tr>${heads.map((h) => `<th>${h === "ID" ? "ID" : esc(t(h))}</th>`).join("")}</tr>`;
const L = (text) => `<label>${esc(t(text))}</label>`;
const timeline = (list) => list.map((h) => `<li><span class="muted">${fmt(h.date || h.ts)}</span> ${esc(msg(h))}</li>`).join("") || '<li class="muted">—</li>';

const api = (path, method = "GET", body) => Core.api(path, method, body);
function toast(text) {
  const el = $("#toast"); el.textContent = text; el.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add("hidden"), 3500);
}
async function busy(btn, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = t("Processando…");
  try { await fn(); } catch (e) { toast(t("Erro: ") + t(e.message)); } finally { btn.disabled = false; btn.textContent = old; }
}
function openModal(html) { $("#modal-body").innerHTML = html; $("#modal").classList.remove("hidden"); }
function closeModal() { $("#modal").classList.add("hidden"); }
async function uploadFiles(path, input, extra = {}) {
  if (!input.files.length) throw new Error(t("Escolha um arquivo."));
  for (const f of input.files) await api(path, "POST", { file: f, ...extra });
}
/** Abre um arquivo da pasta local numa nova aba. */
async function openFile(rel) {
  const f = await Store.read(rel);
  if (!f) return toast(t("Arquivo não encontrado na pasta."));
  const type = rel.toLowerCase().endsWith(".html") ? "text/html" : f.type || "application/octet-stream";
  const url = URL.createObjectURL(new Blob([f], { type }));
  if (/\.(html|pdf|png|jpe?g|gif|txt|csv)$/i.test(rel)) window.open(url, "_blank");
  else download(url, f.name);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function download(url, name) { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function fileLink(rel, label) { return `<a href="#" data-rel="${esc(rel)}" onclick="openFile(this.dataset.rel);return false">${esc(label)}</a>`; }
function exportCsv() {
  const url = URL.createObjectURL(new Blob([Core.exportCsv()], { type: "text/csv;charset=utf-8" }));
  download(url, `${t("lista_governanca")}_${S.today}.csv`);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function linksHtml(rec) {
  const names = { items: "Itens", projects: "Projetos", risks: "Riscos", meetings: "Reuniões", inputs: "Entradas" };
  const views = { items: "lista", projects: "projetos", risks: "riscos", meetings: "reunioes", inputs: "entradas" };
  const parts = Object.entries(rec.links || {}).filter(([, v]) => v.length).map(([k, v]) =>
    `<b>${esc(t(names[k] || k))}:</b> ` + v.map((id) => `<a href="#${views[k]}/${id}" onclick="closeModal()">${esc(id)}</a>`).join(", "));
  return parts.join(" · ") || `<span class="muted">${t("sem vínculos")}</span>`;
}
function linkForm(col, id) {
  return `<div class="toolbar"><select id="lk-col"><option value="items">${t("Item")}</option><option value="projects">${t("Projeto")}</option><option value="risks">${t("Risco")}</option><option value="meetings">${t("Reunião")}</option></select>
    <input id="lk-id" placeholder="${esc(t("ID (ex.: GOV003)"))}"><button class="ghost small" onclick="addLink('${col}','${id}')">${t("Vincular")}</button></div>`;
}
async function addLink(col, id) {
  try { await api(`${col}/${id}/link`, "POST", { collection: $("#lk-col").value, id: $("#lk-id").value.trim().toUpperCase() }); toast(t("Vínculo criado")); await refresh(); }
  catch (e) { toast(t(e.message)); }
}

// ------------------------------------------------------------------ idioma
function applyStaticTexts() {
  document.documentElement.lang = { pt: "pt-BR", en: "en", zh: "zh-CN" }[I18N.lang];
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  const sel = $("#lang");
  if (sel) sel.value = I18N.lang;
}
async function setLang(l) {
  await I18N.set(l);
  applyStaticTexts();
  if (S) await refresh(); else welcome(await Store.remembered());
}

// ------------------------------------------------------------------ roteamento
async function refresh() { S = await api("state"); render(); }
function render() {
  if (!S) return;
  const [view, id] = (location.hash.slice(1) || "painel").split("/");
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "#" + view));
  const b = $("#ai-badge");
  b.className = "badge" + (S.ai.enabled ? " on" : "");
  document.querySelector(".brand .ai").textContent = I18N.lang === "pt" ? "IA" : "AI";
  b.textContent = S.ai.enabled ? t("IA: ") + S.ai.model : t("IA offline (heurística)");
  b.title = S.ai.detail ? t(S.ai.detail) : "";
  const V = { painel: viewPainel, entradas: viewEntradas, lista: viewLista, projetos: viewProjetos, reunioes: viewReunioes, riscos: viewRiscos, summaries: viewSummaries, config: viewConfig }[view] || viewPainel;
  $("#view").innerHTML = V(id);
  if (V === viewEntradas && id) openTriage(id);
  if (V === viewLista && id) openItem(id);
}

function openTriage(id) {
  const inp = byId("inputs", id);
  if (!inp) return;
  const sug = inp.ai_suggestion, a = inp.assessment || sug || {};
  const defs = inp.definitions || a.definitions || [];
  const done = inp.status === "Registrado";
  const items = S.db.items, projects = S.db.projects;
  const rel = (iid) => (a.related || []).find((r) => r.id === iid);
  openModal(`<h2>${inp.id} · ${esc(inp.title)}</h2>
  <p class="muted">${[tv(inp.source), tv(inp.source_detail), fmt(inp.created_at), inp.origin ? t("veio de") + " " + inp.origin : ""].filter(Boolean).map(esc).join(" · ")}</p>
  <p>${esc(inp.description)}</p>${inp.background ? `<p class="muted"><b>${t("Contexto:")}</b> ${esc(inp.background)}</p>` : ""}
  ${sug ? `<div class="ai-box"><b>${t("Sugestão da IA")}</b> (${esc(tv(sug.engine))}): ${esc(sug.msg ? msg(sug) : sug.rationale)}${sug.gap_analysis ? "\n" + t("Gaps:") + " " + esc(sug.gap_analysis) : ""}${sug.relation_explanation ? "\n" + t("Relação:") + " " + esc(t(sug.relation_explanation)) : ""}</div>`
        : `<div class="actions"><button onclick="busy(this, async()=>{await api('inputs/${id}/suggest','POST'); await refresh();})">${t("Pedir sugestão da IA")}</button></div>`}
  <div class="steps"><span class="step on">${t("2. Assessment")}</span></div>
  <h3>${t("2.1 Tem relação com item já levantado?")}</h3>
  <div class="row"><div>${L("Relação")}<select id="t-mode">
    <option value="novo" ${a.relation_mode !== "incluir_existente" ? "selected" : ""}>${t("Não / relação só em impacto → criar item novo")}</option>
    <option value="incluir_existente" ${a.relation_mode === "incluir_existente" ? "selected" : ""}>${t("Sim, relação direta → incluir no item on going")}</option></select></div>
    <div>${L("Item on going (relação direta)")}<select id="t-include"><option value="">—</option>${items.map((i) => `<option value="${i.id}" ${i.id === a.include_in ? "selected" : ""}>${i.id} · ${esc(i.title)}</option>`).join("")}</select></div></div>
  ${L("Itens relacionados (vincular)")}<div class="checks" style="max-height:140px;overflow:auto">${items.map((i) => `<label><input type="checkbox" class="t-rel" value="${i.id}" ${rel(i.id) ? "checked" : ""}> ${i.id} · ${esc(i.title)} ${rel(i.id) ? `<span class="muted">(${esc(rel(i.id).relation)})</span>` : ""}</label>`).join("") || `<span class="muted">${t("Lista geral vazia.")}</span>`}</div>
  <h3>${t("2.2 Classificação")}</h3>
  <div class="row"><div>${L("Escopo — o que é?")}<input id="t-scope" value="${esc(a.scope)}"></div><div>${L("O que deve ser feito com isso?")}<input id="t-scope-act" value="${esc(a.scope_action)}"></div></div>
  <div class="row"><div>${L("Prioridade")}<select id="t-prio">${opts(LEVELS, a.priority || "Média")}</select></div>
    <div>${L("Urgência")}<select id="t-urg">${opts(LEVELS, a.urgency || "Média")}</select></div>
    <div>${L("De onde a demanda veio")}<input id="t-origin" value="${esc(a.origin || inp.origin || tv(inp.source))}"></div></div>
  ${L("Riscos e urgência — explique o porquê")}<textarea id="t-risk" style="min-height:50px">${esc(a.risk_reason)}</textarea>
  ${L("Impactos")}<div class="checks" style="display:flex;gap:16px;flex-wrap:wrap">${S.impact_types.map((x) => `<label><input type="checkbox" class="t-imp" value="${x}" ${(a.impacts || []).includes(x) ? "checked" : ""}> ${esc(t(x))}</label>`).join("")}</div>
  ${L("Impactos em quais projetos / operações, por quê")}<textarea id="t-impd" style="min-height:50px">${esc(a.impact_details)}</textarea>
  ${L("Gaps (por que não foi previsto antes?)")}<textarea id="t-gap" style="min-height:50px">${esc(a.gap_analysis)}</textarea>
  <div class="steps" style="margin-top:14px"><span class="step on">${t("3. Definição (pode ser mais de uma)")}</span></div>
  <div class="checks">${Object.entries(S.definitions).map(([k, v]) => `<label><input type="checkbox" class="t-def" value="${k}" ${defs.includes(k) ? "checked" : ""}> ${esc(t(v))}</label>`).join("")}</div>
  <div class="row"><div>${L('Projeto (para "Ação dentro de um projeto")')}<select id="t-proj"><option value="">—</option>${projects.map((p) => `<option value="${p.id}" ${p.id === a.project_id ? "selected" : ""}>${p.id} · ${esc(p.name)}</option>`).join("")}</select></div>
    <div>${L('Nome do novo projeto (se "Criação de um novo projeto")')}<input id="t-newproj" value="${esc(inp.title)}"></div></div>
  <div class="actions">${done ? `<span class="pill p-Baixa">${t("Registrado em")} ${inp.item_id}</span> <a class="btn ghost" href="#lista/${inp.item_id}">${t("Abrir item")}</a>` : `<button onclick="busy(this, ()=>commitTriage('${id}'))">${t("Confirmar e registrar na lista geral")}</button>`}
    <button class="ghost" onclick="if(confirm(t('Excluir entrada?'))) api('inputs/${id}','DELETE').then(()=>{closeModal();location.hash='entradas';refresh();})">${t("Excluir")}</button></div>
  <p class="muted">${t("Ao confirmar, a IA guarda a sua decisão (vs. a sugestão) para aprender os critérios de classificação.")}</p>`);
}
async function commitTriage(id) {
  const vals = (cls) => [...document.querySelectorAll("." + cls)].filter((c) => c.checked).map((c) => c.value);
  const definitions = vals("t-def");
  if (!definitions.length) throw new Error(t("Escolha ao menos uma definição."));
  const body = {
    relation_mode: $("#t-mode").value, include_in: $("#t-include").value, related: vals("t-rel"), definitions,
    project_id: $("#t-proj").value, new_project_name: $("#t-newproj").value,
    assessment: { scope: $("#t-scope").value, scope_action: $("#t-scope-act").value, priority: $("#t-prio").value, urgency: $("#t-urg").value,
      origin: $("#t-origin").value, risk_reason: $("#t-risk").value, impacts: vals("t-imp"), impact_details: $("#t-impd").value, gap_analysis: $("#t-gap").value },
  };
  if (body.relation_mode === "incluir_existente" && !body.include_in) throw new Error(t("Selecione o item on going."));
  const c = (await api(`inputs/${id}/commit`, "POST", body)).created;
  toast(`${t("Registrado em")} ${c.item}` + (c.project ? ` · ${t("projeto")} ${c.project}` : "") + (c.risks ? ` · ${c.risks.join(", ")}` : "") + (c.action ? ` · ${t("ação")} ${c.action}` : ""));
  closeModal();
  location.hash = "lista";
  await refresh();
}
