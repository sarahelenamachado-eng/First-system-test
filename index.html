<!doctype html>
<!-- Arquivo gerado por tools/build.mjs a partir de src/. Edite os arquivos em src/. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governança IA</title>
<style>
/* Visual no padrão das apresentações GWM: fundo claro/cinza, títulos vermelhos, texto preto,
 * faixa vermelha em degradê e logo no canto superior direito. Sem modo escuro. */
:root {
  color-scheme: light;
  --brand: #C00000;
  --font-scale: 1;
  --bg: #f1f1f2; --bg-2: #e7e8ea; --panel: #ffffff; --ink: #1a1a1a; --muted: #6a6d72; --line: #dedfe2;
  --soft: #fbeeee;
  --high: #b00000; --high-bg: #fde4e4; --mid: #8a5a00; --mid-bg: #fff1d6; --low: #1f6b34; --low-bg: #e3f3e6;
  --pad: 16px; --gap: 14px;
}
body[data-density="compacta"] { --pad: 10px; --gap: 10px; }
body[data-density="confortável"] { --pad: 22px; --gap: 18px; }
* { box-sizing: border-box; }
html { font-size: calc(14px * var(--font-scale)); }
body {
  margin: 0; font: 1rem/1.45 "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--ink);
  background: radial-gradient(1200px 600px at 85% -10%, #ffffff 0%, rgba(255,255,255,0) 60%), linear-gradient(160deg, #f7f7f8 0%, var(--bg) 45%, var(--bg-2) 100%) fixed;
  min-height: 100vh;
}
a { color: var(--brand); }

/* ---------- topo */
.top { background: rgba(255,255,255,.96); position: sticky; top: 0; z-index: 5; box-shadow: 0 1px 0 var(--line); }
.top-row { display: flex; align-items: center; gap: 16px; padding: 10px 22px 6px; }
.brand { font-weight: 800; font-size: 1.45rem; color: var(--brand); letter-spacing: .2px; flex: 1; }
.brand .ai { background: var(--brand); color: #fff; border-radius: 4px; padding: 0 6px; margin-left: 2px; font-size: 1.05rem; vertical-align: 2px; }
.top-right { display: flex; align-items: center; gap: 12px; }
.logo { height: 34px; max-width: 220px; object-fit: contain; }
.redbar { height: 8px; margin: 0 22px; border-radius: 1px; background: linear-gradient(90deg, var(--brand) 0%, color-mix(in srgb, var(--brand) 70%, #fff) 45%, rgba(255,255,255,0) 100%); }
nav { display: flex; gap: 2px; flex-wrap: wrap; padding: 6px 18px 8px; }
nav a { color: var(--ink); text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; }
nav a:hover { color: var(--brand); background: var(--soft); }
nav a.active { color: var(--brand); box-shadow: inset 0 -3px 0 var(--brand); border-radius: 0; }
.badge { font-size: .8rem; padding: 3px 9px; border-radius: 999px; background: #eee; color: var(--muted); white-space: nowrap; }
.badge.on { background: var(--low-bg); color: var(--low); }
.badge:empty { display: none; }
.lang { width: auto; padding: 4px 8px; font-size: .9rem; }

/* ---------- conteúdo */
main { max-width: 1360px; margin: 0 auto; padding: 22px 18px 60px; }
h1 { font-size: 1.75rem; margin: 4px 0 16px; color: var(--brand); font-weight: 800; }
h2 { font-size: 1.1rem; margin: 0 0 10px; color: var(--ink); font-weight: 700; padding-left: 9px; border-left: 4px solid var(--brand); }
h3 { font-size: 1rem; margin: 16px 0 6px; color: var(--ink); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.title-row h1 { margin-bottom: 4px; }
.pct-big { min-width: 260px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: var(--pad); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.welcome { max-width: 680px; margin: 40px auto; border-top: 4px solid var(--brand); }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: var(--gap); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--brand); border-radius: 6px; padding: 12px; text-decoration: none; color: inherit; display: block; }
.kpi b { display: block; font-size: 1.8rem; color: var(--brand); font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { color: var(--muted); font-size: .85rem; }
a.kpi:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; color: #444; font-weight: 700; background: #f5f5f6; text-transform: none; }
tr.click { cursor: pointer; } tr.click:hover { background: var(--soft); }
tr.done td { color: var(--muted); }
tr.overdue td:first-child { box-shadow: inset 3px 0 0 var(--high); }
.acts td { font-size: .92rem; }
.acts tr.group-start td { border-top: 2px solid #c9c9cc; }
.acts td.grp { font-weight: 700; color: #333; background: #fafafa; }
.acts td.lp { white-space: pre-wrap; min-width: 220px; color: #333; }
.nowrap { white-space: nowrap; }
label { display: block; font-size: .8rem; color: #444; margin: 10px 0 4px; font-weight: 700; }
input, select, textarea { width: 100%; padding: 7px 8px; border: 1px solid #cfd1d5; border-radius: 4px; background: #fff; color: var(--ink); font: inherit; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--brand) 35%, transparent); border-color: var(--brand); }
input.late { border-color: var(--high); color: var(--high); }
textarea { min-height: 80px; resize: vertical; }
td textarea { min-height: 0; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
button, .btn { display: inline-block; border: 1px solid var(--brand); background: var(--brand); color: #fff; padding: 7px 14px; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 600; text-decoration: none; }
button:hover, .btn:hover { filter: brightness(1.08); }
button.ghost, .btn.ghost { background: #fff; color: var(--brand); }
button.danger { color: var(--high); border-color: #e3b2b2; }
button.small { padding: 3px 9px; font-size: .85rem; }
button:disabled { opacity: .5; cursor: wait; }
.swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.pill { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: #eeeeef; color: #333; margin: 1px 2px 1px 0; white-space: nowrap; }
.p-Alta, .lv-alta, .p-Alto { background: var(--high-bg); color: var(--high); }
.p-Média, .lv-media, .p-Médio { background: var(--mid-bg); color: var(--mid); }
.p-Baixa, .lv-baixa, .p-Baixo { background: var(--low-bg); color: var(--low); }
.star { color: var(--brand); }
.muted { color: var(--muted); }
.alert { padding: 8px 10px; border-radius: 4px; margin-bottom: 6px; background: #f6f6f7; }
.steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.step { padding: 5px 12px; border-radius: 999px; background: #eaeaec; color: var(--muted); font-size: .82rem; font-weight: 600; }
.step.on { background: var(--brand); color: #fff; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 2px solid var(--line); margin: 6px 0 16px; }
.tabs a { padding: 8px 14px; text-decoration: none; color: #333; font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs a:hover { color: var(--brand); }
.tabs a.on { color: var(--brand); border-bottom-color: var(--brand); }
.checks label { display: flex; gap: 6px; align-items: center; font-weight: 400; color: var(--ink); margin: 4px 0; font-size: 1rem; }
.checks.inline { display: flex; gap: 16px; flex-wrap: wrap; }
.checks input { width: auto; }
.ai-box { border-left: 3px solid var(--brand); background: var(--soft); padding: 10px 12px; border-radius: 4px; margin: 10px 0; white-space: pre-wrap; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.toolbar input, .toolbar select { width: auto; min-width: 150px; }
.progress { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.progress b { font-variant-numeric: tabular-nums; min-width: 38px; }
.progress-bar { flex: 1; height: 8px; background: #e4e4e6; border-radius: 4px; overflow: hidden; min-width: 70px; }
.progress-bar span { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
.progress-bar.mini { height: 4px; margin-top: 4px; }
.map-grid { display: grid; gap: 4px 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.logo-preview { background: #fff; border: 1px dashed #ccc; border-radius: 6px; padding: 16px; text-align: center; margin-bottom: 8px; }
.logo-preview img { max-height: 60px; max-width: 100%; }
.modal { position: fixed; inset: 0; background: rgba(30,30,30,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; z-index: 20; }
.modal-box { background: var(--panel); border-radius: 6px; border-top: 4px solid var(--brand); padding: 22px; width: min(960px, 100%); position: relative; }
.close { position: absolute; right: 12px; top: 10px; background: transparent; color: var(--muted); border: 0; font-size: 22px; }
.hidden { display: none !important; }
.toast { position: fixed; right: 18px; bottom: 18px; background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 4px; border-left: 4px solid var(--brand); z-index: 30; max-width: 440px; }
.tl li { margin-bottom: 4px; }
.files a { color: var(--brand); }
.summary-doc { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }
.summary-doc h2 { margin-top: 22px; }

/* ---------- fluxos */
.flow-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }
.flow-canvas { overflow: auto; max-height: 72vh; background: #fbfbfb; border: 1px solid var(--line); border-radius: 6px; touch-action: none; user-select: none; }
.flow-canvas .fl-node { cursor: grab; }
.flow-canvas .fl-edge { cursor: pointer; }
.flow-side { position: sticky; top: 150px; }
@media (max-width: 900px) { .flow-wrap { grid-template-columns: 1fr; } .flow-side { position: static; } }

@media (max-width: 640px) {
  .top-row { padding: 8px 12px 4px; } .redbar { margin: 0 12px; } nav { padding: 4px 8px 6px; }
  .logo { height: 24px; } .badge { display: none; }
  main { padding: 16px 12px 40px; }
}
@media print { .top, .no-print, .tabs { display: none !important; } main { padding: 0; } .summary-doc { border: 0; } body { background: #fff; } }
.acts textarea { min-width: 220px; } .acts input[type=date] { min-width: 130px; }
input[type=range], input[type=checkbox] { accent-color: var(--brand); }

/* ---------- dashboards */
.hero { font-size: 1.15rem; font-weight: 600; margin: 4px 0 14px; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--brand); border-radius: 6px; }
.kpi small { display: block; color: var(--muted); font-size: .75rem; margin-top: 2px; }
.small { font-size: .8rem; }
.hbars { display: grid; gap: 8px; }
.hb-row { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 10px; align-items: center; }
.hb-label { font-size: .88rem; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hb-bar { display: block; height: 14px; border-radius: 0 4px 4px 0; min-width: 0; }
.hb-val { font-weight: 700; font-size: .88rem; color: #1a1a1a; }
.stackbar { display: flex; gap: 2px; height: 22px; border-radius: 4px; overflow: hidden; margin: 6px 0 10px; }
.sb-seg { display: block; height: 100%; min-width: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: #333; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.meter { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.meter b { font-variant-numeric: tabular-nums; }
.cols { display: flex; align-items: flex-end; gap: 14px; height: 170px; padding-top: 18px; }
.col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.col-bar { display: block; width: min(24px, 70%); background: var(--brand); border-radius: 4px 4px 0 0; min-height: 0; }
.col-val { font-weight: 700; font-size: .85rem; margin-bottom: 4px; }
.col-label { font-size: .75rem; color: var(--muted); margin-top: 6px; text-align: center; white-space: nowrap; }
.heat { border-collapse: separate; border-spacing: 2px; }
.heat td { text-align: center; font-weight: 700; font-size: 1.05rem; padding: 14px 6px; border: 0; border-radius: 4px; }
.heat th { background: transparent; text-align: center; border: 0; }

/* ---------- calendário */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.cal-head { background: #f5f5f6; font-weight: 700; font-size: .8rem; padding: 6px; text-align: center; }
.cal-day { background: #fff; min-height: 104px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal-day:hover { background: #fffafa; }
.cal-day.weekend { background: #fafafa; }
.cal-day.empty { background: #f7f7f8; cursor: default; }
.cal-day.today .cal-num { background: var(--brand); color: #fff; border-radius: 999px; padding: 0 7px; }
.cal-num { font-size: .8rem; font-weight: 700; align-self: flex-start; }
.cal-title { font-size: 1.1rem; min-width: 170px; text-align: center; }
.cal-ev { display: block; font-size: .75rem; padding: 2px 5px; border-radius: 3px; text-decoration: none; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #999; background: #f1f1f2; }
.cal-ev.sug { border: 1px dashed var(--brand); border-left-width: 3px; background: #fff; display: flex; align-items: center; gap: 3px; overflow: visible; }
.cal-ev .sug-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cal-ev .mini { flex: none; padding: 0 5px; font-size: .72rem; line-height: 1.35; }
.cal-ev .mini + .mini { background: #fff; color: var(--brand); }
.st-Agendada { border-left-color: #6a6d72 !important; background: #f1f1f2; }
.st-Pendente, .st-Solicitada { border-left-color: #C98A00 !important; background: #fff6e2; }
.st-Realizada { border-left-color: #2E7D32 !important; background: #e9f5eb; }
.st-Norealizada { border-left-color: #C00000 !important; background: #fde8e8; }
.legend i.st-Agendada { background: #6a6d72; } .legend i.st-Pendente, .legend i.st-Solicitada { background: #C98A00; }
.legend i.st-Realizada { background: #2E7D32; } .legend i.st-Norealizada { background: #C00000; } .legend i.sug { background: #fff; border: 1px dashed var(--brand); }
.teach { border-left: 4px solid var(--brand); }
@media (max-width: 760px) { .cal-day { min-height: 70px; } .cal-ev { font-size: .65rem; } }

/* ---------- traduções */
.tr-btn { vertical-align: middle; font-size: .78rem; margin-left: 6px; }
h1 .tr-btn, h2 .tr-btn { font-weight: 600; }
.tr-preview { font-size: .85rem; color: #444; background: #f6f6f7; border-left: 3px solid #b9bcc2; padding: 6px 8px; margin-top: 4px; border-radius: 3px; white-space: pre-wrap; }
.tr-field { margin-bottom: 12px; }
.tr-table td { width: 33%; font-size: .9rem; }

/* ---------- lista geral, busca de itens, prazos */
.due-strip { background: #fde8e8; color: #7a0000; padding: 6px 22px; font-weight: 600; font-size: .9rem; border-top: 1px solid #f3c2c2; }
.due-strip a { margin-left: 10px; }
.due-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.late-txt { color: var(--high); font-weight: 700; }
tr.overdue td { background: #fff6f6; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
.inline-check { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; font-size: .9rem; margin: 0; color: var(--ink); }
.inline-check input { width: auto; }
td.lp { max-width: 280px; font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #f1f1f2; border-radius: 999px; padding: 3px 4px 3px 10px; font-size: .85rem; }
.chip.direct { background: var(--soft); color: var(--brand); font-weight: 600; }
.chip.sug { background: #fff; border: 1px dashed #bbb; padding-right: 10px; }
.chip .mini { padding: 0 6px; font-size: .75rem; line-height: 1.4; border-radius: 999px; }
.search-results { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 4px 4px; max-height: 260px; overflow: auto; }
.search-results:empty { display: none; }
.search-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 6px 8px; border-top: 1px solid var(--line); }
details.merge { margin-top: 14px; } details.merge summary { cursor: pointer; color: var(--muted); }
.toolbar .inline-check input { min-width: 0; width: auto; }
.act-cell { display: flex; flex-wrap: wrap; gap: 4px; min-width: 150px; }

/* ---------- painel por departamento */
.dept-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.dept-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: #fff; color: var(--ink); border: 1px solid var(--line);
  border-top: 4px solid #b9bcc2; border-radius: 6px; padding: 12px; font-weight: 400; cursor: pointer; }
.dept-tile:hover { filter: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.dept-tile.has-late { border-top-color: var(--brand); }
.dept-tile.on { outline: 2px solid var(--brand); background: var(--soft); }
.dept-name { font-weight: 800; font-size: 1.05rem; color: var(--brand); }
.dept-tile b { font-size: 1.7rem; line-height: 1.1; }
.dept-sub { font-size: .78rem; color: var(--muted); }
.dept-meta { font-size: .78rem; color: var(--muted); min-height: 1em; }
</style>
</head>
<body data-density="normal">
<header class="top">
  <div class="top-row">
    <div class="brand"><span id="app-title">Governança</span> <span class="ai">IA</span></div>
    <div class="top-right">
      <select id="lang" class="lang" onchange="setLang(this.value)" aria-label="Idioma / Language / 语言">
        <option value="pt">Português</option><option value="en">English</option><option value="zh">中文</option>
      </select>
      <div id="ai-badge" class="badge"></div>
      <img id="logo" class="logo" alt="logo">
    </div>
  </div>
  <div id="redbar" class="redbar"></div>
  <nav id="nav">
    <a href="#painel" data-t="Painel">Painel</a>
    <a href="#entradas" data-t="Entradas">Entradas</a>
    <a href="#lista" data-t="Lista geral">Lista geral</a>
    <a href="#projetos" data-t="Projetos">Projetos</a>
    <a href="#reunioes" data-t="Reuniões">Reuniões</a>
    <a href="#riscos" data-t="Riscos">Riscos</a>
    <a href="#fluxos" data-t="Fluxos">Fluxos</a>
    <a href="#summaries" data-t="Summaries">Summaries</a>
    <a href="#config" data-t="Config.">Config.</a>
  </nav>
</header>
<main id="view"><p class="muted">Carregando…</p></main>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modal-body"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* Armazenamento local: uma pasta do computador escolhida pelo usuário (File System Access API, Edge/Chrome).
 *
 *   <pasta escolhida>/
 *     db.json                                         -> base de dados de governança
 *     PROJECTS/PROJ001 INFOS AND GENERAL OVERVIEW/master_schedule/...
 *     RISKS/RISK001 INFOS AND GENERAL OVERVIEW/...
 *     MEETINGS/MEET001/...
 *     SUMMARIES/...
 *
 * A referência à pasta e a chave da IA ficam no IndexedDB do navegador (nunca dentro da pasta,
 * que pode ser compartilhada).
 */
const KV = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("governanca-ia", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res((this._db = r.result));
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  },
};

const Store = {
  root: null,
  name: "",

  supported: () => typeof window.showDirectoryPicker === "function",

  async pick() {
    const h = await window.showDirectoryPicker({ id: "governanca-ia", mode: "readwrite" });
    await this.use(h);
  },
  async use(h) {
    this.root = h;
    this.name = h.name;
    await KV.set("root", h).catch(() => {});
  },
  /** Pasta usada da última vez; precisa de permissão (clique do usuário) para reabrir. */
  async remembered() {
    try { return (await KV.get("root")) || null; } catch { return null; }
  },
  async hasPermission(h) {
    return (await h.queryPermission({ mode: "readwrite" })) === "granted";
  },
  async requestPermission(h) {
    return (await h.requestPermission({ mode: "readwrite" })) === "granted";
  },

  _split(path) { return path.split("/").filter(Boolean); },
  async dir(path, create = true) {
    let h = this.root;
    for (const p of this._split(path)) h = await h.getDirectoryHandle(p, { create });
    return h;
  },
  async fileHandle(path, create = false) {
    const parts = this._split(path), name = parts.pop();
    const d = await this.dir(parts.join("/"), create);
    return d.getFileHandle(name, { create });
  },
  async write(path, data) {
    const fh = await this.fileHandle(path, true);
    const w = await fh.createWritable();
    await w.write(data);
    await w.close();
  },
  async read(path) {
    try { return await (await this.fileHandle(path)).getFile(); } catch { return null; }
  },
  async exists(path) { return (await this.read(path)) !== null; },
  async remove(path) {
    const parts = this._split(path), name = parts.pop();
    try { await (await this.dir(parts.join("/"), false)).removeEntry(name); } catch { /* já removido */ }
  },
  /** Lista arquivos recursivamente: [{name, rel, folder, size, modified}] */
  async list(path) {
    const out = [];
    let base;
    try { base = await this.dir(path, false); } catch { return out; }
    const walk = async (h, rel) => {
      for await (const [n, e] of h.entries()) {
        const r = rel ? rel + "/" + n : n;
        if (e.kind === "directory") await walk(e, r);
        else {
          const f = await e.getFile();
          out.push({ name: n, rel: path + "/" + r, folder: rel || ".", size: f.size, modified: new Date(f.lastModified).toISOString().slice(0, 19) });
        }
      }
    };
    await walk(base, "");
    return out.sort((a, b) => a.rel.localeCompare(b.rel));
  },
  safeName(name) {
    return (String(name || "arquivo").split(/[\\/]/).pop().replace(/[^\p{L}\p{N}\-. ()_]+/gu, "_").trim()) || "arquivo";
  },
  /** Grava sem sobrescrever: "arquivo (1).xlsx" se já existir. */
  async writeUnique(folder, name, data) {
    name = this.safeName(name);
    const dot = name.lastIndexOf("."), root = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : "";
    let rel = folder + "/" + name, n = 1;
    while (await this.exists(rel)) rel = `${folder}/${root} (${n++})${ext}`;
    await this.write(rel, data);
    return rel;
  },
};

<script>
/* Leitor mínimo de .xlsx (primeira planilha) e .csv, sem bibliotecas externas.
 * .xlsx é um zip de XMLs: lemos o diretório central do zip e descompactamos com DecompressionStream. */
const Sheet = {
  async unzip(buf) {
    const dv = new DataView(buf), dec = new TextDecoder();
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("Arquivo .xlsx inválido");
    const count = dv.getUint16(e + 10, true);
    let off = dv.getUint32(e + 16, true);
    const files = {};
    for (let i = 0; i < count; i++) {
      const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
      const nl = dv.getUint16(off + 28, true), xl = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
      const local = dv.getUint32(off + 42, true);
      files[dec.decode(new Uint8Array(buf, off + 46, nl))] = { method, csize, local };
      off += 46 + nl + xl + cl;
    }
    return async (name) => {
      const f = files[name];
      if (!f) return null;
      const start = f.local + 30 + dv.getUint16(f.local + 26, true) + dv.getUint16(f.local + 28, true);
      const data = new Uint8Array(buf, start, f.csize);
      if (f.method === 0) return dec.decode(data);
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    };
  },

  async readXlsx(file) {
    const get = await this.unzip(await file.arrayBuffer());
    const xml = (s) => (s ? new DOMParser().parseFromString(s, "application/xml") : null);
    const byTag = (doc, tag) => (doc ? [...doc.getElementsByTagNameNS("*", tag)] : []);

    // primeira aba
    let sheetPath = "xl/worksheets/sheet1.xml";
    const wb = xml(await get("xl/workbook.xml")), rels = xml(await get("xl/_rels/workbook.xml.rels"));
    const first = byTag(wb, "sheet")[0];
    if (first && rels) {
      const rid = first.getAttribute("r:id") || first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      const rel = byTag(rels, "Relationship").find((r) => r.getAttribute("Id") === rid);
      if (rel) { const t = rel.getAttribute("Target"); sheetPath = t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, ""); }
    }
    const shared = byTag(xml(await get("xl/sharedStrings.xml")), "si").map((si) => byTag(si, "t").map((t) => t.textContent).join(""));

    // estilos de data (para converter o número serial do Excel em AAAA-MM-DD)
    const styles = xml(await get("xl/styles.xml"));
    const customDate = new Set(byTag(styles, "numFmt").filter((n) => /[dmy]/i.test((n.getAttribute("formatCode") || "").replace(/"[^"]*"|\[[^\]]*\]/g, ""))).map((n) => +n.getAttribute("numFmtId")));
    const xfs = (() => { const cx = byTag(styles, "cellXfs")[0]; return cx ? byTag(cx, "xf").map((x) => +x.getAttribute("numFmtId")) : []; })();
    const isDateFmt = (id) => (id >= 14 && id <= 22) || (id >= 45 && id <= 47) || customDate.has(id);
    const serialToDate = (n) => new Date(Date.UTC(1899, 11, 30) + Math.round(n * 864e5)).toISOString().slice(0, 10);

    const colIdx = (ref) => { let n = 0; for (const ch of ref.replace(/\d+/g, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const rowIdx = (ref) => +ref.replace(/[A-Z]+/g, "") - 1;
    const sheet = xml(await get(sheetPath));
    const grid = [];
    for (const row of byTag(sheet, "row")) {
      for (const c of byTag(row, "c")) {
        const ref = c.getAttribute("r") || "A1";
        const t = c.getAttribute("t"), v = byTag(c, "v")[0]?.textContent ?? "";
        let val = v;
        if (t === "s") val = shared[+v] ?? "";
        else if (t === "inlineStr") val = byTag(c, "t").map((x) => x.textContent).join("");
        else if (t === "b") val = v === "1" ? "TRUE" : "FALSE";
        else if (v !== "" && !t && isDateFmt(xfs[+(c.getAttribute("s") || 0)] ?? 0)) val = serialToDate(+v);
        (grid[rowIdx(ref)] ??= [])[colIdx(ref)] = val;
      }
    }
    // células mescladas: o valor do canto superior esquerdo vale para todo o intervalo
    for (const m of byTag(sheet, "mergeCell")) {
      const [a, b] = (m.getAttribute("ref") || "").split(":");
      if (!b) continue;
      const r0 = rowIdx(a), c0 = colIdx(a), r1 = rowIdx(b), c1 = colIdx(b);
      const val = grid[r0]?.[c0] ?? "";
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (r !== r0 || c !== c0) (grid[r] ??= [])[c] = val;
    }
    const rows = [];
    for (const r of grid) {
      const filled = Array.from(r || [], (x) => (x ?? "").toString());
      if (filled.some((x) => x.trim() !== "")) rows.push(filled);
    }
    return rows;
  },

  parseCsv(text) {
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [";", "\t", ","].sort((a, b) => first.split(b).length - first.split(a).length)[0];
    const rows = [];
    let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = "";
        if (row.some((x) => x !== "")) rows.push(row);
        row = [];
      } else cell += ch;
    }
    row.push(cell);
    if (row.some((x) => x !== "")) rows.push(row);
    return rows;
  },

  /** Retorna linhas da tabela ou null se o formato não for legível. */
  async table(file) {
    const ext = file.name.toLowerCase().split(".").pop();
    if (ext === "csv" || ext === "txt") return this.parseCsv((await file.text()).replace(/^﻿/, ""));
    if (ext === "xlsx" || ext === "xlsm") return this.readXlsx(file);
    return null;
  },
};
</script>

  get SYSTEM_PROMPT() { return `Você é o assistente de governança corporativa de uma diretoria.
Você recebe demandas vindas da diretora, de reuniões, de departamentos ou do HQ e ajuda a fazer o
"demand management": verificar relação com itens já levantados, classificar (escopo, prioridade,
impactos) e sugerir a definição (risco, info a reportar, novo projeto, ação em projeto, ação geral).
Use a lógica de Hoshin Kanri para alinhar demandas à estratégia: conecte cada demanda aos objetivos
e projetos existentes, destaque desdobramentos e interfaces entre áreas, e aponte gaps (por que algo
não foi previsto antes). Responda sempre em ${I18N.aiLanguage()}, de forma objetiva (todos os textos livres
do JSON também nesse idioma; os valores de enum ficam exatamente como definidos no schema).
O usuário sempre confirma ou corrige suas sugestões; trate os exemplos de decisões anteriores como
critério da organização e siga-os quando aplicáveis.`; },

  async init() {
    this.key = (await KV.get("api_key").catch(() => "")) || "";
    this.model = (await KV.get("model").catch(() => "")) || "claude-opus-5-5";
  },
  async configure(key, model) {
    this.key = (key || "").trim();
    this.model = (model || "").trim() || "claude-opus-5-5";
    await KV.set("api_key", this.key);
    await KV.set("model", this.model);
  },
  enabled() { return !!this.key; },
  status() {
    return this.enabled() ? { enabled: true, model: this.model, detail: null }
      : { enabled: false, model: null, detail: "sem chave do Claude (configure em Config.)" };  // traduzido na exibição
  },

  /** Chama o Claude. Retorna objeto (se schema) ou texto. Lança Error em falha. */
  async call(content, schema = null, effort = "medium", maxTokens = 16000, system = null) {
    if (!this.key) throw new Error(t("IA sem chave configurada"));
    const body = {
      model: this.model,
      max_tokens: maxTokens,
      system: system || this.SYSTEM_PROMPT,
      messages: [{ role: "user", content }],
      output_config: { effort },
      // Se um classificador de segurança recusar, o servidor tenta outro modelo automaticamente.
      fallbacks: "default",
    };
    if (schema) body.output_config.format = { type: "json_schema", schema };
    let r;
    try {
      r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": this.key,
          "anthropic-version": "2023-06-01",
          "anthropic-beta": "server-side-fallback-2026-07-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify(body),
      });
    } catch (e) {
      throw new Error(t("Sem conexão com a API do Claude (rede/proxy bloqueado?)"));
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = data?.error?.message || r.statusText;
      if (r.status === 401) throw new Error(t("Chave da IA inválida (401)"));
      if (r.status === 429) throw new Error(t("Limite de requisições atingido; tente novamente em instantes"));
      throw new Error(t("Erro da API do Claude ({status}): {msg}", { status: r.status, msg }));
    }
    if (data.stop_reason === "refusal") throw new Error(t("O modelo recusou a solicitação"));
    const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    if (!schema) return text;
    try { return JSON.parse(text); } catch { throw new Error(t("Resposta da IA em formato inválido")); }
  },

  // ---------------------------------------------------------------- utilidades de texto
  STOP: new Set("a o os as de da do das dos e em no na nos nas um uma para por com sem que se ao à é ser sobre the of and to in".split(" ")),
  norm: (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, ""),
  tokens(s) {
    // radical simples (6 primeiras letras) para aproximar plural/gênero: gerador ~ geradores
    return new Set((this.norm(s).match(/[a-z0-9]{3,}/g) || []).filter((w) => !this.STOP.has(w)).map((w) => w.slice(0, 6)));
  },
  similarity(a, b) {
    const ta = this.tokens(a), tb = this.tokens(b);
    if (!ta.size || !tb.size) return 0;
    let inter = 0;
    for (const t of ta) if (tb.has(t)) inter++;
    return (inter / Math.min(ta.size, tb.size)) * 0.6 + (inter / (ta.size + tb.size - inter)) * 0.4;
  },
  itemText: (it) => ["title", "description", "background", "area_main", "scope"].map((k) => it[k] || "").join(" "),
  inputText: (i) => ["title", "description", "background", "origin", "area_main", "areas_impacted", "areas_impacting"].map((k) => i[k] || "").join(" "),
  relatedItems(db, text, limit = 5, threshold = 0.18) {
    return db.items.map((it) => [this.similarity(text, this.itemText(it)), it]).filter(([s]) => s >= threshold)
      .sort((a, b) => b[0] - a[0]).slice(0, limit)
      .map(([s, it]) => ({ id: it.id, title: it.title, score: Math.round(s * 100) / 100, status: it.status }));
  },
  similarLessons(db, text, limit = 5) {
    return (db.risk_lessons || []).map((l) => [this.similarity(text, l.text || ""), l]).filter(([s]) => s > 0.12)
      .sort((a, b) => b[0] - a[0]).slice(0, limit).map(([, l]) => l);
  },
  similarFeedback(db, text, limit = 5) {
    return db.feedback.map((f) => [this.similarity(text, f.text || ""), f]).filter(([s]) => s > 0.1)
      .sort((a, b) => b[0] - a[0]).slice(0, limit).map(([, f]) => f);
  },

  // ---------------------------------------------------------------- avaliação de demandas
  get ASSESS_SCHEMA() {
    const S = (d) => (d ? { type: "string", description: d } : { type: "string" });
    const lvl = { type: "string", enum: ["Alta", "Média", "Baixa"] };
    return {
      type: "object", additionalProperties: false,
      required: ["related", "relation_mode", "include_in", "relation_explanation", "scope", "scope_action", "priority", "urgency",
        "risk_reason", "impacts", "impact_details", "definitions", "project_id", "gap_analysis", "rationale"],
      properties: {
        related: { type: "array", items: { type: "object", additionalProperties: false, required: ["id", "relation"], properties: { id: S(), relation: S() } } },
        relation_mode: { type: "string", enum: ["novo", "incluir_existente"] },
        include_in: S("ID do item on going quando relation_mode=incluir_existente, senão vazio"),
        relation_explanation: S(),
        scope: S("O que é?"), scope_action: S("O que deve ser feito com isso?"),
        priority: lvl, urgency: lvl,
        risk_reason: S("Por que há risco e por que essa urgência"),
        impacts: { type: "array", items: { type: "string", enum: this.IMPACT_TYPES } },
        impact_details: S("Impactos em quais projetos/operações, por quê"),
        definitions: { type: "array", items: { type: "string", enum: Object.keys(this.DEFINITIONS) } },
        project_id: S("Projeto existente relacionado, ou vazio"),
        gap_analysis: S("Possíveis gaps / por que a ação não foi prevista antes"),
        rationale: S(),
      },
    };
  },

  PRIORITY_WORDS: ["urgente", "imediato", "critico", "ministerio", "multa", "acidente", "parada", "parado", "seguranca", "investigacao", "processo", "hq", "diretora"],
  IMPACT_WORDS: {
    Custo: ["custo", "multa", "orcamento", "contrato", "preco", "pagamento", "budget", "financeiro"],
    Eficiência: ["atraso", "produtividade", "eficiencia", "retrabalho", "prazo", "lento", "fluxo"],
    Operação: ["operacao", "gerador", "equipamento", "parada", "parado", "manutencao", "pecas", "yard", "patio", "energia", "voltage"],
    Compliance: ["ministerio", "lei", "auditoria", "norma", "compliance", "regulatorio", "fiscalizacao", "investigacao", "legal"],
    People: ["turnover", "funcionarios", "ambiente", "rh", "saude", "pessoas", "colaboradores", "ventiladores", "treinamento", "clima"],
    Qualidade: ["qualidade", "defeito", "retrabalho", "refugo", "nao conformidade", "padronizacao", "standard", "quality", "auditoria de produto", "reclamacao de cliente"],
  },

  heuristicAssess(db, inp, related) {
    const text = this.norm(this.inputText(inp));
    const has = (w) => text.includes(w);
    const learned = this.similarFeedback(db, this.inputText(inp), 1);
    const impacts = Object.entries(this.IMPACT_WORDS).filter(([, ws]) => ws.some(has)).map(([k]) => k);
    const hits = this.PRIORITY_WORDS.filter(has).length;
    const priority = hits >= 2 ? "Alta" : hits === 1 ? "Média" : "Baixa";
    const defs = [];
    if (["risco", "investig", "ministerio", "acidente", "multa"].some(has)) defs.push(has("investig") ? "risco_investigar" : "risco_monitorar");
    const project = db.projects.find((p) => this.similarity(this.inputText(inp), `${p.name || ""} ${p.description || ""}`) > 0.3)?.id || "";
    if (project) defs.push("acao_projeto");
    else if (related.length >= (db.settings.links_for_project_alert || 3)) defs.push("novo_projeto");
    if (!defs.length) defs.push("acao_geral");
    const dup = Core.findDuplicates(inp.title || "")[0];
    const mode = dup || (related.length && related[0].score >= 0.55) ? "incluir_existente" : "novo";
    const out = {
      related: related.map((r) => ({ id: r.id, relation: `${t("similaridade")} ${r.score}` })),
      relation_mode: mode,
      include_in: mode === "incluir_existente" ? dup || related[0].id : "",
      relation_explanation: mode === "incluir_existente" ? "Relação direta (alta similaridade) com item on going."
        : related.length ? "Relacionado em impacto, mas não diretamente: criar item novo e vincular." : "Nenhum item relacionado encontrado.",
      scope: inp.title || "", scope_action: "", priority, urgency: priority, risk_reason: "", impacts, impact_details: "",
      definitions: defs, project_id: project, gap_analysis: "",
      rationale: t("Sugestão heurística (IA offline): palavras-chave, similaridade com o histórico e decisões anteriores."),
    };
    out.msg = ["Sugestão heurística (IA offline): palavras-chave, similaridade com o histórico e decisões anteriores.", {}];
    const lesson = this.similarLessons(db, this.inputText(inp), 1)[0];
    if (lesson?.level) {
      out.priority = out.urgency = lesson.level;
      out.risk_reason = lesson.analysis || out.risk_reason;
      out.rationale += " " + t("Risco avaliado como na sua análise de {ref}.", { ref: lesson.ref });
    }
    if (learned.length) {
      const fin = learned[0].final || {};
      for (const k of ["priority", "urgency", "impacts", "definitions"]) if (fin[k] && (!Array.isArray(fin[k]) || fin[k].length)) out[k] = fin[k];
      out.rationale += " " + t("Baseado na decisão anterior em {ref}.", { ref: learned[0].ref });
      out.msg = ["HEUR_LEARNED", { ref: learned[0].ref }];
    }
    return out;
  },

  /** Etapa 2 do fluxo (Assessment): relação com itens on going + classificação + definição sugerida. */
  async assessInput(db, inp) {
    const text = this.inputText(inp);
    const related = this.relatedItems(db, text, 8, 0.12);
    if (!this.enabled()) return { ...this.heuristicAssess(db, inp, related), engine: "heuristica" };
    const pick = (o, ks) => Object.fromEntries(ks.map((k) => [k, o[k]]));
    const ongoing = db.items.filter((it) => it.status !== "Concluído").slice(-80)
      .map((it) => ({ id: it.id, title: it.title, status: it.status, scope: it.scope, priority: it.priority, projects: it.links?.projects || [] }));
    const projects = db.projects.map((p) => ({ id: p.id, name: p.name, description: (p.description || "").slice(0, 300) }));
    const examples = this.similarFeedback(db, text).map((f) => ({ demanda: (f.text || "").slice(0, 500), sugestao_ia: f.ai, decisao_final_usuario: f.final }));
    const J = (x) => JSON.stringify(x);
    const prompt = "Nova demanda (input):\n" + JSON.stringify(pick(inp, ["source", "source_detail", "title", "description", "background", "origin", "area_main", "areas_impacted", "areas_impacting", "owner", "due_date"]), null, 1)
      + "\n\nItens on going na lista geral de governança:\n" + J(ongoing)
      + "\n\nCandidatos mais parecidos (similaridade textual):\n" + J(related)
      + "\n\nPossíveis DUPLICADOS (mesmo título — se for a mesma demanda, use relation_mode=incluir_existente):\n" + J(Core.findDuplicates(inp.title || ""))
      + "\n\nProjetos existentes:\n" + J(projects)
      + "\n\nDecisões anteriores do usuário em demandas parecidas (aprenda com elas):\n" + J(examples)
      + "\n\nCritérios de avaliação de risco definidos pelo usuário (siga com prioridade):\n" + (db.settings.risk_guidelines || "(nenhum)")
      + "\n\nAnálises de risco feitas pelo usuário em casos parecidos (aprenda o raciocínio):\n" + J(this.similarLessons(db, text).map((l) => ({ caso: (l.text || "").slice(0, 300), nivel: l.level, fatores: l.factors, analise: l.analysis })))
      + "\n\nTarefa: 1) Verifique se tem relação com item já levantado. Relação direta -> relation_mode=incluir_existente "
      + "e include_in=<id>. Relacionado só em impacto -> relation_mode=novo, e liste o vínculo em related. "
      + "2) Classifique escopo (o que é / o que fazer), prioridade, urgência com justificativa do risco, impactos "
      + "(Custo, Eficiência, Operação, Compliance, People) e em quais projetos/operações. "
      + "3) Sugira uma ou mais definições. Use project_id quando for ação dentro de projeto existente. "
      + "4) Aponte gaps: por que isso não foi previsto antes.";
    try {
      const out = await this.call(prompt, this.ASSESS_SCHEMA, "medium");
      const valid = new Set(db.items.map((i) => i.id));
      out.related = (out.related || []).filter((r) => valid.has(r.id));
      if (!valid.has(out.include_in)) { out.include_in = ""; out.relation_mode = "novo"; }
      if (!db.projects.some((p) => p.id === out.project_id)) out.project_id = "";
      out.engine = this.model;
      return out;
    } catch (e) {
      const out = { ...this.heuristicAssess(db, inp, related), engine: "heuristica" };
      out.rationale += ` (${t("Claude falhou:")} ${e.message})`;
      delete out.msg;
      return out;
    }
  },

  // ---------------------------------------------------------------- reuniões
  EXTRACT_SCHEMA: {
    type: "object", additionalProperties: false, required: ["summary", "decisions", "demands"],
    properties: {
      summary: { type: "string" },
      decisions: { type: "array", items: { type: "string" } },
      demands: { type: "array", items: { type: "object", additionalProperties: false,
        required: ["title", "description", "owner", "due_date", "area_main", "related_item"],
        properties: { title: { type: "string" }, description: { type: "string" }, owner: { type: "string" },
          due_date: { type: "string", description: "AAAA-MM-DD ou vazio" }, area_main: { type: "string" },
          related_item: { type: "string", description: "ID de item existente ou vazio" } } } },
    },
  },

  async extractMeeting(db, m) {
    const text = `${m.minutes || ""}\n${m.notes || ""}`;
    if (!this.enabled()) {
      const KW = /^(a[cç][aã]o|action|to-?do|task|pend[eê]ncia|demanda|tarefa|行动|待办|任务)\s*[:：\-]\s*/i;
      const demands = [];
      for (const line of text.split(/\r?\n/)) {
        const l = line.replace(/^[\s\-•*]+|[\s\-•*]+$/g, "");
        if (!KW.test(l)) continue;
        let title = l.replace(KW, "");
        const OWNER = /\s*(?:resp(?:ons[aá]vel)?|owner|负责人)\s*[:：\-]\s*/i;
        const owner = (l.match(new RegExp(OWNER.source + "([^\\d,;，；]+)", "i")) || [, ""])[1].trim();
        const due = (l.match(/(\d{4}-\d{2}-\d{2})/) || [, ""])[1];
        title = title.replace(new RegExp(OWNER.source + ".*$", "i"), "").trim() || title;
        const rel = this.relatedItems(db, title, 1, 0.4);
        demands.push({ title: title.slice(0, 120), description: l, owner, due_date: due, area_main: "", related_item: rel[0]?.id || "" });
      }
      const decisions = text.split(/\r?\n/).filter((l) => /^\s*[-•*]?\s*(decis|决定|决策)/i.test(l)).map((l) => l.replace(/^[\s\-•*]+/, ""));
      return { summary: text.slice(0, 400), decisions, demands, engine: "heuristica",
        hint: "EXTRACT_HINT" };
    }
    const items = db.items.slice(-120).map((it) => ({ id: it.id, title: it.title }));
    const prompt = `Reunião: ${m.title} em ${m.date} — participantes: ${m.participants || ""}\nAta / anotações:\n${text}\n\n`
      + `Itens já existentes na lista de governança:\n${JSON.stringify(items)}\n\n`
      + "Resuma a reunião, liste as decisões e extraia cada demanda/ação nova ou atualização (com responsável e prazo "
      + "quando citados). Se a demanda se refere a um item existente, informe o ID em related_item.";
    try {
      return { ...(await this.call(prompt, this.EXTRACT_SCHEMA, "medium")), engine: this.model };
    } catch (e) {
      return { summary: "", decisions: [], demands: [], engine: "erro", hint: e.message };
    }
  },

  // ---------------------------------------------------------------- master schedule
  heuristicSchedule(rows, ref) {
    if (!rows || !rows.length) return { overview: t("Arquivo armazenado. Formato sem leitura automática (envie .xlsx/.csv/.pdf para análise)."), tasks_count: 0 };
    let hi = rows.slice(0, 15).findIndex((r) => /tarefa|task|atividade|activity/.test(this.norm(r.join(" "))));
    if (hi < 0) hi = 0;
    const head = rows[hi].map((h) => this.norm(h));
    const col = (...ns) => { const i = head.findIndex((h) => ns.some((n) => h.includes(n))); return i < 0 ? null : i; };
    const ci = col("tarefa", "task", "atividade", "activity", "nome", "name"), cs = col("inicio", "start"),
      cf = col("termino", "fim", "finish", "end"), cp = col("%", "progress", "conclu");
    const toDate = (v) => { v = String(v || ""); return /^\d{5}(\.\d+)?$/.test(v) ? new Date(Date.UTC(1899, 11, 30) + Math.round(+v * 864e5)).toISOString().slice(0, 10)
      : /^\d{2}\/\d{2}\/\d{4}/.test(v) ? `${v.slice(6, 10)}-${v.slice(3, 5)}-${v.slice(0, 2)}` : v.slice(0, 10); };
    const tasks = [];
    for (const r of rows.slice(hi + 1)) {
      const g = (c) => (c !== null && c < r.length ? r[c] ?? "" : "");
      const name = g(ci);
      if (!name) continue;
      const raw = String(g(cp));
      let pct = parseFloat(raw.replace("%", "").replace(",", ".")) || 0;
      if (pct > 0 && pct <= 1 && !raw.includes("%")) pct *= 100;
      tasks.push({ task: name, start: toDate(g(cs)), finish: toDate(g(cf)), progress: Math.round(pct) });
    }
    const late = tasks.filter((t) => t.finish && t.finish < ref && t.progress < 100);
    const upcoming = tasks.filter((t) => t.finish && t.finish >= ref && t.progress < 100).sort((a, b) => a.finish.localeCompare(b.finish)).slice(0, 10);
    const done = tasks.filter((t) => t.progress >= 100).length;
    const p = { n: tasks.length, done, late: late.length };
    return { overview: t("{n} atividades lidas; {done} concluídas; {late} atrasadas.", p), msg: ["{n} atividades lidas; {done} concluídas; {late} atrasadas.", p], late: late.slice(0, 20), upcoming, tasks_count: tasks.length };
  },

  SCHEDULE_SCHEMA: (() => {
    const task = { type: "object", additionalProperties: false, required: ["task", "finish", "progress"],
      properties: { task: { type: "string" }, finish: { type: "string" }, progress: { type: "number" } } };
    return {
      type: "object", additionalProperties: false,
      required: ["overview", "phases", "late", "upcoming", "critical_points", "suggested_actions"],
      properties: {
        overview: { type: "string" },
        phases: { type: "array", items: { type: "object", additionalProperties: false, required: ["name", "start", "finish", "status"],
          properties: { name: { type: "string" }, start: { type: "string" }, finish: { type: "string" }, status: { type: "string" } } } },
        late: { type: "array", items: task }, upcoming: { type: "array", items: task },
        critical_points: { type: "array", items: { type: "string" } },
        suggested_actions: { type: "array", items: { type: "string" } },
      },
    };
  })(),

  async analyzeSchedule(project, file, ref) {
    const ext = file.name.toLowerCase().split(".").pop();
    let rows = null;
    try { rows = await Sheet.table(file); } catch (e) { rows = null; }
    if (!this.enabled() || (rows === null && ext !== "pdf")) return { ...this.heuristicSchedule(rows, ref), engine: "heuristica" };
    const intro = `Projeto ${project.id} — ${project.name}. Data de referência: ${ref}.\n`
      + "Organize esta master schedule: visão geral, fases/marcos, atividades atrasadas, próximas entregas "
      + "(próximas 4 semanas), pontos críticos (caminho crítico, interfaces com outras áreas) e ações sugeridas.";
    const content = ext === "pdf"
      ? [{ type: "document", source: { type: "base64", media_type: "application/pdf", data: await fileToB64(file) } }, { type: "text", text: intro }]
      : intro + "\n\nCronograma (tabela):\n" + rows.map((r) => r.join(" | ")).join("\n");
    try {
      return { ...(await this.call(content, this.SCHEDULE_SCHEMA, "medium")), engine: this.model };
    } catch (e) {
      const out = { ...this.heuristicSchedule(rows, ref), engine: "heuristica" };
      out.overview += ` (${t("Claude falhou:")} ${e.message})`;
      delete out.msg;
      return out;
    }
  },

  // ---------------------------------------------------------------- riscos
  RISK_SCHEMA: {
    type: "object", additionalProperties: false,
    required: ["summary", "probability", "impact", "causes", "consequences", "mitigations", "report_points"],
    properties: {
      summary: { type: "string" }, probability: { type: "string", enum: ["Alta", "Média", "Baixa"] },
      impact: { type: "string", enum: ["Alto", "Médio", "Baixo"] },
      causes: { type: "array", items: { type: "string" } }, consequences: { type: "array", items: { type: "string" } },
      mitigations: { type: "array", items: { type: "string" } }, report_points: { type: "array", items: { type: "string" } },
    },
  },

  async analyzeRisk(db, risk, filesText) {
    const empty = { causes: [], consequences: [], mitigations: [], report_points: [] };
    if (!this.enabled()) return { summary: t("IA offline — análise automática indisponível. Preencha manualmente."),
      probability: risk.probability || "Média", impact: risk.impact || "Médio", ...empty, engine: "heuristica" };
    const linked = db.items.filter((it) => (risk.links?.items || []).includes(it.id)).map((i) => ({ id: i.id, title: i.title, risk_reason: i.risk_reason }));
    const lessons = this.similarLessons(db, `${risk.title} ${risk.description || ""}`).map((l) => ({ caso: (l.text || "").slice(0, 300), nivel: l.level, fatores: l.factors, analise: l.analysis }));
    const prompt = `Critérios de avaliação de risco do usuário (siga com prioridade):\n${db.settings.risk_guidelines || "(nenhum)"}\n`
      + `Análises de risco do usuário em casos parecidos (aprenda o raciocínio):\n${JSON.stringify(lessons)}\n`
      + (risk.risk_analysis?.analysis ? `Análise do próprio usuário para este risco: ${risk.risk_analysis.analysis} (nível ${risk.risk_analysis.level})\n` : "")
      + `Risco ${risk.id}: ${risk.title} (${risk.mode})\nDescrição: ${risk.description || ""}\n`
      + `Itens vinculados: ${JSON.stringify(linked)}\nNotas: ${risk.notes || ""}\nConteúdo dos documentos da pasta (texto):\n${filesText.slice(0, 60000)}\n\n`
      + "Compile as informações do risco para análise e reporte. As sugestões serão confirmadas pelo usuário.";
    try {
      return { ...(await this.call(prompt, this.RISK_SCHEMA, "medium")), engine: this.model };
    } catch (e) {
      return { summary: `${t("Falha na análise:")} ${e.message}`, probability: "Média", impact: "Médio", ...empty, engine: "erro" };
    }
  },

  // ---------------------------------------------------------------- fluxos (mapa visual)
  FLOW_TYPES: ["project", "risk", "item", "cause", "impact", "action", "other"],
  get FLOW_SCHEMA() {
    return {
      type: "object", additionalProperties: false, required: ["nodes", "edges"],
      properties: {
        nodes: { type: "array", items: { type: "object", additionalProperties: false, required: ["key", "label", "type", "ref"],
          properties: { key: { type: "string" }, label: { type: "string" }, type: { type: "string", enum: this.FLOW_TYPES },
            ref: { type: "string", description: "ID de registro existente (PROJ/RISK/GOV) ou vazio" } } } },
        edges: { type: "array", items: { type: "object", additionalProperties: false, required: ["from", "to", "label"],
          properties: { from: { type: "string" }, to: { type: "string" }, label: { type: "string" } } } },
      },
    };
  },

  /** Gera um fluxo que correlaciona projetos, riscos e impactos. Sem IA, usa os vínculos registrados. */
  async generateFlow(db, flow, description) {
    const base = Core.flowFromData(flow.scope_col, flow.scope_id);
    if (!this.enabled()) return { ...base, engine: "heuristica" };
    const brief = (col, r) => (col === "projects"
      ? { id: r.id, name: r.name, description: r.description, main: r.main, scenarios: r.scenarios, items: r.links?.items, risks: r.links?.risks }
      : { id: r.id, title: r.title, description: r.description, impacts: r.impacts, scenarios: r.scenarios, items: r.links?.items });
    const scope = flow.scope_col === "geral"
      ? { projects: db.projects.map((p) => brief("projects", p)), risks: db.risks.map((r) => brief("risks", r)) }
      : { [flow.scope_col]: [brief(flow.scope_col, Core.find(flow.scope_col, flow.scope_id) || {})] };
    const items = db.items.slice(-150).map((i) => ({ id: i.id, title: i.title, impacts: i.impacts, risk_reason: i.risk_reason }));
    const prompt = "Monte um FLUXO VISUAL que correlacione logicamente projetos, riscos, causas e impactos.\n"
      + `Descrição do usuário (o que o fluxo deve mostrar):\n${description || "(sem descrição: use os dados)"}\n\n`
      + `Como o usuário quer que os fluxos sejam montados (regras ensinadas por ele, siga com prioridade):\n${db.settings.flow_guidelines || "(nenhuma)"}\n\n`
      + `Exemplos de fluxos aprovados pelo usuário:\n${JSON.stringify(db.flow_examples.slice(-3))}\n\n`
      + `Dados do escopo:\n${JSON.stringify(scope)}\nItens da lista geral:\n${JSON.stringify(items)}\n\n`
      + `Fluxo atual montado a partir dos vínculos (pode melhorar, reorganizar, juntar ou acrescentar):\n${JSON.stringify({ nodes: base.nodes.map((n) => ({ key: n.id, label: n.label, type: n.type })), edges: base.edges })}\n\n`
      + "Regras: rótulos curtos (até ~8 palavras); use ref com o ID quando o nó for um registro existente; "
      + `rótulos de ligação preferidos: ${db.settings.lists.flow_edge_labels.join(", ")}; não invente fatos que não estejam nos dados ou na descrição.`;
    try {
      const out = await this.call(prompt, this.FLOW_SCHEMA, "medium");
      const keys = new Set(out.nodes.map((n) => n.key));
      const nodes = out.nodes.map((n) => ({ id: n.key, label: n.label, type: n.type, ref: n.ref || "" }));
      const edges = out.edges.filter((e) => keys.has(e.from) && keys.has(e.to)).map((e, i) => ({ id: "E" + (i + 1), ...e }));
      return { ...Core.layoutFlow(nodes, edges), engine: this.model };
    } catch (e) {
      return { ...base, engine: "heuristica", error: e.message };
    }
  },

  // ---------------------------------------------------------------- reuniões obrigatórias: sugestão de datas
  SUGGEST_SCHEMA: {
    type: "object", additionalProperties: false, required: ["suggestions"],
    properties: { suggestions: { type: "array", items: { type: "object", additionalProperties: false, required: ["mandatory_id", "date", "time", "reason"],
      properties: { mandatory_id: { type: "string" }, date: { type: "string", description: "AAAA-MM-DD" }, time: { type: "string", description: "HH:MM" }, reason: { type: "string" } } } } },
  },
  async suggestMeetings(db, month) {
    const base = Core.heuristicSuggestions(month);
    if (!this.enabled() || !db.mandatory.some((m) => m.active !== false)) return { suggestions: base, engine: "heuristica" };
    const status = Core.mandatoryStatus(month);
    const busy = db.meetings.filter((m) => (m.date || "").startsWith(month)).map((m) => ({ date: m.date, time: m.time || "", duration: m.duration || 60, title: m.title, status: m.status }));
    const prompt = `Sugira datas e horários para as REUNIÕES OBRIGATÓRIAS do mês ${month} (hoje é ${todayISO()}; não sugira datas passadas).\n`
      + `Horário de trabalho: ${db.settings.work_hours.start}–${db.settings.work_hours.end}, segunda a sexta.\n`
      + `Regras e observações do usuário (siga com prioridade):\n${db.settings.meeting_rules || "(nenhuma)"}\n\n`
      + `Reuniões obrigatórias (frequência, duração em minutos, dias preferidos 0=domingo..6=sábado, horário preferido):\n${JSON.stringify(db.mandatory.filter((m) => m.active !== false))}\n\n`
      + `Situação no mês (exigidas, já agendadas, realizadas):\n${JSON.stringify(status)}\n\n`
      + `Agenda já ocupada no mês (evite conflitos):\n${JSON.stringify(busy)}\n\n`
      + `Sugestão inicial calculada pela frequência (pode melhorar):\n${JSON.stringify(base)}\n\n`
      + "Sugira apenas as ocorrências que faltam para cumprir a frequência. Explique em reason, em uma frase, por que escolheu a data/horário.";
    try {
      const out = await this.call(prompt, this.SUGGEST_SCHEMA, "medium");
      const ids = new Map(db.mandatory.map((m) => [m.id, m]));
      const suggestions = out.suggestions.filter((x) => ids.has(x.mandatory_id) && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && x.date.startsWith(month))
        .map((x) => ({ ...x, title: ids.get(x.mandatory_id).title }));
      return { suggestions, engine: this.model };
    } catch (e) {
      return { suggestions: base, engine: "heuristica", error: e.message };
    }
  },

  // ---------------------------------------------------------------- dashboards
  async dashboardInsights(kind, metrics) {
    const label = { projects: "projetos", meetings: "reuniões", risks: "riscos" }[kind];
    if (!this.enabled()) return t("IA offline: conecte a IA em Configurações para receber a análise do dashboard.");
    const prompt = `Analise este dashboard de ${label} para a diretoria. Em até 6 bullets curtos: o que os números mostram, `
      + "o que exige atenção agora, a causa provável e a ação recomendada. Cite números. Depois, em uma linha, diga qual visualização "
      + `deixa a mensagem principal mais clara e por quê.\nDados:\n${JSON.stringify(metrics).slice(0, 60000)}`;
    try { return await this.call(prompt, null, "low", 3000); }
    catch (e) { return `${t("Análise da IA indisponível:")} ${e.message}`; }
  },

  // ---------------------------------------------------------------- tradução
  TRANSLATE_SCHEMA: {
    type: "object", additionalProperties: false, required: ["items"],
    properties: { items: { type: "array", items: { type: "object", additionalProperties: false, required: ["key", "source_lang", "segments"],
      properties: { key: { type: "string" }, source_lang: { type: "string", enum: ["pt", "en", "zh", "other"] },
        segments: { type: "array", items: { type: "object", additionalProperties: false, required: ["src", "pt", "en", "zh"],
          properties: { src: { type: "string" }, pt: { type: "string" }, en: { type: "string" }, zh: { type: "string" } } } } } } } },
  },
  /** Traduz textos frase a frase para pt, en e zh. Retorna { key: {source_lang, segments} }; {} se a IA estiver indisponível. */
  async translateBatch(items) {
    if (!this.enabled() || !items.length) return {};
    const glossary = Core.db?.settings.translation_glossary || "";
    const content = "Traduza cada texto abaixo FRASE A FRASE para português do Brasil (pt), inglês (en) e chinês simplificado (zh).\n"
      + "Contexto: governança de uma fábrica automotiva (GWM Brasil): demandas da diretoria, reuniões, projetos e riscos.\n"
      + "Regras: tom corporativo claro; mantenha IDs (GOV001, PROJ002…), siglas, números, datas e nomes próprios; "
      + "não acrescente nem omita informação; cada segmento é uma frase do original (src), com a versão nos três idiomas "
      + "(no idioma de origem, repita a frase original). Informe o idioma de origem em source_lang. Devolva a mesma key.\n"
      + (glossary ? `Glossário obrigatório (termo = tradução):\n${glossary}\n` : "")
      + `Textos:\n${JSON.stringify(items)}`;
    try {
      const out = await this.call(content, this.TRANSLATE_SCHEMA, "low", 16000, "Você é um tradutor corporativo português/inglês/chinês. Traduza com fidelidade, sem comentários.");
      return Object.fromEntries((out.items || []).filter((x) => x.segments?.length).map((x) => [x.key, { source_lang: x.source_lang, segments: x.segments }]));
    } catch (e) {
      console.warn("tradução falhou:", e.message);
      return {};
    }
  },

  // ---------------------------------------------------------------- summaries
  async narrative(summary) {
    const k = summary.kpis;
    const basic = t("NARRATIVE_BASIC", { ...k, alerts: summary.alerts.length });
    if (!this.enabled()) return basic;
    const prompt = `Escreva os DESTAQUES deste summary de governança (${summary.type}) em até 8 bullets curtos, em ${I18N.aiLanguage()}: `
      + "o que mudou, o que exige atenção da diretoria, riscos, decisões e próximos passos. Use Hoshin Kanri "
      + "para conectar com os objetivos estratégicos. Dados:\n" + JSON.stringify(summary).slice(0, 80000);
    try { return await this.call(prompt, null, "low", 4000); }
    catch (e) { return `${basic}\n(${t("Destaques da IA indisponíveis:")} ${e.message})`; }
  },
};

function fileToB64(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(file); });
}
