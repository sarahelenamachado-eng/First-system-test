  },
  dashRisks() {
    const open = this.db.risks.filter((r) => r.status !== "Fechado"), s = this.db.settings;
    const P = ["Alta", "Média", "Baixa"], I = ["Alto", "Médio", "Baixo"];
    const since = addDays(todayISO(), -30);
    return {
      total: open.length, closed: this.db.risks.length - open.length,
      investigate: open.filter((r) => r.mode === "Investigar").length, monitor: open.filter((r) => r.mode !== "Investigar").length,
      critical: open.filter((r) => r.probability === "Alta" && r.impact === "Alto").length,
      stale: open.filter((r) => daysSince(r.updated_at) >= (+s.alert_days_without_update || 15)).length,
      matrix: P.map((p) => I.map((i) => open.filter((r) => (r.probability || "Média") === p && (r.impact || "Médio") === i).length)),
      byImpact: s.lists.impact_types.map((x) => [x, open.filter((r) => (r.impacts || []).includes(x)).length]),
      inputs30: open.reduce((a, r) => a + (r.inputs_log || []).filter((x) => (x.date || "") >= since).length, 0),
      withProjects: open.filter((r) => (r.links?.projects || []).length || (r.links?.items || []).some((i) => (this.find("items", i)?.links?.projects || []).length)).length,
    };
  },

  // ------------------------------------------------------------ tradução automática
  /** Texto do campo no idioma pedido (tradução válida para o texto atual) ou o original. */
  loc(rec, field, lang = I18N.lang) {
    const v = rec?.[field], tr = rec?.tr?.[field];
    if (!v || !tr || tr.hash !== strHash(v) || tr.source === lang || !tr.segments?.length) return v || "";
    return tr.segments.map((x) => x[lang]).filter(Boolean).join(" ") || v;
  },
  /** Lista de [registro, campo] com texto ainda sem tradução atualizada. */
  pendingTranslations(only = null) {
    const out = [];
    const scan = (rec, fields) => { for (const f of fields) { const v = rec[f]; if (typeof v === "string" && v.trim() && !rec.history_user && (!rec.tr?.[f] || rec.tr[f].hash !== strHash(v)) && !(rec.tr?.[f]?.failed === strHash(v))) out.push([rec, f]); } };
    for (const [col, fields] of Object.entries(TRANSLATABLE)) {
      for (const rec of this.db[col] || []) {
        if (only && (only.col !== col || only.id !== rec.id)) continue;
        scan(rec, fields);
        for (const [list, sf] of Object.entries(SUB_TRANSLATABLE)) for (const e of rec[list] || []) if (list !== "history" || !e.msg) scan(e, sf);
      }
    }
    return out;
  },
  async translatePending(only = null, max = 400) {
    let done = 0;
    while (done < max) {
      const pend = this.pendingTranslations(only);
      if (!pend.length) break;
      // lotes de até ~6000 caracteres
      const batch = []; let size = 0;
      for (const p of pend) { const len = p[0][p[1]].length; if (batch.length && size + len > 6000) break; batch.push(p); size += len; }
      const res = await AI.translateBatch(batch.map(([r, f], i) => ({ key: String(i), text: r[f] })));
      batch.forEach(([r, f], i) => {
        const tr = res[String(i)];
        r.tr ??= {};
        if (tr) r.tr[f] = { hash: strHash(r[f]), source: tr.source_lang, segments: tr.segments, at: nowISO() };
        else r.tr[f] = { ...(r.tr[f] || {}), failed: strHash(r[f]) };
      });
      done += batch.length;
      if (!Object.keys(res).length) break; // IA indisponível: para e tenta na próxima alteração
    }
    return done;
  },
  _trq: Promise.resolve(),
  /** Traduz em segundo plano depois de cada alteração (não atrasa o salvamento). */
  queueTranslation() {
    if (!this.db?.settings.auto_translate || !AI.enabled()) return;
    this._trq = this._trq.then(async () => {
      try {
        const n = await this.translatePending(null, 120);
        if (n) { await this.save(); window.dispatchEvent(new Event("gov-translated")); }
      } catch (e) { console.warn("tradução:", e); }
    });
  },

  // ------------------------------------------------------------ roteador local
  async api(path, method = "GET", body = {}) {
    const res = await this.route(path.split("?")[0].replace(/^\/+|\/+$/g, "").split("/"), method, body || {});
    if (method !== "GET" || res?._dirty) await this.save();
    if (res && res._dirty) delete res._dirty;
    if (method !== "GET" && !path.startsWith("translate")) this.queueTranslation();
    return res === undefined ? res : structuredClone(res);
  },

  async route(parts, method, body) {
    const db = this.db;
    const [head, rid, action] = parts;

    if (head === "state" && method === "GET") {
      let dirty = this.autoMeetings();
      for (const p of db.projects) dirty = (await this.syncSchedules(p)) || dirty;
      return { _dirty: dirty, db: Object.fromEntries([...COLLECTIONS, "settings", "flow_examples", "meeting_suggestions", "risk_lessons"].map((k) => [k, db[k]])), events: db.events.slice(-60),
        alerts: this.alerts(), ai: AI.status(), workspace: Store.name, definitions: AI.DEFINITIONS, impact_types: AI.IMPACT_TYPES,
        summaries: db.summaries.slice(-30), today: todayISO() };
    }
    if (head === "settings" && method === "PATCH") {
      for (const [k, v] of Object.entries(body)) {
        if ((k === "lists" || k === "appearance") && v && typeof v === "object") db.settings[k] = { ...db.settings[k], ...v };
        else db.settings[k] = v;
      }
      AI.IMPACT_TYPES = db.settings.lists.impact_types;
      return db.settings;
    }
    if (head === "meeting_suggest" && method === "POST") {
      const month = body.month || todayISO().slice(0, 7);
      const res = await AI.suggestMeetings(db, month);
      db.meeting_suggestions = [...db.meeting_suggestions.filter((x) => !x.date.startsWith(month)),
        ...res.suggestions.map((x, i) => ({ ...x, id: `SUG${Date.now().toString(36)}${i}`, month }))];
      return { suggestions: db.meeting_suggestions, engine: res.engine, error: res.error };
    }
    if (head === "meeting_suggest_accept" && method === "POST") {
      const created = [];
      for (const id of body.ids || []) {
        const sg = db.meeting_suggestions.find((x) => x.id === id);
        if (!sg) continue;
        const m = db.mandatory.find((x) => x.id === sg.mandatory_id) || {};
        const rec = await this.createRecord("meetings", { title: sg.title || m.title, date: sg.date, time: sg.time, status: "Agendada", mandatory_id: m.id,
          level: m.level || "Gerencial", mtype: m.mtype || "Reporte", scheduling: "Pré-agendada", participants: m.participants || "", agenda: m.notes || "", duration: m.duration || 60 });
        created.push(rec.id);
      }
      db.meeting_suggestions = db.meeting_suggestions.filter((x) => !(body.ids || []).includes(x.id) && !(body.discard || []).includes(x.id));
      return { created };
    }
    if (head === "translate" && method === "POST") {
      // traduz agora um registro (col/id) ou tudo o que estiver pendente
      if (!AI.enabled()) throw new ApiError(t("A tradução automática precisa da IA ligada (Configurações → IA)."));
      if (body.force && body.col) { const r = this.find(body.col, body.id); if (r) { delete r.tr; for (const l of Object.keys(SUB_TRANSLATABLE)) for (const e of r[l] || []) delete e.tr; } }
      const n = await this.translatePending(body.col ? { col: body.col, id: body.id } : null);
      return { translated: n, rec: body.col ? this.find(body.col, body.id) : null };
    }
    if (head === "insights" && method === "POST") {
      const metrics = { projects: () => this.dashProjects(), meetings: () => this.dashMeetings(body.period || "month"), risks: () => this.dashRisks() }[body.kind]?.();
      if (!metrics) throw new ApiError("Unknown route");
      const text = await AI.dashboardInsights(body.kind, metrics);
      db.settings.last_insights = { ...(db.settings.last_insights || {}), [body.kind]: { text, at: nowISO() } };
      return { text };
    }
    if (head === "backup" && method === "POST") {
      // restaura um db.json exportado (substitui a base atual; a anterior é guardada em BACKUPS/)
      const incoming = body.db;
      if (!incoming || !Array.isArray(incoming.items) || !incoming.seq) throw new ApiError(t("Arquivo de backup inválido"));
      await Store.write(`BACKUPS/db_${nowISO().replace(/[:T]/g, "-")}.json`, JSON.stringify(db, null, 2));
      this.normalize(incoming);
      this.db = incoming;
      AI.IMPACT_TYPES = incoming.settings.lists.impact_types;
      return { ok: true };
    }

    if (head === "summary" && method === "POST") {
      const kind = body.type || "daily";
      const summary = this.buildSummary(kind, body.date || todayISO());
      const text = body.narrative === false ? "" : await AI.narrative(summary);
      const file = `SUMMARIES/${kind === "weekly" ? "semanal" : "diario"}_${summary.period.start}_${I18N.lang}.html`;
      await Store.write(file, this.summaryHtml(summary, text));
      db.summaries = db.summaries.filter((x) => x.file !== file);
      db.summaries.push({ type: kind, period: summary.period, file, generated_at: nowISO() });
      return { summary, narrative: text, file };
    }

    if (!COLLECTIONS.includes(head) || head === "actions") throw new ApiError("Unknown route");
    const col = head;

    if (method === "POST" && !rid) {
      const data = { ...body };
      delete data.id;
      if (col === "meetings" && data.status === "Solicitada") data.requested_at ??= todayISO();
      const rec = await this.createRecord(col, data);
      if (col === "inputs") {
        rec.status = "Novo";
        if (rec.meeting_id) this.link("inputs", rec.id, "meetings", rec.meeting_id);
      }
      const proj = col === "meetings" && rec.project_id ? this.find("projects", rec.project_id) : null;
      if (proj) {
        this.link("meetings", rec.id, "projects", proj.id);
        if (rec.status === "Realizada") {
          proj.next_meeting = addDays(rec.date, +db.settings.project_meeting_cadence_days || 15);
          proj.last_monitored = todayISO();
        }
      }
      if (col === "flows" && rec.scope_col && rec.scope_col !== "geral") this.link("flows", rec.id, rec.scope_col, rec.scope_id);
      return rec;
    }

    const rec = rid ? this.find(col, rid) : null;
    if (rid && !rec) throw new ApiError(t("{id} não encontrado", { id: rid }));

    if (method === "GET" && rec && !action) return rec;
    if (method === "PATCH" && rec && !action) {
      const data = { ...body };
      for (const k of ["id", "created_at", "links", "folder", "pitems", "activities", "scenarios", "inputs_log", "actions", "schedules", "item_actions"]) delete data[k];
      const note = data._note, silent = data._silent;
      delete data._note; delete data._silent;
      Object.assign(rec, data);
      if (note) (rec.history ??= []).push({ date: nowISO(), text: note });  // texto do usuário: não traduzido
      if (col === "projects") rec.last_monitored = todayISO();
      this.touch(rec);
      if (note) this.log(`${col}.updated`, rid, "{id} atualizado: {note}", { id: rid, note });
      else if (!silent) this.log(`${col}.updated`, rid, "{id} atualizado", { id: rid });
      return rec;
    }
    if (method === "DELETE" && rec) {
      db[col] = db[col].filter((r) => r.id !== rid);
      for (const other of COLLECTIONS) for (const r of db[other]) {
        const lst = r.links?.[col];
        if (lst?.includes(rid)) lst.splice(lst.indexOf(rid), 1);
      }
      this.log(`${col}.deleted`, rid, "{id} removido (a pasta local foi mantida)", { id: rid });
      return { ok: true };
    }

    // ---- ações específicas
    if (method === "POST" && action === "link") {
      if (!this.find(body.collection, body.id)) throw new ApiError(t("{id} não encontrado", { id: body.id }));
      this.link(col, rid, body.collection, body.id);
      this.log("link", rid, "{a} vinculado a {b}", { a: rid, b: body.id });
      return rec;
    }
    if (col === "inputs" && action === "suggest") {
      rec.ai_suggestion = await AI.assessInput(db, rec);
      rec.status = "Em avaliação";
      this.touch(rec);
      return rec;
    }
    if (col === "inputs" && action === "commit") return { input: rec, created: await this.commitInput(rec, body) };
    if (col === "projects" && action === "upload") {
      const sub = (body.kind || "schedule") === "schedule" ? "master_schedule" : "documentos";
      const rel = await Store.writeUnique(`${rec.folder}/${sub}`, body.file.name, body.file);
      await this.syncSchedules(rec);
      rec.last_monitored = todayISO();
      this.touch(rec);
      this.log("projects.upload", rid, "Upload em {id}: {file}", { id: rid, file: rel.split("/").pop() });
      return rec;
    }
    if (col === "projects" && action === "analyze") {
      const sched = rec.schedules.find((s) => s.rel === body.rel);
      const file = sched && (await Store.read(sched.rel));
      if (!file) throw new ApiError(t("Cronograma não encontrado na pasta"));
      sched.analysis = await AI.analyzeSchedule(rec, file, todayISO());
      sched.analyzed_at = nowISO();
      this.touch(rec);
      this.log("projects.analyzed", rid, "Master schedule de {id} analisada: {file}", { id: rid, file: sched.name });
      return rec;
    }
    if (col === "projects" && action === "actions") {
      if (body.id) {
        const act = rec.actions.find((a) => a.id === body.id);
        if (!act) throw new ApiError(t("Ação não encontrada"));
        Object.assign(act, body);
      } else {
        rec.actions.push({ ...body, id: this.nextId("actions"), status: body.status || "Aberta", created_at: nowISO() });
      }
      rec.last_monitored = todayISO();
      this.touch(rec);
      if (body.id) this.log("projects.action", rid, "Portfólio {id}: ação {act} → {status}", { id: rid, act: body.id, status: [body.status || ""] });
      else this.log("projects.action", rid, "Portfólio {id}: ação {act} criada", { id: rid, act: rec.actions.at(-1).id });
      return rec;
    }
    if (["risks", "meetings", "items"].includes(col) && action === "upload") {
      const rel = await Store.writeUnique(this.folderFor(col, rid), body.file.name, body.file);
      this.touch(rec);
      this.log(`${col}.upload`, rid, "Documento anexado a {id}: {file}", { id: rid, file: rel.split("/").pop() });
      return rec;
    }
    if (action === "files" && method === "GET") return Store.list(rec.folder || this.folderFor(col, rid));
    if (col === "risks" && action === "analyze") {
      rec.analysis = await AI.analyzeRisk(db, rec, await this.filesText(rec.folder));
      this.touch(rec);
      this.log("risks.analyzed", rid, "Risco {id} analisado", { id: rid });
      return rec;
    }
    if (action === "sub" && SUB_LISTS[col]?.includes(body.list)) {
      const list = (rec[body.list] ??= []);
      let entry = null;
      if (body.remove) {
        rec[body.list] = list.filter((x) => x.id !== body.remove);
      } else if (body.entry?.id) {
        entry = list.find((x) => x.id === body.entry.id);
        if (!entry) throw new ApiError(t("{id} não encontrado", { id: body.entry.id }));
        const wasDone = entry.status === "Finalizado";
        Object.assign(entry, body.entry, { updated_at: nowISO() });
        if (body.list === "pitems" && entry.status === "Finalizado" && !wasDone) {
          entry.done_at = todayISO();
          this.log("projects.item_done", rid, "Item {sub} de {id} finalizado — projeto {pct}% concluído", { sub: entry.id, id: rid, pct: this.projectPct(rec) });
        }
      } else {
        entry = { ...body.entry, id: this.subId(rec, body.list), created_at: nowISO() };
        list.push(entry);
        if (body.list === "inputs_log" && body.to_inputs) {
          const inp = await this.createRecord("inputs", { source: entry.source || "Outro", source_detail: "Atualização de item existente", title: `${rec.id}: ${entry.text.slice(0, 80)}`,
            description: entry.text, origin: entry.author || "", risk_id: rec.id });
          inp.status = "Novo";
          this.link("inputs", inp.id, "risks", rec.id);
          entry.input_id = inp.id;
        }
      }
      if (col === "projects") rec.last_monitored = todayISO();
      this.touch(rec);
      if (!(body.list === "pitems" && entry?.status === "Finalizado")) this.log(`${col}.sub`, rid, "{id}: {list} atualizado", { id: rid, list: [SUB_LABEL[body.list]] });
      return rec;
    }
    if (col === "projects" && action === "import") {
      if (body.file) await Store.writeUnique(`${rec.folder}/master_schedule`, body.file.name, body.file);
      const res = this.importActivities(rec, body.rows || [], +body.header_row || 0, body.mapping || {});
      await this.syncSchedules(rec);
      rec.last_monitored = todayISO();
      this.touch(rec);
      this.log("projects.import", rid, "Planilha importada em {id}: {added} novas atividades, {updated} atualizadas", { id: rid, ...res });
      return { project: rec, result: res };
    }
    if (col === "meetings" && action === "status") {
      const proj = rec.project_id ? this.find("projects", rec.project_id) : null;
      rec.status = body.status;
      if (body.note) (rec.history ??= []).push({ date: nowISO(), text: body.note });
      if (body.status === "Realizada") {
        rec.held_at = body.date || rec.date || todayISO();
        if (proj) { proj.next_meeting = addDays(rec.held_at, +db.settings.project_meeting_cadence_days || 15); proj.last_monitored = todayISO(); }
        this.log("meetings.done", rid, "Reunião {id} confirmada como realizada", { id: rid });
      } else if (body.status === "Cancelada") {
        this.log("meetings.cancelled", rid, "Reunião {id} cancelada", { id: rid });
      } else if (body.status === "Não realizada") {
        if (proj) proj.next_meeting = body.new_date || addDays(todayISO(), 7);
        this.log("meetings.not_done", rid, "Reunião {id} não realizada", { id: rid });
      }
      this.touch(rec);
      return rec;
    }
    if (col === "flows" && action === "generate") {
      let g;
      if (body.mode === "ai") g = await AI.generateFlow(db, rec, body.description ?? rec.description ?? "");
      else g = this.flowFromData(rec.scope_col, rec.scope_id);
      if (body.description !== undefined) rec.description = body.description;
      rec.nodes = g.nodes; rec.edges = g.edges; rec.engine = g.engine || "dados";
      this.touch(rec);
      this.log("flows.generated", rid, "Fluxo {id} gerado", { id: rid });
      return rec;
    }
    if (col === "items" && action === "merge") return this.mergeItems(rid, (body.into || "").toUpperCase());
    if (col === "items" && action === "progress") {
      // registro de progresso (histórico geral do item), opcionalmente ligado a uma ação do item
      const act = body.action_id ? rec.item_actions.find((x) => x.id === body.action_id) : null;
      if (act) { act.progress = body.text; act.updated_at = nowISO(); if (body.status) act.status = body.status; }
      (rec.history ??= []).push({ date: nowISO(), text: body.text, action_id: body.action_id || "", kind: "progress" });
      if (body.status_item) rec.status = body.status_item;
      this.touch(rec);
      this.log("items.progress", rid, "{id} atualizado: {note}", { id: rid, note: body.text });
      return rec;
    }
    if (action === "teach" && ["items", "risks", "inputs"].includes(col)) {
      // análise de risco do usuário: fica no registro e vira exemplo para a IA
      const lesson = { date: nowISO(), ref: rid, col, text: col === "risks" ? `${rec.title || ""} ${rec.description || ""}` : AI.itemText(rec) + " " + AI.inputText(rec),
        analysis: body.analysis || "", level: body.level || "", factors: body.factors || [] };
      rec.risk_analysis = { analysis: lesson.analysis, level: lesson.level, factors: lesson.factors, date: lesson.date };
      db.risk_lessons = [...db.risk_lessons.filter((x) => x.ref !== rid), lesson].slice(-200);
      this.touch(rec);
      this.log(`${col}.teach`, rid, "Análise de risco de {id} registrada para a IA aprender", { id: rid });
      return rec;
    }
    if (col === "flows" && action === "learn") {
      db.flow_examples.push({ date: nowISO(), title: rec.title, scope: `${rec.scope_col}:${rec.scope_id || ""}`, description: rec.description || "",
        nodes: (rec.nodes || []).map((n) => ({ key: n.id, label: n.label, type: n.type })), edges: (rec.edges || []).map((e) => ({ from: e.from, to: e.to, label: e.label })) });
      db.flow_examples = db.flow_examples.slice(-10);
      this.log("flows.learned", rid, "Fluxo {id} salvo como exemplo para a IA", { id: rid });
      return rec;
    }
    if (col === "meetings" && action === "extract") {
      const out = await AI.extractMeeting(db, rec);
      rec.extraction = out;
      if (out.decisions?.length) rec.decisions = out.decisions;
      this.touch(rec);
      return rec;
    }
    throw new ApiError("Unknown route");
  },
};
</script>
<script>
/* Editor visual de fluxos (SVG): nós arrastáveis, ligações com rótulo, geração pelos dados ou pela IA.
 * Cada fluxo é um registro em db.flows: { nodes:[{id,label,type,ref,x,y}], edges:[{id,from,to,label}] }. */
const FlowEd = {
  flow: null,
  sel: null,          // { kind: "node"|"edge", id }
  connecting: null,   // id do nó de origem quando em modo "Conectar"
  connectMode: false,
  drag: null,
  _saveTimer: null,

  TYPES: ["project", "risk", "item", "cause", "impact", "action", "other"],
  TYPE_LABEL: { project: "Projeto", risk: "Risco", item: "Item", cause: "Causa", impact: "Impacto", action: "Ação", other: "Outro" },

  style(type) {
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "#C00000";
    return {
      project: { fill: "#ffffff", stroke: accent, sw: 2.5, text: "#1a1a1a" },
      risk: { fill: "#fdeaea", stroke: accent, sw: 1.5, text: "#7a0000" },
      impact: { fill: "#efefef", stroke: "#6b6b6b", sw: 1.2, text: "#1a1a1a" },
      item: { fill: "#ffffff", stroke: "#9a9a9a", sw: 1.2, text: "#1a1a1a" },
      cause: { fill: "#ffffff", stroke: "#9a9a9a", sw: 1.2, text: "#1a1a1a" },
      action: { fill: "#fff6e5", stroke: "#a86500", sw: 1.2, text: "#5a3600" },
      other: { fill: "#ffffff", stroke: "#bdbdbd", sw: 1, text: "#333333" },
    }[type] || { fill: "#fff", stroke: "#bbb", sw: 1, text: "#333" };
  },
  lines(label) {
    const words = String(label || "").split(/\s+/), out = [];
    let cur = "";
    for (const w of words) {
      if ((cur + " " + w).trim().length > 28 && cur) { out.push(cur); cur = w; } else cur = (cur + " " + w).trim();
    }
    if (cur) out.push(cur);
    if (out.length > 3) { out.length = 3; out[2] = out[2].slice(0, 25) + "…"; }
    return out.length ? out : [""];
  },
  size(n) { const ls = this.lines(n.label); return { w: Math.min(230, Math.max(120, Math.max(...ls.map((l) => l.length)) * 7 + 26)), h: 18 + ls.length * 16, ls }; },

  // ------------------------------------------------------------ desenho
  svg() {
    const f = this.flow, E = (x) => esc(x);
    const nodes = f.nodes || [], edges = f.edges || [];
    const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
    let W = 900, H = 500;
    for (const n of nodes) { const s = this.size(n); W = Math.max(W, n.x + s.w + 80); H = Math.max(H, n.y + s.h + 80); }
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "#C00000";
    const edgeSvg = edges.map((e) => {
      const a = byId[e.from], b = byId[e.to];
      if (!a || !b) return "";
      const sa = this.size(a), sb = this.size(b);
      let x1 = a.x + sa.w, y1 = a.y + sa.h / 2, x2 = b.x, y2 = b.y + sb.h / 2;
      if (b.x + sb.w / 2 < a.x + sa.w / 2) { x1 = a.x; x2 = b.x + sb.w; }        // destino à esquerda
      const dx = Math.max(40, Math.abs(x2 - x1) / 2) * (x2 >= x1 ? 1 : -1);
      const sel = this.sel?.kind === "edge" && this.sel.id === e.id;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, lab = tv(e.label);
      return `<g class="fl-edge" data-edge="${E(e.id)}">
        <path d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}" fill="none" stroke="transparent" stroke-width="14"/>
        <path d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}" fill="none" stroke="${sel ? accent : "#8a8a8a"}" stroke-width="${sel ? 2.5 : 1.5}" marker-end="url(#arrow${sel ? "S" : ""})"/>
        ${lab ? `<rect x="${mx - lab.length * 3.4 - 6}" y="${my - 10}" width="${lab.length * 6.8 + 12}" height="18" rx="9" fill="#ffffff" stroke="#d6d6d6"/>
        <text x="${mx}" y="${my + 3}" text-anchor="middle" font-size="11" fill="#444">${E(lab)}</text>` : ""}
      </g>`;
    }).join("");
    const nodeSvg = nodes.map((n) => {
      const s = this.size(n), st = this.style(n.type), sel = this.sel?.kind === "node" && this.sel.id === n.id;
      const src = this.connecting === n.id;
      return `<g class="fl-node" data-node="${E(n.id)}" transform="translate(${n.x},${n.y})">
        <rect width="${s.w}" height="${s.h}" rx="8" fill="${st.fill}" stroke="${sel || src ? accent : st.stroke}" stroke-width="${sel || src ? 3 : st.sw}" ${src ? 'stroke-dasharray="5 3"' : ""}/>
        ${n.type === "project" ? `<rect width="6" height="${s.h}" rx="3" fill="${accent}"/>` : ""}
        <text x="${s.w / 2}" y="18" text-anchor="middle" font-size="12.5" fill="${st.text}" font-weight="${n.type === "project" || n.type === "risk" ? 700 : 500}">
          ${s.ls.map((l, i) => `<tspan x="${s.w / 2}" dy="${i ? 16 : 0}">${E(l)}</tspan>`).join("")}</text>
        <title>${E(t(this.TYPE_LABEL[n.type] || n.type))}${n.ref ? " · " + E(n.ref) : ""}: ${E(n.label)}</title>
      </g>`;
    }).join("");
    return `<svg id="fl-svg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="background:#fbfbfb">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
        <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${accent}"/></marker>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#efefef"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" class="fl-bg"/>
      ${edgeSvg}${nodeSvg}
    </svg>`;
  },

  panel() {
    const f = this.flow, sel = this.sel;
    const labels = S.db.settings.lists.flow_edge_labels || [];
    let props = `<p class="muted">${t("Clique em um nó ou ligação para editar. Arraste os nós para organizar. Duplo clique no fundo cria um nó.")}</p>`;
    if (sel?.kind === "node") {
      const n = f.nodes.find((x) => x.id === sel.id);
      if (n) props = `<h3>${t("Nó selecionado")}</h3>${L("Texto")}<textarea id="fl-label" style="min-height:60px">${esc(n.label)}</textarea>
        <div class="row"><div>${L("Tipo")}<select id="fl-type">${this.TYPES.map((x) => `<option value="${x}" ${x === n.type ? "selected" : ""}>${esc(t(this.TYPE_LABEL[x]))}</option>`).join("")}</select></div>
        <div>${L("Registro (ID)")}<input id="fl-ref" value="${esc(n.ref)}" placeholder="PROJ001"></div></div>
        <div class="actions"><button class="small" onclick="FlowEd.applyNode()">${t("Aplicar")}</button>
        ${n.ref ? `<button class="small ghost" onclick="FlowEd.openRef('${esc(n.ref)}')">${t("Abrir registro")}</button>` : ""}
        <button class="small ghost danger" onclick="FlowEd.removeSel()">${t("Excluir")}</button></div>`;
    } else if (sel?.kind === "edge") {
      const e = f.edges.find((x) => x.id === sel.id);
      if (e) props = `<h3>${t("Ligação selecionada")}</h3>${L("Rótulo")}<input id="fl-elabel" list="fl-labels" value="${esc(tv(e.label))}">
        <datalist id="fl-labels">${labels.map((l) => `<option value="${esc(t(l))}">`).join("")}</datalist>
        <div class="actions"><button class="small" onclick="FlowEd.applyEdge()">${t("Aplicar")}</button><button class="small ghost" onclick="FlowEd.reverseEdge()">${t("Inverter sentido")}</button>
        <button class="small ghost danger" onclick="FlowEd.removeSel()">${t("Excluir")}</button></div>`;
    }
    return props;
  },

  view(flow) {
    this.flow = flow;
    const scopeName = flow.scope_col === "geral" ? t("Geral (todos os projetos e riscos)")
      : `${flow.scope_id} · ${esc((Core.find(flow.scope_col, flow.scope_id) || {}).name || (Core.find(flow.scope_col, flow.scope_id) || {}).title || "")}`;
    return `<p><a href="#fluxos">← ${t("Fluxos")}</a></p>
    <h1>${flow.id} · ${esc(flow.title)}</h1><p class="muted">${t("Escopo")}: ${scopeName} · ${t("gerado por")} ${esc(tv(flow.engine) || "—")}</p>
    <div class="toolbar">
      <select id="fl-newtype">${this.TYPES.map((x) => `<option value="${x}">${esc(t(this.TYPE_LABEL[x]))}</option>`).join("")}</select>
      <button class="small" onclick="FlowEd.addNode()">${t("+ Nó")}</button>
      <button class="small ${this.connectMode ? "" : "ghost"}" id="fl-connect" onclick="FlowEd.toggleConnect()">${t(this.connectMode ? "Conectando… (clique origem e destino)" : "Conectar nós")}</button>
      <button class="small ghost" onclick="FlowEd.relayout()">${t("Reorganizar")}</button>
      <button class="small ghost" onclick="busy(this, ()=>FlowEd.generate('data'))">${t("Gerar pelos dados")}</button>
      <button class="small" onclick="busy(this, ()=>FlowEd.generate('ai'))">${t("Gerar com IA")}</button>
      <button class="small ghost" onclick="FlowEd.exportSvg()">${t("Exportar imagem (SVG)")}</button>
    </div>
    <div class="flow-wrap"><div class="flow-canvas" id="fl-canvas">${this.svg()}</div>
      <div class="flow-side card" id="fl-panel">${this.panel()}</div></div>
    <div class="grid" style="margin-top:14px">
      <div class="card"><h2>${t("Descrição para a IA")}</h2>
        <p class="muted">${t("Descreva o que este fluxo deve mostrar: causas, consequências, quais projetos e riscos se relacionam e por quê.")}</p>
        <textarea id="fl-desc" style="min-height:110px">${esc(flow.description)}</textarea>
        <div class="actions"><button onclick="busy(this, ()=>FlowEd.generate('ai'))">${t("Gerar com IA")}</button></div></div>
      <div class="card"><h2>${t("Ensinar a IA")}</h2>
        <p class="muted">${t("FLOW_TEACH_HELP")}</p>
        ${L("Regras para montar fluxos (valem para todos)")}<textarea id="fl-guide" style="min-height:110px" placeholder="${esc(t("FLOW_GUIDE_PLACEHOLDER"))}">${esc(S.db.settings.flow_guidelines)}</textarea>
        <div class="actions"><button class="ghost" onclick="busy(this, ()=>FlowEd.saveGuide())">${t("Salvar regras")}</button>
          <button onclick="busy(this, ()=>FlowEd.learn())">${t("Salvar este fluxo como exemplo")}</button>
          <span class="muted">${t("{n} exemplos salvos", { n: (S.db.flow_examples || []).length })}</span></div></div>
    </div>`;
  },

  mount() {
    const c = $("#fl-canvas");
    if (!c) return;
    c.onpointerdown = (ev) => this.down(ev);
    c.onpointermove = (ev) => this.move(ev);
    c.onpointerup = (ev) => this.up(ev);
    c.ondblclick = (ev) => this.dbl(ev);
  },
  redraw() { $("#fl-canvas").innerHTML = this.svg(); $("#fl-panel").innerHTML = this.panel(); },
  pt(ev) { const r = $("#fl-svg").getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; },

  // ------------------------------------------------------------ interação
  down(ev) {
    const g = ev.target.closest("[data-node],[data-edge]");
    if (!g) { this.sel = null; this.redraw(); return; }
    if (g.dataset.edge) { this.sel = { kind: "edge", id: g.dataset.edge }; this.redraw(); return; }
    const id = g.dataset.node;
    if (this.connectMode) {
      if (!this.connecting) { this.connecting = id; this.redraw(); return; }
      if (this.connecting !== id) {
        const labels = S.db.settings.lists.flow_edge_labels || [];
        this.flow.edges.push({ id: "E" + Date.now().toString(36), from: this.connecting, to: id, label: labels[2] || "" });
        this.sel = { kind: "edge", id: this.flow.edges.at(-1).id };
        this.save();
      }
      this.connecting = null; this.redraw(); return;
    }
    const n = this.flow.nodes.find((x) => x.id === id), p = this.pt(ev);
    this.drag = { id, dx: p.x - n.x, dy: p.y - n.y, moved: false };
    this.sel = { kind: "node", id };
    $("#fl-canvas").setPointerCapture(ev.pointerId);
    $("#fl-panel").innerHTML = this.panel();
  },
  move(ev) {
    if (!this.drag) return;
    const n = this.flow.nodes.find((x) => x.id === this.drag.id), p = this.pt(ev);
    n.x = Math.max(0, Math.round((p.x - this.drag.dx) / 10) * 10);
    n.y = Math.max(0, Math.round((p.y - this.drag.dy) / 10) * 10);
    this.drag.moved = true;
    $("#fl-canvas").innerHTML = this.svg();
  },
  up() { if (this.drag?.moved) this.save(); this.drag = null; this.redraw(); },
  dbl(ev) {
    if (ev.target.closest("[data-node]")) { $("#fl-label")?.focus(); return; }
    const p = this.pt(ev);
    const label = prompt(t("Texto do novo nó:"));
    if (!label) return;
    this.flow.nodes.push({ id: "N" + Date.now().toString(36), label, type: $("#fl-newtype").value, ref: "", x: Math.round(p.x / 10) * 10, y: Math.round(p.y / 10) * 10 });
    this.sel = { kind: "node", id: this.flow.nodes.at(-1).id };
    this.save(); this.redraw();
  },
  addNode() {
    const label = prompt(t("Texto do novo nó:"));
    if (!label) return;
    const maxY = Math.max(0, ...this.flow.nodes.map((n) => n.y + this.size(n).h));
    this.flow.nodes.push({ id: "N" + Date.now().toString(36), label, type: $("#fl-newtype").value, ref: "", x: 40, y: maxY + 30 });
    this.sel = { kind: "node", id: this.flow.nodes.at(-1).id };
    this.save(); this.redraw();
  },
  toggleConnect() { this.connectMode = !this.connectMode; this.connecting = null; $("#view").innerHTML = this.view(this.flow); this.mount(); },
  applyNode() {
    const n = this.flow.nodes.find((x) => x.id === this.sel.id);
    Object.assign(n, { label: $("#fl-label").value, type: $("#fl-type").value, ref: $("#fl-ref").value.trim().toUpperCase() });
    this.save(); this.redraw();
  },
  applyEdge() {
    const e = this.flow.edges.find((x) => x.id === this.sel.id);
    const typed = $("#fl-elabel").value.trim();
    // guarda o código original quando o texto é a tradução de um rótulo padrão
    const code = (S.db.settings.lists.flow_edge_labels || []).find((l) => t(l) === typed);
    e.label = code || typed;
    this.save(); this.redraw();
  },
  reverseEdge() { const e = this.flow.edges.find((x) => x.id === this.sel.id); [e.from, e.to] = [e.to, e.from]; this.save(); this.redraw(); },
  removeSel() {
    if (!this.sel) return;
    if (this.sel.kind === "node") {
      this.flow.nodes = this.flow.nodes.filter((n) => n.id !== this.sel.id);
      this.flow.edges = this.flow.edges.filter((e) => e.from !== this.sel.id && e.to !== this.sel.id);
    } else this.flow.edges = this.flow.edges.filter((e) => e.id !== this.sel.id);
    this.sel = null; this.save(); this.redraw();
  },
  relayout() { Core.layoutFlow(this.flow.nodes, this.flow.edges); this.save(); this.redraw(); },
  openRef(ref) {
    const view = { PROJ: "projetos", RISK: "riscos", GOV: "lista", MEET: "reunioes", INP: "entradas" }[ref.replace(/\d+$/, "")];
    if (view) location.hash = `${view}/${ref}`;
  },
  save() {
    clearTimeout(this._saveTimer);
    const f = this.flow;
    this._saveTimer = setTimeout(() => api(`flows/${f.id}`, "PATCH", { nodes: f.nodes, edges: f.edges, _silent: true }).catch((e) => toast(e.message)), 400);
  },
  async generate(mode) {
    if (this.flow.nodes?.length && !confirm(t("Substituir o fluxo atual pelo novo gerado?"))) return;
    clearTimeout(this._saveTimer);
    const desc = $("#fl-desc") ? $("#fl-desc").value : this.flow.description;
    const r = await api(`flows/${this.flow.id}/generate`, "POST", { mode, description: desc });
    S.db.flows = S.db.flows.map((f) => (f.id === r.id ? r : f));
    this.flow = r; this.sel = null;
    $("#view").innerHTML = this.view(r); this.mount();
    if (r.engine === "heuristica" && mode === "ai") toast(t("IA offline: fluxo montado pelos vínculos registrados."));
  },
  async saveGuide() {
    await api("settings", "PATCH", { flow_guidelines: $("#fl-guide").value });
    S.db.settings.flow_guidelines = $("#fl-guide").value;
    toast(t("Regras salvas"));
  },
  async learn() {
    clearTimeout(this._saveTimer);
    await api(`flows/${this.flow.id}`, "PATCH", { nodes: this.flow.nodes, edges: this.flow.edges, description: $("#fl-desc").value, _silent: true });
    await api(`flows/${this.flow.id}/learn`, "POST");
    await refresh();
    toast(t("Exemplo salvo: a IA vai usar este fluxo como referência."));
  },
  exportSvg() {
    const blob = new Blob([$("#fl-svg").outerHTML], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    download(url, `${this.flow.id}.svg`);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },
};

/** Abre (ou cria e gera pelos dados) o fluxo de um projeto/risco. */
async function openFlowFor(col, id) {
  let f = S.db.flows.find((x) => x.scope_col === col && x.scope_id === id);
  if (!f) {
    const rec = byId(col, id);
    f = await api("flows", "POST", { title: `${t("Fluxo")} — ${rec.name || rec.title}`, scope_col: col, scope_id: id, nodes: [], edges: [], description: "" });
    await api(`flows/${f.id}/generate`, "POST", { mode: "data" });
    await refresh();
  }
  location.hash = "fluxos/" + f.id;
}
</script>
<script>
/* Dashboards (projetos, reuniões, riscos), calendário de reuniões e reuniões obrigatórias.
 *
 * Escolha das formas: números de destaque em cartões (o "de XX projetos, XX…"); barras horizontais de uma cor
 * para contagens por categoria (valor na ponta); barra empilhada com cores de status (sempre com legenda e
 * números, nunca só a cor) para partes de um todo; mapa de calor de um só tom para probabilidade × impacto. */
const STATUS_COLORS = { good: "#2E7D32", warn: "#C98A00", bad: "#C00000", idle: "#B9BCC2" };
const HEAT = ["#f4f4f5", "#fbe1e1", "#f2b0b0", "#e07272", "#c53030", "#990000"];

// ------------------------------------------------------------------ peças de gráfico
function statTile(value, label, sub = "", href = "") {
  const tag = href ? "a" : "div";
  return `<${tag} class="kpi" ${href ? `href="#${href}"` : ""}><b>${value ?? "—"}</b><span>${esc(label)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}</${tag}>`;
}
/** Barras horizontais de uma série (uma cor), valor na ponta. rows: [[rótulo, valor, dica?]] */
function hbars(rows, { color = "var(--brand)", empty = "—" } = {}) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  if (!rows.length) return `<p class="muted">${empty}</p>`;
  return `<div class="hbars">${rows.map(([label, v, hint]) => `<div class="hb-row" title="${esc(label)}: ${v}${hint ? " — " + esc(hint) : ""}">
    <span class="hb-label">${esc(label)}</span><span class="hb-track"><span class="hb-bar" style="width:${(v / max) * 100}%;background:${v ? color : "transparent"}"></span><span class="hb-val">${v}</span></span></div>`).join("")}</div>`;
}
/** Barra empilhada (partes de um todo) + legenda com valores. segs: [{label, value, color}] */
function stackBar(segs) {
  const total = segs.reduce((a, s) => a + s.value, 0);
  const bar = total ? segs.filter((s) => s.value).map((s) => `<span class="sb-seg" style="flex:${s.value};background:${s.color}" title="${esc(s.label)}: ${s.value} (${Math.round((s.value / total) * 100)}%)"></span>`).join("")
    : `<span class="sb-seg" style="flex:1;background:#eee"></span>`;
  return `<div class="stackbar">${bar}</div><div class="legend">${segs.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.label)} <b>${s.value}</b>${total ? ` <span class="muted">(${Math.round((s.value / total) * 100)}%)</span>` : ""}</span>`).join("")}</div>`;
}
/** Medidor X de Y. */
function meter(done, total, label) {
  const pct = total ? Math.min(100, Math.round((done / total) * 100)) : 0;
  return `<div class="meter" title="${esc(label)}: ${done}/${total}"><div class="progress-bar"><span style="width:${pct}%;background:${pct >= 100 ? STATUS_COLORS.good : "var(--brand)"}"></span></div><b>${done}/${total}</b></div>`;
}
/** Colunas verticais (distribuição). */
function columns(rows) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return `<div class="cols">${rows.map(([label, v]) => `<div class="col" title="${esc(label)}: ${v}"><span class="col-val">${v}</span><span class="col-bar" style="height:${(v / max) * 100}%"></span><span class="col-label">${esc(label)}</span></div>`).join("")}</div>`;
}
/** Mapa de calor probabilidade (linhas) × impacto (colunas). */
function heatmap(matrix, rowLabels, colLabels) {
  const max = Math.max(1, ...matrix.flat());
  const step = (v) => (v === 0 ? 0 : Math.max(1, Math.round((v / max) * (HEAT.length - 1))));
  return `<table class="heat"><tr><th>${esc(t("Probabilidade"))} ↓ / ${esc(t("Impacto"))} →</th>${colLabels.map((c) => `<th>${esc(t(c))}</th>`).join("")}</tr>
    ${matrix.map((row, i) => `<tr><th>${esc(t(rowLabels[i]))}</th>${row.map((v, j) => `<td style="background:${HEAT[step(v)]};color:${step(v) >= 4 ? "#fff" : "#1a1a1a"}" title="${esc(t(rowLabels[i]))} × ${esc(t(colLabels[j]))}: ${v}">${v}</td>`).join("")}</tr>`).join("")}</table>`;
}
function insightsBox(kind, extra = {}) {
  const last = S.db.settings.last_insights?.[kind];
  return `<div class="card"><h2>${t("Análise da IA")}</h2>
    ${last ? `<div class="ai-box">${esc(last.text)}</div><p class="muted">${fmt(last.at)}</p>` : `<p class="muted">${t("Peça à IA para interpretar este dashboard: o que exige atenção e a ação recomendada.")}</p>`}
    <div class="actions"><button onclick='busy(this, async()=>{await api("insights","POST",${JSON.stringify({ kind, ...extra })}); await refresh();})'>${t("Analisar com IA")}</button></div></div>`;
}

  <div class="kpis">${statTile(d.total, t("Projetos ativos"), t("{n} concluídos", { n: d.done }))}${statTile(d.withLate, t("Com itens atrasados"))}${statTile(d.delayRisk, t("Risco de atraso"), "", "")}
    ${statTile(d.onTrack, t("No prazo"))}${statTile(d.avgPct == null ? "—" : d.avgPct + "%", t("Conclusão média"))}${statTile(d.stale, t("Sem atualização recente"))}${statTile(d.main, t("Projetos principais"))}</div>
  <div class="grid">
    <div class="card"><h2>${t("Situação dos projetos")}</h2>${stackBar([
      { label: t("No prazo"), value: d.onTrack, color: STATUS_COLORS.good },
      { label: t("Itens atrasados, sem risco"), value: lateOnly, color: STATUS_COLORS.warn },

      <p class="muted small">${t("DELAY_RISK_RULE")}</p></div>
    <div class="card"><h2>${t("Itens atrasados por tipo")}</h2>${hbars([[t("Itens do projeto"), d.lateBy.items], [t("Atividades (planilha)"), d.lateBy.acts], [t("Itens adicionais do projeto"), d.lateBy.adds]])}</div>
    <div class="card"><h2>${t("Distribuição da conclusão")}</h2>${columns(d.buckets.map(([l, v]) => [t(l), v]))}</div>

  <div class="grid" style="margin-top:var(--gap)">
    <div class="card" style="overflow:auto"><h2>${t("Projetos que exigem atenção")}</h2><table>${th(["ID", "Projeto", "Atrasados", "Atraso mais antigo", "% concluído", "Risco aberto ligado", "Situação"])}
      ${attention.map((r) => `<tr class="click" onclick="location.hash='projetos/${r.id}'"><td>${r.id}</td><td>${r.main ? "★ " : ""}${esc(r.name)}</td><td>${r.late}</td><td>${esc(r.oldest)}</td><td>${bar(r.pct)}</td>
        <td>${r.openRisk ? t("Sim") : t("Não")}</td><td>${r.delayRisk ? pill(t("Risco de atraso"), "p-Alta") : pill(t("Itens atrasados"), "p-Média")}</td></tr>`).join("") || `<tr><td colspan=7 class="muted">${t("Nenhum projeto com atraso.")}</td></tr>`}</table></div>
    ${insightsBox("projects")}

}

// ------------------------------------------------------------------ calendário de reuniões
let CAL_MONTH = null;
const WEEKDAYS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
function calendarView() {
  CAL_MONTH ||= S.today.slice(0, 7);
  const days = Core.monthDays(CAL_MONTH), lead = (Core.weekday(days[0]) + 6) % 7;
  const evs = S.db.meetings.filter((m) => (m.date || "").startsWith(CAL_MONTH)).sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
  const sugs = (S.db.meeting_suggestions || []).filter((x) => x.date.startsWith(CAL_MONTH));
  const [y, m] = CAL_MONTH.split("-").map(Number);
  const ml = new Date(y, m - 1, 1).toLocaleDateString(I18N.htmlLang(), { month: "long", year: "numeric" });
  const monthLabel = ml.charAt(0).toUpperCase() + ml.slice(1);
  const shift = (n) => { const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const cell = (date) => {
    const de = evs.filter((e) => e.date === date), ds = sugs.filter((x) => x.date === date);
    return `<div class="cal-day ${date === S.today ? "today" : ""} ${[0, 6].includes(Core.weekday(date)) ? "weekend" : ""}" onclick="if(event.target===this||event.target.classList.contains('cal-num'))quickMeeting('${date}')">
      <span class="cal-num">${+date.slice(8)}</span>
      ${de.map((e) => `<a class="cal-ev st-${e.status.replace(/\W/g, "")}" href="#reunioes/${e.id}" title="${esc(titleOf(e))} · ${esc(t(e.status))}">${esc(e.time || "")} ${esc(titleOf(e))}</a>`).join("")}
      ${ds.map((x) => `<span class="cal-ev sug" title="${esc(t(x.reason))}"><span class="sug-t">${esc(x.time)} ${esc(x.title)}</span>
        <button class="mini" title="${esc(t("Aceitar"))}" onclick="event.stopPropagation();busy(this, ()=>acceptSuggestions(['${x.id}']))">✓</button><button class="mini" title="${esc(t("Descartar"))}" onclick="event.stopPropagation();busy(this, ()=>discardSuggestion('${x.id}'))">×</button></span>`).join("")}
    </div>`;
  };
  return `<div class="toolbar"><button class="small ghost" onclick="CAL_MONTH='${shift(-1)}';render()">←</button><b class="cal-title">${esc(monthLabel)}</b>
      <button class="small ghost" onclick="CAL_MONTH='${shift(1)}';render()">→</button><button class="small ghost" onclick="CAL_MONTH=null;render()">${t("Hoje")}</button>
      <button class="small" onclick="busy(this, ()=>suggestMonth(CAL_MONTH))">${t("Sugerir datas das obrigatórias (IA)")}</button>

function meetingFields(pre = {}) {

async function suggestMonth(month) {

    <table>${th(["ID", "Reunião", "Frequência", "Dias preferidos", "Horário", "Duração", "Nível", "Mês atual", "Ativa", ""])}

      <td class="nowrap"><button class="small ghost" onclick="MAND_EDIT='${m.id}';render()">${t("Editar")}</button><button class="small ghost danger" onclick="if(confirm(t('Excluir este registro?')))api('mandatory/${m.id}','DELETE').then(refresh)">×</button></td></tr>`).join("")
      || `<tr><td colspan=10 class="muted">${t("Nenhuma reunião obrigatória cadastrada.")}</td></tr>`}</table></div>
  <div class="grid">

      <div>${L("Horário preferido")}<input type="time" id="mo-time" value="${esc(e.preferred_time || "")}"></div><div>${L("Duração (min)")}<input type="number" id="mo-dur" value="${esc(e.duration || 60)}"></div></div>
    ${L("Dias preferidos")}<div class="checks inline">${[1, 2, 3, 4, 5].map((d) => `<label><input type="checkbox" class="mo-day" value="${d}" ${(e.preferred_days || []).map(Number).includes(d) ? "checked" : ""}> ${t(dayNames[d])}</label>`).join("")}</div>
    <div class="row"><div>${L("Nível")}<select id="mo-level">${opts(LIST("meeting_levels"), e.level || "Gerencial")}</select></div><div>${L("Tipo")}<select id="mo-type">${opts(LIST("meeting_types"), e.mtype || "Reporte")}</select></div>

      <td class="nowrap"><button class="small" onclick="busy(this, ()=>acceptSuggestions(['${x.id}']))">✓</button><button class="small ghost danger" onclick="busy(this, ()=>discardSuggestion('${x.id}'))">×</button></td></tr>`).join("")}</table>
      <div class="actions"><button onclick="busy(this, ()=>acceptSuggestions(${JSON.stringify(sugs.map((x) => x.id)).replace(/"/g, "'")}))">${t("Aceitar todas as sugestões")}</button><a class="btn ghost" href="#reunioes/calendario">${t("Ver no calendário")}</a></div>` : ""}
  </div></div>`;
}
async function saveMandatory() {
  const title = $("#mo-title").value.trim();
  if (!title) throw new Error(t("Informe o título."));
  const data = { title, frequency: $("#mo-freq").value, times_per_month: +$("#mo-times").value || 1, preferred_time: $("#mo-time").value, duration: +$("#mo-dur").value || 60,

function teachBox(col, rec) {

async function saveTeach(col, id) {

  toast(t("Análise salva: a IA vai usar o seu raciocínio nas próximas avaliações."));

  await refresh();

<script>
/* Plataforma de Governança — interface (JS puro, sem build).
 * Textos de tela passam por t() (i18n.js). Valores guardados nos dados (status, prioridade, origem…)
 * ficam como códigos fixos em português e são traduzidos só na exibição, com tv(). */
let S = null; // estado vindo de Core.api("state")

const STATUS_ITEM = ["Aberto", "Em andamento", "Aguardando", "Concluído"];
const LEVELS = ["Alta", "Média", "Baixa"];
const PITEM_STATUS = ["Aberto", "Em andamento", "Finalizado"];
const MEETING_STATUS = ["Agendada", "Pendente", "Solicitada", "Realizada", "Não realizada", "Cancelada"];
const MODULES = ["painel", "entradas", "lista", "projetos", "reunioes", "riscos", "fluxos", "summaries"];
const SCENARIOS = { projects: ["se realizado", "se não realizado"], risks: ["se concretizar", "se tratado"] };
const ACT_FIELDS = { scope: "Scope", target: "Target", item: "Item", n: "Nº", subitem: "Subitem", last_progress: "Last Progress",
  owner: "Responsável", start: "Início", finish: "Término / prazo", progress: "% concluído" };

// ------------------------------------------------------------------ utilidades
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pill = (txt, cls = "") => (txt ? `<span class="pill ${esc(cls)}">${esc(txt)}</span>` : "");
const tv = (v) => (v ? t(v) : "");
const prio = (p) => pill(tv(p), "p-" + p);
const opts = (list, sel) => list.map((o) => `<option value="${esc(o)}" ${o === sel ? "selected" : ""}>${esc(t(o))}</option>`).join("");
/** Texto escrito pelo usuário no idioma da tela (tradução automática), ou o original. */
const lc = (rec, f) => (S?.db.settings.show_translated !== false ? Core.loc(rec, f) : rec?.[f] || "");
const msg = (r) => (r.msg ? t(r.msg[0], r.msg[1]) : lc(r, "text"));
const titleOf = (m) => (m.title_msg ? t(m.title_msg[0], m.title_msg[1]) : lc(m, "title"));
const byId = (col, id) => (S.db[col] || []).find((r) => r.id === id);
const defLabel = (d) => t(S.definitions[d] || d);
const fmt = (iso) => (iso ? iso.replace("T", " ").slice(0, 16) : "");
const th = (heads) => `<tr>${heads.map((h) => `<th>${h === "ID" ? "ID" : esc(t(h))}</th>`).join("")}</tr>`;
const L = (text) => `<label>${esc(t(text))}</label>`;
const LIST = (k) => S.db.settings.lists[k] || [];
const timeline = (list) => list.map((h) => `<li><span class="muted">${fmt(h.date || h.ts)}</span> ${esc(msg(h))}</li>`).join("") || '<li class="muted">—</li>';
const bar = (pct, label = "") => (pct == null ? `<span class="muted">—</span>`
  : `<div class="progress" title="${esc(label)}"><div class="progress-bar"><span style="width:${pct}%"></span></div><b>${pct}%</b></div>`);
const statusPill = (s) => pill(tv(s), { Realizada: "p-Baixa", "Não realizada": "p-Alta", Pendente: "p-Média", Solicitada: "p-Média", Agendada: "", Finalizado: "p-Baixa", Concluído: "p-Baixa", Concluída: "p-Baixa" }[s] || "");
const tabs = (base, list, cur) => `<div class="tabs">${list.map(([k, label]) => `<a href="#${base}/${k}" class="${k === cur ? "on" : ""}">${label}</a>`).join("")}</div>`;
const actStatus = (a) => ((+a.progress || 0) >= 100 ? "Concluída" : (+a.progress || 0) > 0 ? "Em andamento" : "Não iniciada");

const api = (path, method = "GET", body) => Core.api(path, method, body);
function toast(text) {
  const el = $("#toast"); el.textContent = text; el.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add("hidden"), 3500);
}
async function busy(btn, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = t("Processando…");
  try { await fn(); } catch (e) { toast(t("Erro: ") + t(e.message)); } finally { btn.disabled = false; btn.textContent = old; }
}
function openModal(html) { $("#modal-body").innerHTML = html; $("#modal").classList.remove("hidden"); }
function closeModal() { $("#modal").classList.add("hidden"); }
async function uploadFiles(path, input, extra = {}) {
  if (!input.files.length) throw new Error(t("Escolha um arquivo."));
  for (const f of input.files) await api(path, "POST", { file: f, ...extra });
}
/** Abre um arquivo da pasta local numa nova aba. */
async function openFile(rel) {
  const f = await Store.read(rel);
  if (!f) return toast(t("Arquivo não encontrado na pasta."));
  const type = rel.toLowerCase().endsWith(".html") ? "text/html" : f.type || "application/octet-stream";
  const url = URL.createObjectURL(new Blob([f], { type }));
  if (/\.(html|pdf|png|jpe?g|gif|txt|csv)$/i.test(rel)) window.open(url, "_blank");
  else download(url, f.name);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function download(url, name) { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function downloadText(text, name, type) { const url = URL.createObjectURL(new Blob([text], { type })); download(url, name); setTimeout(() => URL.revokeObjectURL(url), 60000); }
function fileLink(rel, label) { return `<a href="#" data-rel="${esc(rel)}" onclick="openFile(this.dataset.rel);return false">${esc(label)}</a>`; }
function exportCsv() { downloadText(Core.exportCsv(), `${t("lista_governanca")}_${S.today}.csv`, "text/csv;charset=utf-8"); }
function linksHtml(rec) {
  const names = { items: "Itens", projects: "Projetos", risks: "Riscos", meetings: "Reuniões", inputs: "Entradas", flows: "Fluxos" };
  const views = { items: "lista", projects: "projetos", risks: "riscos", meetings: "reunioes", inputs: "entradas", flows: "fluxos" };
  const parts = Object.entries(rec.links || {}).filter(([, v]) => v.length).map(([k, v]) =>
    `<b>${esc(t(names[k] || k))}:</b> ` + v.map((id) => `<a href="#${views[k]}/${id}" onclick="closeModal()">${esc(id)}</a>`).join(", "));
  return parts.join(" · ") || `<span class="muted">${t("sem vínculos")}</span>`;
}
function linkForm(col, id) {
  return `<div class="toolbar"><select id="lk-col"><option value="items">${t("Item")}</option><option value="projects">${t("Projeto")}</option><option value="risks">${t("Risco")}</option><option value="meetings">${t("Reunião")}</option></select>
    <input id="lk-id" placeholder="${esc(t("ID (ex.: GOV003)"))}"><button class="ghost small" onclick="addLink('${col}','${id}')">${t("Vincular")}</button></div>`;
}
async function addLink(col, id) {
  try { await api(`${col}/${id}/link`, "POST", { collection: $("#lk-col").value, id: $("#lk-id").value.trim().toUpperCase() }); toast(t("Vínculo criado")); await refresh(); }
  catch (e) { toast(t(e.message)); }
}
async function sub(col, id, list, entry, extra = {}) { await api(`${col}/${id}/sub`, "POST", { list, entry, ...extra }); await refresh(); }
async function subRemove(col, id, list, sid) { if (confirm(t("Excluir este registro?"))) { await api(`${col}/${id}/sub`, "POST", { list, remove: sid }); await refresh(); } }

// ------------------------------------------------------------------ traduções do conteúdo
const LANG_LABEL = { pt: "Português", en: "English", zh: "中文" };
function trButton(col, id) { return `<button class="small ghost tr-btn" title="${esc(t("Traduções"))}" onclick="event.stopPropagation();openTranslations('${col}','${id}')">🌐 ${t("Traduções")}</button>`; }
/** Mostra, abaixo de um campo editável, a tradução no idioma da tela (quando o original está em outro idioma). */
function trPreview(rec, f) {
  const v = rec?.[f], tr = rec?.tr?.[f];
  if (!v || !tr?.segments?.length) return "";
  const shown = Core.loc(rec, f);
  return shown && shown !== v ? `<div class="tr-preview"><b>${LANG_LABEL[I18N.lang]}:</b> ${esc(shown)}</div>` : "";
}
function trFieldsOf(col, rec) {
  const out = [];
  for (const f of TRANSLATABLE[col] || []) if (rec[f]) out.push([t(TR_LABEL[f] || f), rec, f]);
  for (const [list, fs] of Object.entries(SUB_TRANSLATABLE)) for (const e of rec[list] || []) {
    if (list === "history" && e.msg) continue;
    for (const f of fs) if (e[f]) out.push([`${t(TR_LABEL[list] || list)}${e.id ? " " + e.id : ""} · ${t(TR_LABEL[f] || f)}`, e, f]);
  }
  return out;
}
const TR_LABEL = { title: "Título", name: "Nome", description: "Descrição", background: "Background / contexto", scope: "Escopo", scope_action: "O que fazer", risk_reason: "Riscos / urgência",
  impact_details: "Impactos", gap_analysis: "Gaps", objective: "Objetivo", notes: "Notas / informações", impact_notes: "Como cada impacto se manifesta", agenda: "Pauta / objetivo", minutes: "Ata",
  progress_desc: "Descrição do progresso", text: "Texto", gap_reason: "Gap", pitems: "Itens do projeto", activities: "Atividades", scenarios: "Impactos e riscos", inputs_log: "Inputs do risco",
  actions: "Itens adicionais do projeto", history: "Histórico" };
function segsOf(rec, f) {
  const tr = rec.tr?.[f];
  return tr && tr.hash === strHash(rec[f]) ? tr.segments : null;
}
/** Texto no formato do relatório bilíngue: cada frase em inglês seguida da mesma frase em chinês. */
function bilingualText(fields, langs = ["en", "zh"]) {
  return fields.map(([label, rec, f]) => { const sg = segsOf(rec, f); return sg ? sg.map((x) => langs.map((l) => x[l]).join("\n")).join("\n") : rec[f]; }).join("\n\n");
}
function openTranslations(col, id) {
  const rec = Core.find(col, id);
  if (!rec) return;
  const fields = trFieldsOf(col, rec);

}

async function saveInput() {
  const data = readInputForm();
  if (!data.title) throw new Error(t("Informe o título."));
  // evita registrar a mesma demanda duas vezes
  const dupItems = Core.findDuplicates(data.title);
  const norm = (x) => AI.norm(x).replace(/\s+/g, " ").trim();
  const dupInputs = S.db.inputs.filter((i) => i.status !== "Registrado" && norm(i.title) === norm(data.title));
  if ((dupItems.length || dupInputs.length) && !confirm(t("DUP_CONFIRM", { ids: [...dupItems, ...dupInputs.map((i) => i.id)].join(", ") }))) return;
  const rec = await api("inputs", "POST", data);
  await api(`inputs/${rec.id}/suggest`, "POST");
  await refresh();
  location.hash = "entradas/" + rec.id;
}

/* Itens relacionados escolhidos na avaliação (busca em vez de listar a lista geral inteira). */
let TRI = { rel: new Set(), include: "" };
function itemMatches(q, limit = 8, exclude = []) {
  const n = AI.norm(q).trim();
  if (!n) return [];
  return S.db.items.filter((i) => !exclude.includes(i.id))
    .map((i) => [i.id.toLowerCase() === n || AI.norm(i.title).includes(n) || AI.norm(lc(i, "title")).includes(n) ? 2 : AI.similarity(q, AI.itemText(i)), i])
    .filter(([sc]) => sc > 0.15).sort((a, b) => b[0] - a[0]).slice(0, limit).map(([, i]) => i);
}
function triRelBox() {
  const chips = [...TRI.rel].filter((id) => id !== TRI.include).map((id) => { const i = byId("items", id); return `<span class="chip">${id} · ${esc(i ? lc(i, "title") : "")}<button class="mini" onclick="TRI.rel.delete('${id}');$('#t-rel-box').innerHTML=triRelBox()">×</button></span>`; }).join("");
  const inc = TRI.include ? byId("items", TRI.include) : null;
  return `<div class="chips">${inc ? `<span class="chip direct">${t("Relação direta")}: ${inc.id} · ${esc(lc(inc, "title"))}<button class="mini" onclick="TRI.include='';$('#t-mode').value='novo';$('#t-rel-box').innerHTML=triRelBox()">×</button></span>` : ""}
    ${chips || (inc ? "" : `<span class="muted">${t("Nenhum item vinculado.")}</span>`)}</div>`;
}
function triSearch(q) {
  const res = itemMatches(q, 8, [...TRI.rel, TRI.include]);
  $("#t-rel-results").innerHTML = res.map((i) => `<div class="search-row"><span>${i.id} · ${esc(lc(i, "title"))} <span class="muted">${esc(tv(i.status))}</span></span>
    <span class="nowrap"><button class="small ghost" onclick="TRI.rel.add('${i.id}');$('#t-rel-box').innerHTML=triRelBox();triSearch($('#t-rel-q').value)">${t("Vincular")}</button>
    <button class="small" onclick="TRI.include='${i.id}';$('#t-mode').value='incluir_existente';$('#t-rel-box').innerHTML=triRelBox();triSearch($('#t-rel-q').value)">${t("Relação direta")}</button></span></div>`).join("")
    || (q.trim() ? `<p class="muted">${t("Nenhum item encontrado.")}</p>` : "");
}

async function commitTriage(id) {
  const vals = (cls) => [...document.querySelectorAll("." + cls)].filter((c) => c.checked).map((c) => c.value);
  const definitions = vals("t-def");
  if (!definitions.length) throw new Error(t("Escolha ao menos uma definição."));
  const mode = $("#t-mode").value;
  const body = {
    relation_mode: mode, include_in: mode === "incluir_existente" ? TRI.include : "", related: [...TRI.rel].filter((x) => x !== TRI.include), definitions,
    project_id: $("#t-proj").value, new_project_name: $("#t-newproj").value,
    assessment: { scope: $("#t-scope").value, scope_action: $("#t-scope-act").value, priority: $("#t-prio").value, urgency: $("#t-urg").value,
      origin: $("#t-origin").value, risk_reason: $("#t-risk").value, impacts: vals("t-imp"), impact_details: $("#t-impd").value, gap_analysis: $("#t-gap").value },
  };
  if (mode === "incluir_existente" && !body.include_in) throw new Error(t("Selecione o item on going."));
  if (mode === "novo" && Core.findDuplicates(byId("inputs", id).title).length && !confirm(t("DUP_NEW_CONFIRM"))) return;
  const c = (await api(`inputs/${id}/commit`, "POST", body)).created;
  const teach = $("#t-teach").value.trim();
  if (teach) await api(`items/${c.item}/teach`, "POST", { analysis: teach, level: body.assessment.urgency, factors: body.assessment.impacts });

// ------------------------------------------------------------------ lista geral
let F = { q: "", status: "", prio: "", src: "", def: "", due: "", done: false, page: 0 };
const PAGE = 40;
const dueSoon = () => addDays(S.today, +S.db.settings.due_soon_days || 3);
const isOverdue = (i) => i.status !== "Concluído" && i.due_date && i.due_date < S.today;
const isDueSoon = (i) => i.status !== "Concluído" && i.due_date && i.due_date >= S.today && i.due_date <= dueSoon();
const lateActions = (i) => (i.item_actions || []).filter((a) => a.due && a.due < S.today && a.status !== "Concluída");
const lastProgress = (i) => (i.history || []).filter((h) => !h.msg && h.text).at(-1);
function dueCell(i) {
  if (isOverdue(i)) return pill(`⚠ ${i.due_date}`, "p-Alta") + `<br><small class="late-txt">${t("{n} dias de atraso", { n: daysSince(i.due_date) })}</small>`;
  if (isDueSoon(i)) return pill(i.due_date, "p-Média") + `<br><small class="muted">${t("vence em breve")}</small>`;
  return esc(i.due_date);
}
function filteredItems(extra = () => true) {
  const q = F.q.toLowerCase();
  return S.db.items.filter((i) => (F.done || F.status === "Concluído" || i.status !== "Concluído") && (!F.status || i.status === F.status) && (!F.prio || i.priority === F.prio)
    && (!F.src || i.source === F.src) && (!F.def || (i.definitions || []).includes(F.def))
    && (!F.due || (F.due === "vencidos" ? isOverdue(i) || lateActions(i).length : isDueSoon(i)))
    && (!q || (i.id + " " + JSON.stringify(i)).toLowerCase().includes(q) || lc(i, "title").toLowerCase().includes(q)) && extra(i)).reverse();
}
function listToolbar() {
  return `<div class="toolbar"><input placeholder="${esc(t("Buscar…"))}" value="${esc(F.q)}" onchange="F.q=this.value;F.page=0;render()">
    <select onchange="F.status=this.value;F.page=0;render()"><option value="">${t("Status")}</option>${opts(STATUS_ITEM, F.status)}</select>
    <select onchange="F.prio=this.value;F.page=0;render()"><option value="">${t("Prioridade")}</option>${opts(LEVELS, F.prio)}</select>
    <select onchange="F.src=this.value;F.page=0;render()"><option value="">${t("Origem")}</option>${opts(LIST("sources"), F.src)}</select>
    <select onchange="F.def=this.value;F.page=0;render()"><option value="">${t("Definição")}</option>${Object.entries(S.definitions).map(([k, v]) => `<option value="${k}" ${F.def === k ? "selected" : ""}>${esc(t(v))}</option>`).join("")}</select>
    <select onchange="F.due=this.value;F.page=0;render()"><option value="">${t("Prazo")}</option><option value="vencidos" ${F.due === "vencidos" ? "selected" : ""}>${t("Vencidos")}</option><option value="proximos" ${F.due === "proximos" ? "selected" : ""}>${t("Vencem em breve")}</option></select>
    <label class="inline-check"><input type="checkbox" ${F.done ? "checked" : ""} onchange="F.done=this.checked;F.page=0;render()"> ${t("Mostrar concluídos")}</label>
    <button class="ghost" onclick="exportCsv()">${t("Baixar planilha (CSV)")}</button></div>`;
}
/** Tabela paginada de itens (usada na lista geral e no painel por departamento). */
function itemsTable(all) {
  const pages = Math.max(1, Math.ceil(all.length / PAGE));
  F.page = Math.min(F.page, pages - 1);
  const rows = all.slice(F.page * PAGE, (F.page + 1) * PAGE);
  return `<div class="card" style="overflow:auto"><table>${th(["ID", "Item", "Departamento", "Responsável", "Prazo", "Prioridade", "Impactos", "Definição", "Último progresso", "Status"])}
  ${rows.map((i) => { const lp = lastProgress(i), la = lateActions(i); return `<tr class="click ${isOverdue(i) || la.length ? "overdue" : ""}" onclick="location.hash='lista/${i.id}'"><td>${i.id}</td><td>${esc(lc(i, "title"))}</td><td>${esc(deptOf(i) || "—")}</td><td>${esc(i.owner)}</td>
    <td>${dueCell(i)}${la.length ? `<br><small class="late-txt">${t("{n} ações vencidas", { n: la.length })}</small>` : ""}</td>
    <td>${prio(i.priority)}</td><td>${(i.impacts || []).map((x) => pill(t(x))).join("")}</td><td>${(i.definitions || []).map((d) => pill(defLabel(d))).join("")}</td>
    <td class="lp">${lp ? `<span class="muted">${esc((lp.date || "").slice(0, 10))}</span> ${esc(lc(lp, "text").slice(0, 120))}` : '<span class="muted">—</span>'}</td><td>${esc(tv(i.status))}</td></tr>`; }).join("") || `<tr><td colspan=10 class="muted">${t("Nenhum item.")}</td></tr>`}
  </table>
  <div class="pager"><span class="muted">${t("{n} itens", { n: all.length })}${!F.done ? " · " + t("concluídos ocultos") : ""}</span>
    ${pages > 1 ? `<button class="small ghost" ${F.page === 0 ? "disabled" : ""} onclick="F.page--;render()">←</button> ${F.page + 1} / ${pages} <button class="small ghost" ${F.page >= pages - 1 ? "disabled" : ""} onclick="F.page++;render()">→</button>` : ""}</div></div>`;
}
/* Departamento do item = "Área principal". Itens sem departamento ficam em "Geral". */
const deptOf = (i) => (i.area_main || "").trim();
const deptKey = (d) => AI.norm(d).replace(/\s+/g, " ").trim();
function departments() {
  const known = new Map((S.db.settings.areas || []).map((a) => [deptKey(a), a]));
  for (const i of S.db.items) { const d = deptOf(i); if (d && !known.has(deptKey(d))) known.set(deptKey(d), d); }
  return [...known.values()];
}
let DEP_SEL = null; // null = nenhum escolhido; "" = Geral (sem departamento)
function viewLista(id) {
  const T = [["", t("Lista geral")], ["departamentos", t("Por departamento")]];
  const tabsHtml = `<div class="tabs">${T.map(([k, l]) => `<a href="#lista${k ? "/" + k : ""}" class="${(id === "departamentos") === (k === "departamentos") ? "on" : ""}">${l}</a>`).join("")}</div>`;
  const nOver = S.db.items.filter((i) => isOverdue(i) || lateActions(i).length).length, nSoon = S.db.items.filter(isDueSoon).length;
  const banner = nOver || nSoon ? `<div class="alert lv-alta due-banner">⚠ ${t("{over} itens com prazo vencido e {soon} vencendo nos próximos dias.", { over: nOver, soon: nSoon })}
    <button class="small" onclick="F.due='vencidos';F.page=0;render()">${t("Ver vencidos")}</button> <button class="small ghost" onclick="F.due='proximos';F.page=0;render()">${t("Ver próximos")}</button></div>` : "";
  if (id === "departamentos") return `<h1>${t("Lista geral de governança")}</h1>${tabsHtml}${deptPanel()}`;
  return `<h1>${t("Lista geral de governança")}</h1>${tabsHtml}${banner}${listToolbar()}${itemsTable(filteredItems())}`;
}
function deptPanel() {
  const deps = departments();
  const inDep = (d) => (i) => (d === "" ? !deptOf(i) || !deps.some((x) => deptKey(x) === deptKey(deptOf(i))) : deptKey(deptOf(i)) === deptKey(d));
  const stats = (d) => { const its = S.db.items.filter(inDep(d)), open = its.filter((i) => i.status !== "Concluído");
    return { open: open.length, over: open.filter((i) => isOverdue(i) || lateActions(i).length).length, high: open.filter((i) => i.priority === "Alta").length, done: its.length - open.length }; };
  const tile = (d, label) => { const st = stats(d), on = DEP_SEL === d;
    return `<button class="dept-tile ${on ? "on" : ""} ${st.over ? "has-late" : ""}" onclick="DEP_SEL=${JSON.stringify(d).replace(/"/g, "'")};F.page=0;render()">
      <span class="dept-name">${esc(label)}</span><b>${st.open}</b><span class="dept-sub">${t("em aberto")}</span>
      <span class="dept-meta">${st.over ? `<span class="late-txt">⚠ ${t("{n} vencidos", { n: st.over })}</span>` : ""}${st.high ? ` · ${t("{n} alta prioridade", { n: st.high })}` : ""}${st.done ? ` · ${t("{n} concluídos", { n: st.done })}` : ""}</span></button>`; };
  const sel = DEP_SEL === null ? "" : `<h2 style="margin-top:var(--gap)">${esc(DEP_SEL === "" ? t("Geral (sem departamento)") : DEP_SEL)}</h2>${listToolbar()}${itemsTable(filteredItems(inDep(DEP_SEL)))}`;
  return `<p class="muted">${t("DEPT_HELP")}</p>
    <div class="dept-grid">${deps.map((d) => tile(d, d)).join("")}${tile("", t("Geral (sem departamento)"))}</div>
    ${DEP_SEL === null ? `<p class="muted" style="margin-top:var(--gap)">${t("Clique em um departamento para ver os itens.")}</p>` : sel}`;
}

/* Após salvar, o próprio render() reabre o item quando o endereço é lista/ID — não reabrir de novo aqui

function reopenItem() {}
async function saveItem(id) {
  await api("items/" + id, "PATCH", { status: $("#i-status").value, owner: $("#i-owner").value, due_date: $("#i-due").value, priority: $("#i-prio").value, report: $("#i-report").checked, area_main: $("#i-dept").value.trim() });

}
async function addProgress(id) {

  await api(`items/${id}/progress`, "POST", { text, action_id: $("#i-note-act").value });

}
async function addItemAction(id) {
  const text = $("#ia-new-t").value.trim();

  await api(`items/${id}/sub`, "POST", { list: "item_actions", entry: { text, owner: $("#ia-new-w").value, due: $("#ia-new-d").value, status: "Aberta", progress: "" } });
  await refresh(); reopenItem(id);
}
async function saveItemAction(id, aid) {
  const g = (k) => $(`#ia-${k}-${aid}`).value;
  const old = byId("items", id).item_actions.find((a) => a.id === aid);
  await api(`items/${id}/sub`, "POST", { list: "item_actions", entry: { id: aid, text: g("t"), owner: g("w"), due: g("d"), status: g("s"), progress: g("p") } });
  if (g("p").trim() && g("p") !== old.progress) await api(`items/${id}/progress`, "POST", { text: `${aid}: ${g("p")}`, action_id: aid });
  toast(t("Item atualizado")); await refresh(); reopenItem(id);
}
async function mergeItem(from, into) {
  if (!into) throw new Error(t("Informe o ID do item."));
  if (!confirm(t("Mesclar {from} em {into}? {from} será removido.", { from, into }))) return;
  await api(`items/${from}/merge`, "POST", { into });
  toast(t("{from} mesclado em {into}", { from, into }));
  closeModal(); location.hash = "lista/" + into; await refresh();
}

  const preview = rows.slice(hr + 1, hr + 8);

async function demandToInput(mid, k) {

  if ((id || "dash") === "dash") return head + dashRisksView();
  return `${head}
  <div class="grid" style="grid-template-columns: minmax(300px,2fr) minmax(260px,1fr)">
  <div class="card" style="overflow:auto"><table>${th(["ID", "Risco", "Modo", "Prob.", "Impacto", "Principais impactos", "Inputs", "Responsável", "Status"])}
  ${S.db.risks.map((r) => `<tr class="click" onclick="location.hash='riscos/${r.id}'"><td>${r.id}</td><td>${esc(lc(r, "title"))}</td><td>${esc(tv(r.mode))}</td><td>${prio(r.probability)}</td><td>${pill(tv(r.impact), "p-" + r.impact)}</td>
    <td>${(r.impacts || []).map((x) => pill(t(x))).join("")}</td><td>${(r.inputs_log || []).length}</td><td>${esc(r.owner)}</td><td>${esc(tv(r.status))}</td></tr>`).join("") || `<tr><td colspan=9 class="muted">${t("Nenhum risco.")}</td></tr>`}
  </table></div>
  <div class="card"><h2>${t("Novo risco")}</h2><p class="muted">${t("Normalmente nasce pela definição de uma entrada; aqui é o cadastro direto.")}</p>${L("Título")}<input id="r-title">${L("Descrição")}<textarea id="r-desc"></textarea>
    <div class="row"><div>${L("Modo")}<select id="r-mode">${opts(["Monitorar", "Investigar"])}</select></div><div>${L("Responsável")}<input id="r-owner"></div></div>
    ${L("Principais impactos")}<div class="checks inline">${LIST("impact_types").map((x) => `<label><input type="checkbox" class="r-imp" value="${esc(x)}"> ${esc(t(x))}</label>`).join("")}</div>
    <div class="actions"><button onclick="busy(this, async()=>{const r=await api('risks','POST',{title:$('#r-title').value,description:$('#r-desc').value,mode:$('#r-mode').value,owner:$('#r-owner').value,impacts:[...document.querySelectorAll('.r-imp')].filter(c=>c.checked).map(c=>c.value)}); await refresh(); location.hash='riscos/'+r.id;})">${t("Criar risco e pasta")}</button></div></div></div>`;

function riskDetail(r, tab) {

    <div class="actions"><button onclick="busy(this, ()=>newFlow('data'))">${t("Criar pelos dados")}</button><button class="ghost" onclick="busy(this, ()=>newFlow('ai'))">${t("Criar com IA")}</button><button class="ghost" onclick="busy(this, ()=>newFlow('blank'))">${t("Em branco")}</button></div></div></div>`;

async function newFlow(mode) {
  const [scope_col, scope_id] = $("#fw-scope").value.split(":");
  const f = await api("flows", "POST", { title: $("#fw-title").value || t("Fluxo"), scope_col, scope_id, description: $("#fw-desc").value, nodes: [], edges: [] });
  if (mode !== "blank") await api(`flows/${f.id}/generate`, "POST", { mode, description: $("#fw-desc").value });
  await refresh(); location.hash = "fluxos/" + f.id;
}
