<!doctype html>
<!-- Arquivo gerado por tools/build-custos.mjs a partir de custos-aduaneiros/src/. Edite os arquivos em src/. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custos Aduaneiros</title>
<style>
/* Visual no padrão GWM (como a plataforma de governança): fundo claro, títulos vermelhos. */
:root {
  color-scheme: light;
  --brand: #C00000; --soft: #fbeeee;
  --bg: #f1f1f2; --panel: #ffffff; --ink: #1a1a1a; --ink-2: #52514e; --muted: #6a6d72; --line: #dedfe2; --grid: #ececee;
  /* séries (paleta categórica validada, 3 primeiros slots) */
  --s-regular: #2a78d6; --s-storage: #eb6834; --s-customs: #1baf7a;
  /* canais aduaneiros (sempre com o nome escrito ao lado) */
  --ch-verde: #1f6b34; --ch-verde-bg: #e3f3e6; --ch-amarelo: #7a5600; --ch-amarelo-bg: #fff1d6;
  --ch-vermelho: #b00000; --ch-vermelho-bg: #fde4e4; --ch-cinza: #4c4f55; --ch-cinza-bg: #e9eaec;
  --warn: #8a5a00; --warn-bg: #fff1d6; --ok: #1f6b34; --ok-bg: #e3f3e6;
}
* { box-sizing: border-box; }
html { font-size: 14px; }
body { margin: 0; font: 1rem/1.45 "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--bg); min-height: 100vh; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; }

/* menu vertical à esquerda */
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
.side { background: #fff; border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.side::before { content: ""; display: block; height: 5px; margin: -16px -12px 4px; background: linear-gradient(90deg, var(--brand) 0%, #e07070 60%, rgba(255,255,255,0) 100%); }
.brand { font-weight: 800; font-size: 1.2rem; color: var(--brand); line-height: 1.2; }
.brand small { display: block; color: var(--muted); font-weight: 600; font-size: .75rem; margin-top: 3px; }
.lang { width: 100%; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a { color: var(--ink); text-decoration: none; padding: 8px 10px; font-weight: 600; border-radius: 4px; display: flex; gap: 10px; align-items: center; border-left: 3px solid transparent; }
.side nav a .ic { width: 18px; text-align: center; color: var(--muted); }
.side nav a:hover { color: var(--brand); background: var(--soft); }
.side nav a.active { color: var(--brand); background: var(--soft); border-left-color: var(--brand); }
.side nav a.active .ic { color: var(--brand); }
.side .store-badge { margin-top: auto; text-align: center; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side nav { display: grid; grid-template-columns: 1fr 1fr; }
}
.store-badge { font-size: .8rem; padding: 3px 9px; border-radius: 999px; background: #eee; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store-badge.on { background: var(--ok-bg); color: var(--ok); }

main { max-width: 1400px; width: 100%; padding: 20px 22px 60px; min-width: 0; }
h1 { font-size: 1.6rem; margin: 4px 0 12px; color: var(--brand); font-weight: 800; }
h2 { font-size: 1.08rem; margin: 0 0 10px; font-weight: 700; padding-left: 9px; border-left: 4px solid var(--brand); }
h3 { font-size: .95rem; margin: 14px 0 6px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.lead { font-size: 1.05rem; background: #fff; border-left: 4px solid var(--brand); padding: 12px 16px; margin: 0 0 16px; border-radius: 4px; }
.lead b { color: var(--brand); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; text-decoration: none; color: inherit; display: block; position: relative; }
a.tile:hover { border-color: var(--brand); }
.tile .k { font-size: .8rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 1.45rem; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: .8rem; color: var(--ink-2); margin-top: 2px; }
.key { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.tile.hero { border-left: 4px solid var(--brand); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: .78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; background: #fafafa; position: sticky; top: 0; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--soft); }
tr.sub td { background: #fafafa; font-size: .88rem; }
tfoot td { font-weight: 700; border-top: 2px solid var(--line); }

/* badges */
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.ch-Verde { color: var(--ch-verde); background: var(--ch-verde-bg); }
.ch-Amarelo { color: var(--ch-amarelo); background: var(--ch-amarelo-bg); }
.ch-Vermelho { color: var(--ch-vermelho); background: var(--ch-vermelho-bg); }
.ch-Cinza { color: var(--ch-cinza); background: var(--ch-cinza-bg); }
.b-ok { color: var(--ok); background: var(--ok-bg); }
.b-warn { color: var(--warn); background: var(--warn-bg); }
.b-none { color: var(--muted); background: #eee; }
.kpi-tag { font-size: .72rem; color: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; white-space: nowrap; }

/* buttons & forms */
.btn { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-weight: 600; color: var(--ink); text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.1); color: #fff; }
.btn.danger { color: var(--brand); }
.btn.sm { padding: 3px 8px; font-size: .85rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
input, select, textarea { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: #fff; color: var(--ink); max-width: 100%; }
textarea { width: 100%; min-height: 64px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: .82rem; color: var(--muted); font-weight: 600; }
label.f input, label.f select, label.f textarea { color: var(--ink); font-weight: 400; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 12px; }
.form .wide { grid-column: 1 / -1; }

/* charts */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 150px) 1fr minmax(90px, auto); gap: 4px 10px; align-items: center; }
.hbar .lab { font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .lab a { text-decoration: none; font-weight: 600; }
.hbar .val { font-size: .85rem; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { display: flex; gap: 2px; height: 18px; position: relative; }
.track .seg { height: 100%; min-width: 2px; cursor: pointer; }
.track .seg:last-child { border-radius: 0 4px 4px 0; }
.track .seg:hover { filter: brightness(1.12); }
.track.ref::after { content: ""; position: absolute; top: -3px; bottom: -3px; left: var(--ref); border-left: 2px dashed var(--ink-2); }
.axis-note { font-size: .78rem; color: var(--muted); margin-top: 6px; }
.compbar { display: flex; gap: 2px; height: 26px; margin: 8px 0 4px; }
.compbar .seg:first-child { border-radius: 4px 0 0 4px; }
.compbar .seg:last-child { border-radius: 0 4px 4px 0; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: #1a1a1a; color: #fff; padding: 6px 9px; border-radius: 4px; font-size: .82rem; line-height: 1.35; max-width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#tip.hidden { display: none; }

/* timeline */
.timeline { display: flex; flex-wrap: wrap; gap: 0; margin: 6px 0; }
.tl { position: relative; padding: 0 14px 0 0; min-width: 120px; }
.tl .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--brand); }
.tl .dot.off { background: #fff; }
.tl .line { position: absolute; top: 5px; left: 14px; right: 0; height: 2px; background: var(--line); }
.tl .d { font-weight: 700; font-size: .88rem; margin-top: 4px; }
.tl .t { font-size: .8rem; color: var(--muted); }

.drop { border: 2px dashed var(--line); border-radius: 8px; padding: 30px; text-align: center; background: #fff; cursor: pointer; }
.drop.over { border-color: var(--brand); background: var(--soft); }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 8px 12px; margin: 6px 0; font-size: .9rem; }
.okbox { background: var(--ok-bg); color: var(--ok); border-radius: 4px; padding: 8px 12px; margin: 6px 0; font-size: .9rem; }
.empty { text-align: center; padding: 40px 20px; }
.obs { white-space: pre-wrap; font-size: .8rem; color: var(--ink-2); max-height: 160px; overflow: auto; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; z-index: 30; padding: 40px 12px; overflow: auto; }
.modal.hidden { display: none; }
.modal-box { background: #fff; border-radius: 8px; padding: 20px; width: min(860px, 100%); position: relative; }
.modal .close { position: absolute; right: 10px; top: 6px; border: 0; background: none; font-size: 1.6rem; cursor: pointer; color: var(--muted); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 9px 16px; border-radius: 6px; z-index: 60; }
.toast.hidden { display: none; }
@media (max-width: 640px) { main { padding: 14px 12px 40px; } .hbar { grid-template-columns: 80px 1fr; } .hbar .val { grid-column: 2; text-align: left; } }

.grid3c { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid3c { grid-template-columns: 1fr; } }
.tile.kpi { border-top: 3px solid var(--ok); }
.checklist { list-style: none; padding: 0; margin: 8px 0; }
.checklist li { padding: 4px 0; border-bottom: 1px solid var(--grid); }
.checklist li.ok { color: var(--ok); }
.checklist li.no { color: var(--ink-2); }

/* fluxo da estrutura de custos */
.flow-wrap { overflow-x: auto; padding-bottom: 6px; }
.flow { display: grid; grid-template-columns: repeat(9, minmax(112px, 1fr)); gap: 8px 10px; min-width: 1090px; align-items: start; }
.kpibar { border: 2px solid var(--c); border-bottom: 0; color: var(--c); font-weight: 700; font-size: .8rem; text-align: center; padding: 2px 6px 6px; border-radius: 6px 6px 0 0; background: color-mix(in srgb, var(--c) 7%, #fff); }
.step { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px; text-align: center; position: relative; min-height: 74px; }
.step:not(.last)::after { content: "→"; position: absolute; right: -13px; top: 26px; color: var(--muted); font-weight: 700; }
.step .num { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; font-size: .82rem; }
.step .sname { font-weight: 700; font-size: .86rem; margin-top: 4px; line-height: 1.2; }
.costs { display: flex; flex-direction: column; gap: 6px; }
.cost { text-align: left; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 4px; padding: 6px 8px; cursor: pointer; font-size: .8rem; line-height: 1.25; color: var(--ink); }
.cost:hover, .cost.sel { box-shadow: 0 0 0 2px var(--c); }
.cost.trigger { border-style: dashed; border-left-style: solid; color: var(--ink-2); }
.kpi-mini { display: inline-block; margin-left: 4px; font-size: .68rem; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
.anom { text-align: left; background: #fff6f6; border: 1px dashed #e7a3a3; border-radius: 4px; padding: 5px 8px; cursor: pointer; font-size: .76rem; color: #8b1a1a; display: flex; gap: 6px; align-items: flex-start; line-height: 1.25; }
.anom:hover, .anom.sel { box-shadow: 0 0 0 2px var(--brand); }
.anom-dot { flex: none; width: 15px; height: 15px; border-radius: 50%; background: var(--brand); color: #fff; font-size: .7rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; margin-right: 4px; }
.cost-panel { border-left: 5px solid var(--c); }
.anom-panel { border-left: 5px solid var(--brand); }
#flow-detail { margin-top: 16px; }

/* raias do fluxo de pagamento */
.swim { display: grid; position: relative; min-width: 1150px; grid-auto-rows: minmax(78px, auto); }
.lane-name { grid-column: 1; font-weight: 700; font-size: .82rem; padding: 8px; background: #fafafa; border-bottom: 1px solid var(--line); display: flex; align-items: center; color: var(--ink-2); }
.lane-cell { border-bottom: 1px solid var(--line); }
.pnode { margin: 8px 6px; z-index: 1; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: .78rem; text-align: left; cursor: pointer; line-height: 1.25; align-self: center; position: relative; color: var(--ink); }
.pnode .pn { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; background: var(--ink-2); color: #fff; font-size: .7rem; font-weight: 800; align-items: center; justify-content: center; margin-right: 5px; }
.pnode.sel { box-shadow: 0 0 0 2px var(--brand); }
.pnode.risk { border: 2px solid var(--brand); background: #fff3f3; }
.pnode.risk .pn { background: var(--brand); }
.pnode.counter { border: 2px solid var(--ok); background: var(--ok-bg); }
.pnode.counter .pn { background: var(--ok); }
.pnode .tag { display: block; font-size: .68rem; font-weight: 800; margin-top: 3px; }
.pnode.risk .tag { color: var(--brand); }
.pnode.counter .tag { color: var(--ok); }
.swim-svg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
.swim-svg path { fill: none; stroke: #9a9da3; stroke-width: 1.6; }
.swim-svg polygon { fill: #9a9da3; }
.pdetail { margin-top: 14px; border: 1px solid var(--line); border-left: 5px solid var(--ink-2); border-radius: 6px; padding: 12px 14px; background: #fff; }
.pdetail.risk { border-left-color: var(--brand); }
.pdetail.counter { border-left-color: var(--ok); }
.pdetail h3 { margin-top: 0; }
tr.risk-row td { background: #fff3f3; }
tr.counter-row td { background: var(--ok-bg); }
.hidden { display: none !important; }
.pnode .tag { overflow-wrap: anywhere; }
</style>
</head>

<div class="layout">
  <aside id="side" class="side"></aside>
  <main id="view"><p class="muted">Carregando…</p></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modal-body"></div></div></div>
<div id="toast" class="toast hidden"></div>
<div id="tip" class="hidden"></div>
<script>
/* Idiomas: português (pt), inglês (en) e chinês simplificado (zh).
 * t("texto em português", {variáveis}) devolve a tradução do idioma escolhido (dicionário em dict.js). */
let LANG = (() => { try { return localStorage.getItem("custos-lang") || "pt"; } catch { return "pt"; } })();
const LOCALE = { pt: "pt-BR", en: "en-US", zh: "zh-CN" };

function t(s, vars) {
  let out = LANG === "pt" ? s : (typeof DICT !== "undefined" && DICT[s] && DICT[s][LANG]) || s;
  if (vars) out = out.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ""));
  return out;
}
/** Conteúdo com as três versões {pt, en, zh}. */
const tx = (o) => (o && typeof o === "object" ? o[LANG] || o.pt : o ?? "");

function setLang(l) {
  LANG = l;
  try { localStorage.setItem("custos-lang", l); } catch { /* sem armazenamento */ }
  document.documentElement.lang = LOCALE[l];
  if (typeof renderShell === "function") renderShell();
  if (typeof route === "function") route();
}
</script>

  ["Há <b>{p}</b> com demonstrativo da Santos Brasil, somando <b>{c}</b> e <b>{v}</b> em custos de terminal.", "There are <b>{p}</b> with a Santos Brasil statement, totaling <b>{c}</b> and <b>{v}</b> in terminal costs.", "共有 <b>{p}</b> 已有 Santos Brasil 明细，合计 <b>{c}</b>，码头费用 <b>{v}</b>。"],

  ["Custos regulares", "Regular costs", "常规费用"],
  ["{v} por contêiner · meta {m}", "{v} per container · target {m}", "每箱 {v} · 目标 {m}"],
  ["Custos extras", "Extra costs", "额外费用"],

<script>
/* Leitor de .xlsx com TODAS as abas (sem bibliotecas externas).
 * Retorna { sheets: [{ name, grid, merges }] } onde grid[linha][coluna] = valor (string | number).
 * Datas do Excel viram "AAAA-MM-DD". Baseado em src/xlsx.js da plataforma de governança. */
const Book = {
  async unzip(buf) {
    const dv = new DataView(buf), dec = new TextDecoder();
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("Arquivo .xlsx inválido");
    const count = dv.getUint16(e + 10, true);
    let off = dv.getUint32(e + 16, true);
    const files = {};
    for (let i = 0; i < count; i++) {
      const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
      const nl = dv.getUint16(off + 28, true), xl = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
      const local = dv.getUint32(off + 42, true);
      files[dec.decode(new Uint8Array(buf, off + 46, nl))] = { method, csize, local };
      off += 46 + nl + xl + cl;
    }
    return async (name) => {
      const f = files[name];
      if (!f) return null;
      const start = f.local + 30 + dv.getUint16(f.local + 26, true) + dv.getUint16(f.local + 28, true);
      const data = new Uint8Array(buf, start, f.csize);
      if (f.method === 0) return dec.decode(data);
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    };
  },

  async read(file, opts = {}) {
    const ext = file.name.toLowerCase().split(".").pop();
    if (ext === "csv" || ext === "txt") return { sheets: [{ name: file.name, grid: this.parseCsv((await file.text()).replace(/^﻿/, "")), merges: [] }] };
    const get = await this.unzip(await file.arrayBuffer());
    const xml = (s) => (s ? new DOMParser().parseFromString(s, "application/xml") : null);
    const byTag = (doc, tag) => (doc ? [...doc.getElementsByTagNameNS("*", tag)] : []);
    const wb = xml(await get("xl/workbook.xml")), rels = xml(await get("xl/_rels/workbook.xml.rels"));
    const shared = byTag(xml(await get("xl/sharedStrings.xml")), "si").map((si) => byTag(si, "t").map((t) => t.textContent).join(""));
    const styles = xml(await get("xl/styles.xml"));
    const customDate = new Set(byTag(styles, "numFmt").filter((n) => /[dmy]/i.test((n.getAttribute("formatCode") || "").replace(/"[^"]*"|\[[^\]]*\]/g, ""))).map((n) => +n.getAttribute("numFmtId")));
    const xfs = (() => { const cx = byTag(styles, "cellXfs")[0]; return cx ? byTag(cx, "xf").map((x) => +x.getAttribute("numFmtId")) : []; })();
    const isDateFmt = (id) => (id >= 14 && id <= 22) || (id >= 45 && id <= 47) || customDate.has(id);
    const serialToDate = (n) => new Date(Date.UTC(1899, 11, 30) + Math.round(n * 864e5)).toISOString().slice(0, 10);
    const colIdx = (ref) => { let n = 0; for (const ch of ref.replace(/\d+/g, "")) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const rowIdx = (ref) => +ref.replace(/[A-Z]+/g, "") - 1;

    const out = [];
    for (const s of byTag(wb, "sheet")) {
      const name = s.getAttribute("name") || "";
      if (opts.only && !opts.only(name)) continue;
      const rid = s.getAttribute("r:id") || s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      const rel = byTag(rels, "Relationship").find((r) => r.getAttribute("Id") === rid);
      if (!rel) continue;
      const t = rel.getAttribute("Target");
      const path = t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, "");
      const text = await get(path);
      if (!text) continue;
      const grid = [];
      // leitura por expressão regular (rápida, aguenta abas de dezenas de MB)
      const unx = (x) => x.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n)).replace(/&amp;/g, "&");
      const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
      const attr = (a, k) => { const m = a.match(new RegExp("\\b" + k + '="([^"]*)"')); return m ? m[1] : null; };
      let m, maxRow = opts.maxRows || Infinity;
      while ((m = cellRe.exec(text))) {
        const a = m[1], inner = m[2] || "";
        const ref = attr(a, "r"); if (!ref) continue;
        const ri = rowIdx(ref); if (ri >= maxRow) break;
        const ty = attr(a, "t"), st = +(attr(a, "s") || 0);
        const vm = inner.match(/<v>([\s\S]*?)<\/v>/);
        const v = vm ? unx(vm[1]) : "";
        let val = v;
        if (ty === "s") val = shared[+v] ?? "";
        else if (ty === "inlineStr") val = unx((inner.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || []).map((x) => x.replace(/<[^>]+>/g, "")).join(""));
        else if (ty === "str" || ty === "e") val = v;
        else if (ty === "b") val = v === "1" ? "TRUE" : "FALSE";
        else if (v !== "" && isDateFmt(xfs[st] ?? 0)) val = serialToDate(+v);
        else if (v !== "" && !isNaN(+v)) val = +v;
        if (val !== "") (grid[ri] ??= [])[colIdx(ref)] = val;
      }
      const merges = [...text.matchAll(/<mergeCell ref="([A-Z]+\d+):([A-Z]+\d+)"/g)].map((mm) => ({ r0: rowIdx(mm[1]), c0: colIdx(mm[1]), r1: rowIdx(mm[2]), c1: colIdx(mm[2]) }));
      out.push({ name: name || path, grid, merges });
    }
    return { sheets: out };
  },

  /** Cópia da grade com o valor de cada célula mesclada repetido no intervalo todo. */
  filled(sheet) {
    const g = sheet.grid.map((r) => (r ? [...r] : []));
    for (const m of sheet.merges) {
      const val = g[m.r0]?.[m.c0];
      if (val === undefined) continue;
      for (let r = m.r0; r <= m.r1; r++) for (let c = m.c0; c <= m.c1; c++) if (r !== m.r0 || c !== m.c0) (g[r] ??= [])[c] = val;
    }
    return g;
  },

  parseCsv(text) {
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [";", "\t", ","].sort((a, b) => first.split(b).length - first.split(a).length)[0];
    const rows = [];
    let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = ""; rows.push(row); row = [];
      } else cell += ch;
    }
    row.push(cell); rows.push(row);
    return rows;
  },
};

<script>
/* Leitura das planilhas de origem:
 *  1) Demonstrativo de cálculo da Santos Brasil (por processo IRAxxxx-xx): contêineres, serviços, valores, períodos.
 *  2) Planilha "Red Channel Status" (controle manual do desembaraço): canal, exigências, status e próximos passos.
 * As funções trabalham com grades (arrays de linhas), produzidas por Book.read(). */

const norm = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u00a0/g, " ").toUpperCase().replace(/\s+/g, " ").trim();

/** "1.770,00" / "2064,14" / 2064.14 -> número */
function num(v) {
  if (typeof v === "number") return v;
  const s = String(v ?? "").replace(/[R$\s\u00a0]/g, "");
  if (!s) return NaN;
  if (/,\d{1,2}$/.test(s)) return +s.replace(/\./g, "").replace(",", ".");
  return +s.replace(/,/g, "");
}

/** "12/11/2026", "2026-11-12", "12/11" (+ano de referência) -> "2026-11-12" */
function toISO(v, refYear) {
  if (v === undefined || v === null || v === "") return "";
  if (typeof v === "number") return v > 20000 && v < 80000 ? new Date(Date.UTC(1899, 11, 30) + v * 864e5).toISOString().slice(0, 10) : "";
  const s = String(v).replace(/\u00a0/g, " ").trim();
  let m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
  m = s.match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
  if (m && refYear) return `${refYear}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return "";
}

/** Número do processo aduaneiro: "IRA2419-26", "IRA 1818/26", "ira2419_26" -> "IRA2419/26" */
function procId(s) {
  const m = String(s ?? "").toUpperCase().match(/IRA\s*[-_]?\s*(\d{3,5})\s*[-\/_ ]\s*(\d{2})(?!\d)/);
  return m ? `IRA${m[1]}/${m[2]}` : "";
}
const procKey = (id) => String(id).replace(/\//g, "-");

/* ------------------------------------------------------------------ classificação dos serviços */

/** Grupos de custo. Regular = custo esperado de todo processo; extras = o que deve ser explicado. */
const GROUPS = {
  regular: { label: "Regular", kpi: "", color: "var(--s-regular)" },
  extra_storage: { label: "Extra · armazenagem além do período livre", short: "Extra armazenagem", kpi: "KPI 1 · Storage", color: "var(--s-storage)" },
  extra_customs: { label: "Extra · inspeção e desembaraço", short: "Extra desembaraço", kpi: "KPI 3 · Customs costs", color: "var(--s-customs)" },
};

/** Regras padrão (a primeira que casar vale). Editáveis em Configurações.
 *  Seguem a planilha de breakdown manual: regular = armazenagem 1º período + escaneamento + carregamento + processamento. */
const DEFAULT_RULES = [
  { match: "ARMAZENAGEM", label: "Armazenagem", group: "storage" },
  { match: "INSPECAO NAO INVASIVA", label: "Escaneamento (inspeção não invasiva)", group: "regular" },
  { match: "CARREGAMENTO", label: "Carregamento (retirada)", group: "regular" },
  { match: "PROCESSAMENTO ELETRONICO", label: "Processamento eletrônico", group: "regular" },
  { match: "POSICIONAMENTO", label: "Posicionamento de contêiner", group: "extra_customs" },
  { match: "COLOCACAO DE LACRE", label: "Colocação de lacre", group: "extra_customs" },
  { match: "RETIRADA DE LACRE", label: "Retirada de lacre", group: "extra_customs" },
  { match: "DESCONSOLIDACAO|DESUNITIZACAO|DESOVA", label: "Desova (desconsolidação)", group: "extra_customs" },
  { match: "CONSOLIDACAO|UNITIZACAO|OVA ", label: "Ova (consolidação)", group: "extra_customs" },
  { match: "EXAME|LAUDO|AMOSTRA", label: "Exames e laudos", group: "extra_customs" },
  { match: "MOVIMENTACAO", label: "Movimentações adicionais", group: "extra_customs" },
];

function classify(name, rules) {
  const n = norm(name);
  for (const r of rules) {
    let re;
    try { re = new RegExp(norm(r.match).split("|").map((x) => x.replace(/[.*+?^${}()[\]\\]/g, "\\$&")).join("|")); } catch { continue; }
    if (re.test(n)) return r;
  }
  return { match: "", label: String(name).replace(/\s*-\s*IMPORTA[CÇ][AÃ]O\s*$/i, "").trim() || "Outro serviço", group: "extra_customs", unknown: true };
}

/** Divide a armazenagem pelos períodos descritos na OBS ("HOUSE 1º Período (15 dias) ... R$=2064,14 de :08/08/2026 a 22/08/2026"). */
function storagePeriods(obs) {
  const out = [];
  const re = /(\d+)\s*[º°o]?\s*Per[ií]odo\s*\((\d+)\s*dias?\)[^\n]*?R\$\s*=\s*([\d.,]+)(?:[^\n]*?de\s*:?\s*(\d{2}\/\d{2}\/\d{4})\s*a\s*(\d{2}\/\d{2}\/\d{4}))?/gi;
  let m;
  while ((m = re.exec(obs))) out.push({ n: +m[1], days: +m[2], value: num(m[3]), from: toISO(m[4]), to: toISO(m[5]) });
  return out;
}

/* ------------------------------------------------------------------ Santos Brasil */

const SB = {
  /** Aba com o demonstrativo: a que tiver mais rótulos "Contêiner:" + "Serviço:"; prefere "Santos Brasil Details". */
  pickSheet(book) {
    const score = (sh) => {
      let s = 0;
      for (const r of sh.grid) for (const c of r || []) { const n = norm(c); if (n === "CONTEINER:" || n === "SERVICO:") s++; }
      return s + (/santos/i.test(sh.name) ? 1000 : 0) * (s > 0 ? 1 : 0);
    };
    return [...book.sheets].map((sh) => ({ sh, s: score(sh) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s)[0]?.sh || null;
  },

  parse(book, fileName) {
    const sheet = this.pickSheet(book);
    if (!sheet) throw new Error("Não encontrei o demonstrativo da Santos Brasil (rótulos \"Contêiner:\" e \"Serviço:\") em nenhuma aba.");
    const P = {
      id: procId(fileName), file: fileName, sheet: sheet.name, importedAt: new Date().toISOString(),
      bl: "", duimp: "", vessel: "", voyage: "", rps: "", nfe: "", client: "", broker: "", table: "", origin: "",
      cifUsd: null, cifBrl: null, periodFrom: "", periodTo: "", calcDate: "", issuedAt: "",
      containers: [], blTotal: null, grandTotal: null, warnings: [],
    };
    let C = null, S = null;
    const rows = sheet.grid;

    for (let ri = 0; ri < rows.length; ri++) {
      const row = rows[ri] || [];
      const cells = [];
      row.forEach((v, ci) => { if (v !== undefined && v !== "") cells.push({ ci, v }); });
      if (!cells.length) continue;
      const after = (k) => { for (let j = k + 1; j < cells.length; j++) if (!/:\s*_*$/.test(String(cells[j].v)) || typeof cells[j].v === "number") return cells[j].v; return ""; };
      let labelled = false;

      for (let k = 0; k < cells.length; k++) {
        const raw = String(cells[k].v), n = norm(raw);
        if (typeof cells[k].v === "number") continue;
        const lab = (re) => re.test(n);
        if (lab(/^EMISSAO:/)) { P.issuedAt = raw.replace(/^.*?:\s*/, "").trim(); labelled = true; }
        else if (lab(/^NAVIO:$/)) { P.vessel = String(after(k)); labelled = true; }
        else if (lab(/^VIAGEM:$/)) { P.voyage = String(after(k)); labelled = true; }
        else if (lab(/^RPS:$/)) { P.rps = String(after(k)); labelled = true; }
        else if (lab(/^NFE:$/)) { P.nfe = String(after(k)); labelled = true; }
        else if (lab(/^CLIENTE:$/)) { P.client = String(after(k)); labelled = true; }
        else if (lab(/^DESPACHANTE:$/)) { P.broker = String(after(k)); labelled = true; }
        else if (lab(/^TABELA:$/)) { P.table = String(after(k)); labelled = true; }
        else if (lab(/^BL:$/)) { P.bl = String(after(k)).trim(); labelled = true; }
        else if (lab(/^VALOR CIF \(US\$\):$/)) { P.cifUsd = num(after(k)); labelled = true; }
        else if (lab(/^VALOR CIF \(R\$\):$/)) { P.cifBrl = num(after(k)); labelled = true; }
        else if (lab(/^PORTO:$/)) { P.origin = String(after(k)); labelled = true; }
        else if (lab(/^DOC\. SAIDA:$/)) { P.duimp = String(after(k)).trim(); labelled = true; }
        else if (lab(/^PERIODO:$/)) { P.periodFrom = toISO(after(k)); labelled = true; }
        else if (lab(/^A:$/) && P.periodFrom && !P.periodTo) { P.periodTo = toISO(after(k)); labelled = true; }
        else if (lab(/^CALCULO PREV\.:$/)) { P.calcDate = toISO(after(k)); labelled = true; }
        else if (lab(/^CONTEINER:$/)) {
          C = { id: String(after(k)).trim(), entry: "", exit: "", limit: "", periods: null, stay: null, regimeChange: "", services: [], reported: null };
          P.containers.push(C); S = null; labelled = true;
        }
        else if (lab(/^DATA ENTRADA:$/) && C) { C.entry = toISO(after(k)); labelled = true; }
        else if (lab(/^DATA SAIDA:$/) && C) { C.exit = toISO(after(k)); labelled = true; }
        else if (lab(/^LIMITE SAIDA:$/) && C) { C.limit = toISO(after(k)); labelled = true; }
        else if (lab(/^PERIODOS:/) && C) { C.periods = num(after(k)); labelled = true; }
        else if (lab(/^ESTADIA:$/) && C) { C.stay = parseInt(String(after(k)), 10) || null; labelled = true; }
        else if (lab(/^MUDANCA DE REGIME:$/) && C) { C.regimeChange = String(after(k)); labelled = true; }
        else if (lab(/^SERVICO:$/) && C) {
          S = { name: String(after(k)).trim(), code: "", value: 0, obs: "" };
          C.services.push(S); labelled = true;
        }
        else if (lab(/^CODIGO:$/) && S) { S.code = String(after(k)); labelled = true; }
        else if (lab(/^VALOR SERVICO:$/) && S) { S.value = num(after(k)) || 0; labelled = true; }
        else if (lab(/^OBS:$/) && S) { S.obs = String(after(k)); labelled = true; }
        else if (lab(/^VALOR TOTAL DO CONTEINER/)) {
          const id = (raw.match(/\(([^)]+)\)/) || [])[1]?.trim();
          const c = P.containers.find((x) => x.id === id) || C;
          if (c) c.reported = num(after(k));
          S = null; labelled = true;
        }
        else if (lab(/^VALOR TOTAL DO BL/)) { P.blTotal = num(after(k)); S = null; labelled = true; }
        else if (lab(/^TOTAL GERAL:$/)) { P.grandTotal = num(after(k)); S = null; labelled = true; }
      }
      // linhas de continuação da OBS (períodos de armazenagem, um por linha)
      if (!labelled && S && cells.length === 1 && typeof cells[0].v === "string") S.obs += "\n" + cells[0].v;
      if (P.grandTotal !== null && ri > 0 && !labelled && !S) { /* rodapé: instruções bancárias, ignorado */ }
    }

    if (!P.containers.length) throw new Error("Nenhum contêiner encontrado no demonstrativo.");
    if (!P.id) P.id = procId(P.bl) || "";
    for (const c of P.containers) {
      const sum = c.services.reduce((a, s) => a + s.value, 0);
      if (c.reported !== null && Math.abs(sum - c.reported) > 0.05) P.warnings.push(`Contêiner ${c.id}: soma dos serviços R$ ${sum.toFixed(2)} ≠ total informado R$ ${c.reported.toFixed(2)}`);
    }
    const total = P.containers.reduce((a, c) => a + c.services.reduce((b, s) => b + s.value, 0), 0);
    if (P.grandTotal !== null && Math.abs(total - P.grandTotal) > 0.05) P.warnings.push(`Soma dos contêineres R$ ${total.toFixed(2)} ≠ Total Geral R$ ${P.grandTotal.toFixed(2)}`);
    return P;
  },
};

/** Custos derivados de um processo, segundo as regras atuais. */
function analyze(P, rules, freeDays = 15, tariff = null) {
  const out = { regular: 0, extra_storage: 0, extra_customs: 0, total: 0, lines: [], containers: [], unknown: 0, tariffIssues: 0, aboveMin: 0 };
  for (const c of P.containers) {
    const cc = { id: c.id, regular: 0, extra_storage: 0, extra_customs: 0, total: 0, extraDays: 0, dayRate: 0, physical: false, lines: [] };
    for (const s of c.services) {
      const r = classify(s.name, rules);
      if (r.unknown) out.unknown++;
      if (r.group === "storage") {
        const per = storagePeriods(s.obs);
        if (per.length) {
          const first = per.filter((p) => p.n === 1).reduce((a, p) => a + p.value, 0);
          const rest = per.filter((p) => p.n > 1);
          const restVal = Math.max(0, s.value - first);
          cc.lines.push({ label: `${r.label} · 1º período (${per.find((p) => p.n === 1)?.days ?? freeDays} dias)`, key: r.label + " · período livre", group: "regular", value: Math.min(first, s.value), service: s });
          if (restVal > 0.004) {
            const days = rest.reduce((a, p) => a + p.days, 0);
            cc.extraDays += days; cc.dayRate = rest[0]?.value || 0;
            cc.lines.push({ label: `${r.label} · períodos adicionais (${days} dia${days === 1 ? "" : "s"})`, key: "Armazenagem adicional", group: "extra_storage", value: restVal, qty: days, unit: rest[0]?.value, service: s });
          }
        } else cc.lines.push({ label: r.label, key: r.label + " · período livre", group: "regular", value: s.value, service: s });
      } else {
        if (/POSICIONAMENTO/.test(norm(s.name))) cc.physical = true;
        cc.lines.push({ label: r.label, key: r.label, group: r.group, value: s.value, service: s, unknown: !!r.unknown });
      }
    }
    for (const l of cc.lines) {
      cc[l.group] += l.value; cc.total += l.value;
      l.tariff = tariff ? tariffCheck(l, tariff) : null;
      if (l.tariff && !l.tariff.ok) out.tariffIssues++;
      if (l.tariff?.aboveMin) out.aboveMin++;
    }
    cc.stay = c.stay; cc.entry = c.entry; cc.exit = c.exit; cc.periods = c.periods; cc.reported = c.reported;
    cc.overFree = (c.stay || 0) > freeDays || cc.extraDays > 0;
    out.containers.push(cc);
    for (const l of cc.lines) out.lines.push({ ...l, container: c.id });
    out.regular += cc.regular; out.extra_storage += cc.extra_storage; out.extra_customs += cc.extra_customs; out.total += cc.total;
  }
  out.extra = out.extra_storage + out.extra_customs;
  out.storageFirst = out.lines.filter((l) => l.group === "regular" && /período livre$/.test(l.key)).reduce((a, l) => a + l.value, 0);
  out.n = P.containers.length;
  out.maxStay = Math.max(0, ...P.containers.map((c) => c.stay || 0));
  out.over = out.containers.filter((c) => c.overFree).length;
  out.physical = out.containers.filter((c) => c.physical).length;
  out.firstEntry = P.containers.map((c) => c.entry).filter(Boolean).sort()[0] || P.periodFrom || "";
  out.lastExit = P.containers.map((c) => c.exit).filter(Boolean).sort().pop() || "";
  return out;
}

/* ------------------------------------------------------------------ Red Channel Status */

/** Interpreta a planilha manual de canal vermelho. Cada processo pode ocupar várias linhas
 *  (rótulos + datas); um bloco começa na linha onde aparece um número IRA. */
const RC = {
  COLS: [
    { key: "qty", re: /CONTAINERS? QUANTITY|集装箱/ },
    { key: "batch", re: /BATCH|批次/ },
    { key: "daysHeld", re: /TOTAL DAYS|滞留/ },
    { key: "storageFirst", re: /PORT STORAGE|1ST PERIOD|堆存/ },
    { key: "storageAdd", re: /ADDITIONAL PERIOD/ },
    { key: "demurrage", re: /DEMURRAGE/ },
    { key: "exTariff", re: /EX-?TARIFF|EX TARIFF/ },
    { key: "infoRequested", re: /INFORMATION REQUESTED|资料/ },
    { key: "official", re: /^OFFICIAL/ },
    { key: "nextStepDate", re: /DATE OF NEXT STEP|完成时间/ },
    { key: "nextStep", re: /^NEXT STEP|下一步$/ },
  ],

  parse(book) {
    const results = [];
    for (const sh of book.sheets) {
      const g = sh.grid;
      // 1) cabeçalho: linha com mais títulos reconhecidos
      const colOf = {};
      let headerRow = -1, best = 0;
      for (let r = 0; r < Math.min(g.length, 40); r++) {
        let hits = 0; const map = {};
        (g[r] || []).forEach((v, c) => {
          const n = norm(v);
          if (!n) return;
          for (const col of this.COLS) if (!(col.key in map) && col.re.test(n)) { map[col.key] = c; hits++; break; }
        });
        if (hits > best) { best = hits; headerRow = r; Object.assign(colOf, map); }
      }
      // 2) blocos por processo
      const starts = [];
      for (let r = headerRow + 1; r < g.length; r++) {
        const id = (g[r] || []).map(procId).find(Boolean);
        if (id && !starts.some((s) => s.id === id)) starts.push({ r, id });
      }
      starts.forEach((s, i) => {
        const end = i + 1 < starts.length ? starts[i + 1].r : g.length;
        let top = s.r;
        // o bloco pode começar acima da linha do IRA (rótulos de datas na linha de cima)
        while (top > headerRow + 1 && top > (i ? starts[i - 1].r + 1 : 0) && !(g[top - 1] || []).some((v) => procId(v)) && (g[top - 1] || []).some((v) => /customs|officer|request|submitted/i.test(String(v)))) top--;
        results.push(this.block(g, top, end, s.id, colOf));
      });
    }
    return results;
  },

  block(g, r0, r1, id, colOf) {
    const rec = { id, channel: "Vermelho", rounds: [], source: "planilha Red Channel" };
    const year = (new Date()).getFullYear();
    const texts = (c) => { const out = []; for (let r = r0; r < r1; r++) { const v = g[r]?.[c]; if (v !== undefined && v !== "") out.push(v); } return out; };
    const firstText = (c) => (c === undefined ? "" : texts(c).map(String).find((x) => x.trim()) || "");
    const nums = (c) => (c === undefined ? [] : texts(c).map(num).filter((x) => !isNaN(x)));

    rec.batch = texts(colOf.batch ?? 2).map(String).join(" · ").replace(/\s+/g, " ").trim();
    rec.containers = nums(colOf.qty)[0] ?? null;
    rec.storageFirst = nums(colOf.storageFirst)[0] ?? null;
    rec.storageAdd = nums(colOf.storageAdd)[0] ?? null;
    rec.demurrage = nums(colOf.demurrage)[0] ?? null;
    rec.exTariff = firstText(colOf.exTariff);
    rec.infoRequested = firstText(colOf.infoRequested);
    rec.official = texts(colOf.official ?? -1).join(" · ");
    rec.nextStep = firstText(colOf.nextStep);
    rec.nextStepDate = toISO(firstText(colOf.nextStepDate), year);

    // datas: em cada coluna, o rótulo (texto) diz o que é a data abaixo dele
    const width = Math.max(...g.slice(r0, r1).map((r) => (r || []).length), 0);
    const dated = [];
    for (let c = 0; c < width; c++) {
      let label = "", date = "", extra = "";
      for (let r = r0; r < r1; r++) {
        const v = g[r]?.[c];
        if (v === undefined || v === "") continue;
        const iso = toISO(v, year);
        const looksDate = iso && (typeof v === "number" || /^\s*\d{1,4}[\/\-]\d{1,2}/.test(String(v)));
        if (looksDate) { if (!date) { date = iso; extra = String(v).replace(/^\s*[\d\/\-]+\s*/, "").trim(); } }
        else if (typeof v === "string") label += " " + v;
      }
      const L = norm(label);
      if (/CUSTOMS CLEARED|DESEMBARAC/.test(L)) { rec.status = "Desembaraçado"; if (date) rec.clearedAt = date; continue; }
      if (!date) continue;
      dated.push({ c, L, date, extra });
    }
    for (const d of dated) {
      if (/CHANNEL ASSIGNMENT|分配|CANAL/.test(d.L)) rec.assignedAt = d.date;
      else if (/SUBMITTED|提交/.test(d.L)) { const last = rec.rounds[rec.rounds.length - 1]; if (last && !last.sub) last.sub = d.date; else rec.rounds.push({ req: "", sub: d.date }); }
      else if (/REQUEST|要求/.test(d.L)) rec.rounds.push({ req: d.date, sub: "", note: d.extra });
      else if (!rec.clearedAt && rec.status === "Desembaraçado") rec.clearedAt = d.date;
    }
    rec.rounds = rec.rounds.filter((x) => x.req || x.sub);
    const held = nums(colOf.daysHeld);
    rec.daysHeld = held.length ? held[0] : null;
    if (!rec.status) rec.status = "Em andamento";
    return rec;
  },
};

/* ------------------------------------------------------------------ tarifário Santos Brasil (valores com impostos) */
/** Valor unitário esperado por serviço (tarifário PAN 1270/2025). "min" = valor mínimo (pode ser % do CIF). null = pode variar. */

  { match: "ARMAZENAGEM#1", label: "Armazenagem 1º período (15 dias)", value: 2064.14, min: true },
  { match: "ARMAZENAGEM#2", label: "Armazenagem diária adicional", value: 247.84, min: true },
  { match: "INSPECAO NAO INVASIVA", label: "Inspeção não invasiva (escaneamento)", value: 346.5 },

  { match: "DESCONSOLIDACAO|DESUNITIZACAO", label: "Desova (retirada de material)", value: null, nonGreen: true },
  { match: "CONSOLIDACAO|UNITIZACAO", label: "Ova (alocação de material)", value: null, nonGreen: true },
];
const REF_CPU = { green: 3331.79, other: 3887.37 };

/** Confere uma linha de custo com o tarifário. Retorna { expected, ok, note } ou null. */
function tariffCheck(line, tariff) {
  const n = norm(line.service.name);
  let t;
  if (/ARMAZENAGEM/.test(n)) t = tariff.find((x) => x.match === (line.group === "extra_storage" ? "ARMAZENAGEM#2" : "ARMAZENAGEM#1"));
  else t = tariff.find((x) => !x.match.startsWith("ARMAZENAGEM") && new RegExp(norm(x.match).split("|").map((y) => y.replace(/[.*+?^${}()[\]\\]/g, "\\$&")).join("|")).test(n));
  if (!t) return null;
  if (t.value === null || t.value === undefined || t.value === "") return { expected: null, ok: true, variable: true, t };
  const qtyM = String(line.service.obs || "").match(/por\s+(\d+)\s+solicita/i);
  const qty = line.group === "extra_storage" ? line.qty || 1 : qtyM ? +qtyM[1] : 1;
  const expected = +t.value * qty;
  const diff = line.value - expected;
  const ok = t.min ? diff > -0.05 : Math.abs(diff) <= 0.05;
  return { expected, diff, ok, aboveMin: t.min && diff > 0.05, t, nonGreen: !!t.nonGreen };
}

/* ------------------------------------------------------------------ planilha COMEX (histórico de muitos processos) */
const CX = {
  HEAD: {
    id: /^IRA$/, duimp: /^DUIMP$/, batch: /^BATCH$/, bl: /^BL$/, cont: /^CONTAINER ID$/, channel: /^CHANNEL$/,
    presence: /CARGO PRESENCE/, cleared: /CLEARANCE COMPLETED/, pickup: /PICK-?UP DATE/, returned: /CONTAINER RETURNED DATE/,
    storageDays: /^STORAGE PERIOD/, overDays: /^OVER STORAGE/, demDays: /^DEMURRAGE PERIOD/, demTime: /^DEMURRAGE TIME/,
    cif: /^CIF$/, ff: /FREIGHT FORWARDER FEE/, storage: /^STORAGE FEE/, demurrage: /^DEMURRAGE FEE/, siscomex: /^SISCOMEX FEE/,
    broker: /^BROKER FEE/, inspection: /CUSTOMS INSPECTION FEE/, other: /OTHER CUSTOMS CLEARANCE FEE/, afrmm: /^AFRMM/,
  },
  findHeader(g) {
    for (let r = 0; r < Math.min(g.length, 30); r++) {
      const map = {};
      (g[r] || []).forEach((v, c) => { const n = norm(v); for (const [k, re] of Object.entries(this.HEAD)) if (!(k in map) && re.test(n)) map[k] = c; });
      if ("id" in map && "cont" in map && ("storage" in map || "channel" in map)) return { r, map };
    }
    return null;
  },
  isComex(book) { return book.sheets.some((sh) => this.findHeader(sh.grid)) || book.sheets.some((sh) => this.payHeader(sh.grid)); },
  parse(book) {
    const procs = {};
    for (const sh of book.sheets) {
      const h = this.findHeader(sh.grid);
      if (!h) continue;
      const M = h.map, g = sh.grid;
      const v = (row, k) => (k in M ? row[M[k]] : undefined);
      const nn = (x) => { const y = num(x); return isNaN(y) ? null : y; };
      const day = (x) => { const y = nn(x); return y === null || y < 0 || y > 2000 ? null : y; };
      const ch = (x) => { const n = norm(x); return /VERM|RED/.test(n) ? "Vermelho" : /AMAR|YELL/.test(n) ? "Amarelo" : /VERD|GREEN/.test(n) ? "Verde" : /CINZ|GREY|GRAY/.test(n) ? "Cinza" : ""; };
      for (let r = h.r + 1; r < g.length; r++) {
        const row = g[r]; if (!row) continue;
        const id = procId(v(row, "id")); if (!id) continue;
        let p = procs[id];
        if (!p) {
          p = procs[id] = {
            id, duimp: String(v(row, "duimp") ?? ""), batch: String(v(row, "batch") ?? ""), bl: String(v(row, "bl") ?? ""), n: 0, channel: ch(v(row, "channel")),
            presence: toISO(v(row, "presence")), cleared: toISO(v(row, "cleared")), pickup: toISO(v(row, "pickup")), returned: "",
            storageDays: null, overDays: null, demDays: null, demTime: null, cif: nn(v(row, "cif")),
            ff: nn(v(row, "ff")) || 0, storage: nn(v(row, "storage")) || 0, demurrage: nn(v(row, "demurrage")) || 0, siscomex: nn(v(row, "siscomex")) || 0,
            broker: nn(v(row, "broker")) || 0, inspection: nn(v(row, "inspection")) || 0, other: nn(v(row, "other")) || 0, afrmm: nn(v(row, "afrmm")) || 0,
          };
        }
        p.n++;
        const mx = (k, x) => { if (x !== null && (p[k] === null || x > p[k])) p[k] = x; };
        mx("storageDays", day(v(row, "storageDays"))); mx("overDays", day(v(row, "overDays"))); mx("demDays", day(v(row, "demDays"))); mx("demTime", day(v(row, "demTime")));
        const ret = toISO(v(row, "returned")); if (ret > p.returned) p.returned = ret;
        if (!p.channel) p.channel = ch(v(row, "channel"));
        if (!p.pickup) p.pickup = toISO(v(row, "pickup"));
      }
    }
    return { processes: procs, payments: this.payments(book) };
  },
  payHeader(g) {
    for (let r = 0; r < Math.min(g.length, 10); r++) {
      const n = (g[r] || []).map(norm);
      if (n.some((x) => /PRIMEIRO APROVADOR/.test(x)) && n.some((x) => /^PROCESSO$/.test(x))) {
        const f = (re) => n.findIndex((x) => re.test(x));
        return { r, map: { id: f(/^PROCESSO$/), date: f(/DATE OF PAYMENT|DATA PREVISTA/), status: f(/^STATUS$/), value: f(/VALOR TOTAL/), type: f(/TIPO IMPOSTO/), supplier: f(/^FORNECEDOR$/), ap1: f(/PRIMEIRO APROVADOR/), ap2: f(/SEGUNDO APROVADOR/), obs: f(/^OBSERVACOES$/) } };
      }
    }
    return null;
  },
  /** Pagamentos feitos pelo sistema (ex.: aba "Other Fees"). Nomes de pessoas não são guardados: só se houve 1º/2º aprovador. */
  payments(book) {
    const out = [];
    for (const sh of book.sheets) {
      const h = this.payHeader(sh.grid); if (!h) continue;
      const M = h.map;
      for (let r = h.r + 1; r < sh.grid.length; r++) {
        const row = sh.grid[r]; if (!row) continue;
        const id = procId(row[M.id]); if (!id) continue;
        const has = (i) => i >= 0 && String(row[i] ?? "").trim() !== "";
        out.push({ id, date: toISO(row[M.date]), status: String(row[M.status] ?? ""), value: num(row[M.value]) || 0, type: String(row[M.type] ?? ""),
          kind: /LAUDO|ENGENH/i.test(String(row[M.obs] ?? "") + " " + String(row[M.supplier] ?? "")) ? "laudo" : "outro", ap1: has(M.ap1), ap2: has(M.ap2), obs: String(row[M.obs] ?? "").replace(/\s+/g, " ").trim().slice(0, 120) });
      }
    }
    return out;
  },
};

<script>
/* Base de dados: salva automaticamente no navegador (IndexedDB) e, se você escolher uma pasta de trabalho
 * (Edge/Chrome), também em <pasta>/custos-aduaneiros.json + cópia das planilhas importadas em <pasta>/SANTOS_BRASIL e <pasta>/RED_CHANNEL.
 * A pasta pode ser do OneDrive/SharePoint para ter backup e compartilhar com a equipe. */
const KV = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("custos-aduaneiros", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res((this._db = r.result));
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
};

const DB_FILE = "custos-aduaneiros.json";

const Data = {
  db: null,
  folder: null,

  empty() {
    return {
      version: 2, processes: {}, red: {}, notes: {}, pay: {}, uploads: [], history: null, payments: [],
      rules: DEFAULT_RULES.map((r) => ({ ...r })), tariff: DEFAULT_TARIFF.map((t) => ({ ...t })),
      settings: { freeDays: 15, demurrageDays: 40 }, log: [],
    };
  },

  async load() {
    let db = null;
    try { db = await KV.get("db"); } catch { /* navegador sem IndexedDB */ }
    if (!db) { try { db = JSON.parse(localStorage.getItem("custos-aduaneiros-db") || "null"); } catch { db = null; } }
    this.db = Object.assign(this.empty(), db || {});
    try {
      const h = await KV.get("folder");
      if (h && (await h.queryPermission({ mode: "readwrite" })) === "granted") await this.useFolder(h, true);
      else if (h) this.pendingFolder = h;
    } catch { /* sem pasta */ }
  },

  async save() {
    this.db.savedAt = new Date().toISOString();
    try { await KV.set("db", this.db); } catch { try { localStorage.setItem("custos-aduaneiros-db", JSON.stringify(this.db)); } catch { /* cheio */ } }
    if (this.folder) { try { await this.write(DB_FILE, JSON.stringify(this.db, null, 1)); } catch (e) { console.warn("Falha ao gravar na pasta", e); } }
  },

  log(msg) { this.db.log.unshift({ at: new Date().toISOString(), msg }); this.db.log.length = Math.min(this.db.log.length, 300); },

  /* ---------- pasta de trabalho (opcional) */
  folderSupported: () => typeof window.showDirectoryPicker === "function",
  async pickFolder() {
    const h = await window.showDirectoryPicker({ id: "custos-aduaneiros", mode: "readwrite" });
    await this.useFolder(h);
  },
  async reconnect() {
    const h = this.pendingFolder;
    if (h && (await h.requestPermission({ mode: "readwrite" })) === "granted") { await this.useFolder(h); this.pendingFolder = null; return true; }
    return false;
  },
  async useFolder(h, silent) {
    this.folder = h;
    await KV.set("folder", h).catch(() => {});
    // se a pasta já tem uma base mais recente, ela prevalece
    try {
      const f = await (await h.getFileHandle(DB_FILE)).getFile();
      const other = JSON.parse(await f.text());
      if (!this.db.savedAt || (other.savedAt && other.savedAt > this.db.savedAt) || !Object.keys(this.db.processes).length) {
        this.db = Object.assign(this.empty(), other);
        await KV.set("db", this.db).catch(() => {});
        return;
      }
    } catch { /* ainda não existe */ }
    if (!silent) await this.save();
  },
  async write(path, data) {
    const parts = path.split("/").filter(Boolean), name = parts.pop();
    let d = this.folder;
    for (const p of parts) d = await d.getDirectoryHandle(p, { create: true });
    const w = await (await d.getFileHandle(name, { create: true })).createWritable();
    await w.write(data); await w.close();
  },

  /* ---------- consultas */
  rules() { return this.db.rules?.length ? this.db.rules : DEFAULT_RULES; },
  tariff() { return this.db.tariff?.length ? this.db.tariff : DEFAULT_TARIFF; },
  freeDays() { return +this.db.settings.freeDays || 15; },
  analysis(id) { const P = this.db.processes[id]; return P ? analyze(P, this.rules(), this.freeDays(), this.tariff()) : null; },
  hist(id) { return this.db.history?.processes?.[id] || null; },

  /** Canal e situação unificados: planilha Red Channel > histórico COMEX > demonstrativo. */
  merged(id, P, R, A, H) {
    const channel = R?.channel || H?.channel || "";
    // na COMEX, "clearance completed" anterior à presença de carga é a data de registro da DUIMP: não vale como desembaraço
    const hCleared = H?.cleared && (!H.presence || H.cleared >= H.presence) ? H.cleared : "";
    let stage = "";
    if (R ? R.status === "Desembaraçado" || R.clearedAt : hCleared) stage = "cleared";
    else if (R) stage = (R.rounds || []).some((r) => r.req && !r.sub) ? "pending" : "inspection";
    if (A?.lastExit && A.lastExit <= new Date().toISOString().slice(0, 10) && (stage === "cleared" || H?.pickup)) stage = "out";
    if (!stage && P) stage = "unknown";
    const green = channel === "Verde";
    const mapaFlag = !!(A && green && A.extra_customs > 0.004);
    return { channel, stage, clearedAt: R ? R.clearedAt || "" : hCleared, mapaFlag, channelSource: R?.channel ? "red" : H?.channel ? "comex" : "" };
  },

  /** Processos acompanhados = os que têm demonstrativo da Santos Brasil. A planilha Red Channel só complementa. */
  rows(includeRedOnly = false) {
    const ids = new Set(Object.keys(this.db.processes));
    if (includeRedOnly) Object.keys(this.db.red).forEach((k) => ids.add(k));
    return [...ids].map((id) => {
      const P = this.db.processes[id] || null, R = this.db.red[id] || null, H = this.hist(id);
      const A = P ? analyze(P, this.rules(), this.freeDays(), this.tariff()) : null;
      return { id, P, R, A, H, M: this.merged(id, P, R, A, H) };
    }).sort((a, b) => (b.A?.total || 0) - (a.A?.total || 0) || a.id.localeCompare(b.id));
  },
  redOnly() { return Object.keys(this.db.red).filter((id) => !this.db.processes[id]); },

  /* ---------- importações (cada arquivo vira um registro que pode ser excluído) */
  newUpload(name, kind) {
    const u = { id: "U" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name, kind, at: new Date().toISOString(), ids: [], prev: {} };
    this.db.uploads.unshift(u);
    return u;
  },
  upsertProcess(P, u) {
    const prev = this.db.processes[P.id];
    u.prev[P.id] = prev ? JSON.parse(JSON.stringify(prev)) : null;
    u.ids.push(P.id);
    this.db.processes[P.id] = { ...P, uploadId: u.id };
    this.log(`${prev ? "Atualizado" : "Importado"} demonstrativo ${P.id} (${P.containers.length} contêineres, arquivo ${P.file})`);
  },
  upsertRed(rec, u) {
    const prev = this.db.red[rec.id] || null;
    u.prev[rec.id] = prev ? JSON.parse(JSON.stringify(prev)) : null;
    u.ids.push(rec.id);
    const clean = Object.fromEntries(Object.entries(rec).filter(([, v]) => v !== "" && v !== null && v !== undefined && !(Array.isArray(v) && !v.length)));
    this.db.red[rec.id] = { ...(prev || {}), ...clean, uploadId: u.id, updatedAt: new Date().toISOString() };
  },
  setHistory(h, u) {
    u.prev.history = this.db.history ? { uploadId: this.db.history.uploadId } : null;
    this.db.history = { ...h, payments: undefined, uploadId: u.id, file: u.name, at: u.at };

<script>
/* Interface do sistema de custos aduaneiros (pt / en / zh). */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (v, d = 0) => (+v || 0).toLocaleString(LOCALE[LANG], { maximumFractionDigits: d });
const brl = (v) => (v === null || v === undefined || isNaN(v) ? "—" : new Intl.NumberFormat(LOCALE[LANG], { style: "currency", currency: "BRL" }).format(v));
const brlK = (v) => {
  if (LANG === "zh" && Math.abs(v) >= 1e4) return "R$ " + nf(v / 1e4, 1) + " 万";
  if (Math.abs(v) >= 1e6) return "R$ " + nf(v / 1e6, 2) + (LANG === "pt" ? " mi" : " M");
  if (Math.abs(v) >= 1e4) return "R$ " + nf(v / 1e3, 1) + (LANG === "pt" ? " mil" : " k");
  return brl(v);
};
const pct = (a, b) => nf(b ? (a / b) * 100 : 0, 1) + "%";
const fmtD = (iso) => (iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? (LANG === "pt" ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : iso.slice(0, 10)) : iso || "—");
const fmtDs = (iso) => (iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? (LANG === "pt" ? iso.slice(8, 10) + "/" + iso.slice(5, 7) : iso.slice(5, 10)) : "—");
const plural = (n, s, p) => `${nf(n)} ${n === 1 ? t(s) : t(p || s + "s")}`;
const today = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => (a && b ? Math.round((Date.parse(b) - Date.parse(a)) / 864e5) : null);
const median = (a) => { const s = a.filter((x) => x !== null && !isNaN(x)).sort((x, y) => x - y); return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : null; };
const key = (id) => encodeURIComponent(procKey(id));
const unkey = (k) => decodeURIComponent(k).replace(/^(IRA\d+)-(\d{2})$/, "$1/$2");
const CHANNELS = ["Verde", "Amarelo", "Vermelho", "Cinza"];
const view = () => $("#view");
let F = { q: "", ch: "", month: "" };

function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.remove("hidden"); clearTimeout(el._h); el._h = setTimeout(() => el.classList.add("hidden"), 2600); }
function openModal(html) { $("#modal-body").innerHTML = html; $("#modal").classList.remove("hidden"); }
function closeModal() { $("#modal").classList.add("hidden"); }
/** Confirmação dentro da página (substitui confirm(), que não aparece na página publicada). */
function ask(msg) {
  return new Promise((res) => {
    const box = document.createElement("div");
    box.className = "modal"; box.style.zIndex = 40;
    box.innerHTML = `<div class="modal-box" style="width:min(460px,100%)"><p>${esc(msg)}</p><div class="row"><button class="btn primary" data-a="1">${t("Confirmar")}</button><button class="btn" data-a="0">${t("Cancelar")}</button></div></div>`;
    document.body.appendChild(box);
    box.addEventListener("click", (e) => { const a = e.target.closest("[data-a]"); if (!a && e.target !== box) return; box.remove(); res(a?.dataset.a === "1"); });
    box.querySelector("[data-a='1']").focus();
  });
}

function chBadge(ch, src) { return ch ? `<span class="badge ch-${esc(ch)}" ${src === "comex" ? `title="${esc(t("Canal da planilha COMEX"))}"` : ""}>${esc(t(ch))}${src === "comex" ? " ·C" : ""}</span>` : `<span class="badge b-none">${t("sem canal")}</span>`; }
function stageBadge(M, R) {
  const s = M?.stage;
  if (s === "out") return `<span class="badge b-ok">✓ ${t("Retirado do terminal")}</span>`;
  if (s === "cleared") return `<span class="badge b-ok">✓ ${t("Desembaraçado")}${M.clearedAt ? " " + fmtD(M.clearedAt) : ""}</span>`;
  if (s === "pending") return `<span class="badge b-warn">◷ ${t("Exigência em aberto")}</span>`;
  if (s === "inspection") return `<span class="badge b-warn">◷ ${t(R?.status || "Em andamento")}</span>`;
  return `<span class="badge b-none">${t("sem status")}</span>`;
}
const gKey = (g) => `<span class="key" style="background:${GROUPS[g].color}"></span>`;
const gName = (g) => t(g === "regular" ? "Regular" : g === "extra_storage" ? "Extra armazenagem" : "Extra desembaraço");
const kpiName = (g) => (g === "extra_storage" ? "KPI 1 · Storage" : g === "extra_customs" ? "KPI 3 · Customs costs" : "");
const itemName = (k) => (/ · período livre$/.test(k) ? t(k.replace(/ · período livre$/, "")) + " · " + t("período livre") : t(k));

/* ------------------------------------------------------------------ tooltip */
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest?.("[data-tip]"), tip = $("#tip");
  if (!el) { tip.classList.add("hidden"); return; }
  tip.innerHTML = el.dataset.tip; tip.classList.remove("hidden");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 14) + "px";
  tip.style.top = (e.clientY + 16 + h > window.innerHeight ? e.clientY - h - 10 : e.clientY + 16) + "px";
});

/* ------------------------------------------------------------------ filtros */
function filtered(includeRedOnly = false) {
  const q = F.q.trim().toUpperCase();
  return Data.rows(includeRedOnly).filter(({ id, P, R, A, M }) => {
    if (F.ch && (M.channel || "") !== F.ch) return false;
    if (F.month && !(A?.firstEntry || R?.assignedAt || "").startsWith(F.month)) return false;
    if (q) {
      const hay = [id, P?.bl, P?.duimp, P?.vessel, R?.batch, ...(P?.containers || []).map((c) => c.id)].join(" ").toUpperCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function filterBar() {
  const months = [...new Set(Data.rows(true).map(({ A, R }) => (A?.firstEntry || R?.assignedAt || "").slice(0, 7)).filter(Boolean))].sort().reverse();
  const active = F.q || F.ch || F.month;
  return `<div class="filters">
    <input id="f-q" placeholder="${esc(t("Buscar processo, BL, DUIMP, contêiner…"))}" value="${esc(F.q)}" style="min-width:240px">
    <select id="f-ch"><option value="">${t("Todos os canais")}</option>${CHANNELS.map((c) => `<option value="${c}" ${F.ch === c ? "selected" : ""}>${t(c)}</option>`).join("")}</select>
    <select id="f-month"><option value="">${t("Todas as entradas")}</option>${months.map((m) => `<option value="${m}" ${F.month === m ? "selected" : ""}>${t("Entrada em")} ${m.slice(5)}/${m.slice(0, 4)}</option>`).join("")}</select>
    ${active ? `<button class="btn sm" id="f-clear">${t("Limpar filtros")}</button>` : ""}
  </div>`;
}
function bindFilters() {
  const re = () => { const pos = $("#f-q")?.selectionStart; route(); const i = $("#f-q"); if (i && pos !== undefined) { i.focus(); i.setSelectionRange(pos, pos); } };
  $("#f-q")?.addEventListener("input", (e) => { F.q = e.target.value; clearTimeout(bindFilters._t); bindFilters._t = setTimeout(re, 250); });
  $("#f-ch")?.addEventListener("change", (e) => { F.ch = e.target.value; route(); });
  $("#f-month")?.addEventListener("change", (e) => { F.month = e.target.value; route(); });
  $("#f-clear")?.addEventListener("click", () => { F = { q: "", ch: "", month: "" }; route(); });
}

function totals(rows) {
  const free = Data.freeDays();
  const T = { procs: 0, cont: 0, regular: 0, extra_storage: 0, extra_customs: 0, total: 0, over: 0, within: 0, physical: 0, withExtra: 0, unknown: 0, tariff: 0, mapa: 0, redOpen: 0, redAll: 0, meta: 0, byKey: {} };
  for (const { A, M } of rows) {
    if (M?.channel === "Vermelho") { T.redAll++; if (M.stage !== "cleared" && M.stage !== "out") T.redOpen++; }
    if (!A) continue;
    T.procs++; T.cont += A.n; T.regular += A.regular; T.extra_storage += A.extra_storage; T.extra_customs += A.extra_customs; T.total += A.total;
    T.over += A.over; T.within += A.containers.filter((c) => (c.stay || 0) <= free && !c.extraDays).length;
    T.physical += A.physical; T.unknown += A.unknown; T.tariff += A.tariffIssues; if (M.mapaFlag) T.mapa++;
    if (A.extra > 0.004) T.withExtra++;
    T.meta += A.n * (M.channel && M.channel !== "Verde" ? REF_CPU.other : REF_CPU.green);
    for (const l of A.lines) if (l.group !== "regular") {
      const k = (T.byKey[l.key] ??= { key: l.key, group: l.group, value: 0, conts: new Set() });
      k.value += l.value; k.conts.add(l.container);
    }
  }
  T.extra = T.extra_storage + T.extra_customs;
  return T;
}

/* ------------------------------------------------------------------ gráficos */
function stackedBars(rows) {
  const data = rows.filter((r) => r.A).slice(0, 25);
  if (!data.length) return `<p class="muted">${t("Sem demonstrativos importados.")}</p>`;
  const max = Math.max(...data.map((r) => r.A.total));
  const G = ["regular", "extra_storage", "extra_customs"];
  return `<div class="legend">${G.map((g) => `<span>${gKey(g)}${gName(g)}</span>`).join("")}</div>
  <div class="hbar">${data.map(({ id, A, M }) => {
    const segs = G.filter((g) => A[g] > 0.004).map((g) =>
      `<div class="seg" style="width:${(A[g] / max) * 100}%;background:${GROUPS[g].color}" onclick="location.hash='#p/${key(id)}'"
        data-tip="<b>${esc(id)}</b><br>${esc(gName(g))}: ${brl(A[g])}<br>${pct(A[g], A.total)} ${esc(t("do total do processo"))}"></div>`).join("");
    return `<div class="lab"><a href="#p/${key(id)}">${esc(id)}</a></div>
      <div class="track">${segs}</div><div class="val">${brlK(A.total)} · ${pct(A.extra, A.total)} ${t("extra")}</div>`;
  }).join("")}</div>`;
}
function extraByType(T) {
  const items = Object.values(T.byKey).sort((a, b) => b.value - a.value);
  if (!items.length) return `<p class="muted">${t("Nenhum custo extra nos processos filtrados.")}</p>`;
  const max = items[0].value;
  const groups = [...new Set(items.map((i) => i.group))];
  return `${groups.length > 1 ? `<div class="legend">${groups.map((g) => `<span>${gKey(g)}${kpiName(g)}</span>`).join("")}</div>` : ""}
  <div class="hbar">${items.map((i) => `<div class="lab" title="${esc(itemName(i.key))}"><a href="#extras/${encodeURIComponent(i.key)}">${esc(itemName(i.key))}</a></div>

      data-tip="<b>${esc(itemName(i.key))}</b><br>${brl(i.value)} · ${plural(i.conts.size, "contêiner", "contêineres")}<br>${kpiName(i.group)}"></div></div>
    <div class="val">${brlK(i.value)}</div>`).join("")}</div>`;
}
function stayBars(rows) {
  const data = rows.filter((r) => r.A).map((r) => ({ ...r, stay: r.A.maxStay })).sort((a, b) => b.stay - a.stay).slice(0, 25);
  if (!data.length) return `<p class="muted">${t("Sem dados de estadia.")}</p>`;
  const free = Data.freeDays();
  const max = Math.max(free * 1.2, ...data.map((d) => d.stay));
  return `<div class="hbar">${data.map(({ id, stay, A }) => `<div class="lab"><a href="#p/${key(id)}">${esc(id)}</a></div>
    <div class="track ref" style="--ref:${(free / max) * 100}%"><div class="seg" style="width:${(stay / max) * 100}%;background:${stay > free ? "var(--s-storage)" : "var(--s-regular)"}"
      data-tip="<b>${esc(id)}</b><br>${esc(t("Maior estadia: {n} dias", { n: stay }))}<br>${esc(t("{a} de {b} contêineres além de {d} dias", { a: A.over, b: A.n, d: free }))}"></div></div>
    <div class="val">${t("{n} dias", { n: stay })}</div>`).join("")}</div>
  <p class="axis-note">${t("Linha tracejada = estadia sem custo extra ({d} dias). Laranja = passou do período livre.", { d: free })}</p>`;
}
function compBar(A) {
  const G = ["regular", "extra_storage", "extra_customs"];
  return `<div class="compbar">${G.filter((g) => A[g] > 0.004).map((g) => `<div class="seg" style="flex:${A[g]};background:${GROUPS[g].color}" data-tip="${esc(gName(g))}<br>${brl(A[g])} (${pct(A[g], A.total)})"></div>`).join("")}</div>
  <div class="legend">${G.map((g) => `<span>${gKey(g)}${gName(g)}: <b>${brl(A[g])}</b> (${pct(A[g], A.total)})</span>`).join("")}</div>`;
}

/* ------------------------------------------------------------------ PAINEL */
function summaryText(T) {
  const free = Data.freeDays();
  const s = [t("Há <b>{p}</b> com demonstrativo da Santos Brasil, somando <b>{c}</b> e <b>{v}</b> em custos de terminal.", { p: plural(T.procs, "processo"), c: plural(T.cont, "contêiner", "contêineres"), v: brl(T.total) })];
  if (T.total) s.push(t("Desse total, <b>{e} ({pe})</b> são custos extras: {s} de armazenagem além do período livre (KPI 1) e {c} de inspeção/desembaraço (KPI 3).", { e: brl(T.extra), pe: pct(T.extra, T.total), s: brl(T.extra_storage), c: brl(T.extra_customs) }));
  if (T.cont) s.push(t("<b>{w}</b> dos contêineres ficaram dentro da estadia sem custo extra ({d} dias).", { w: pct(T.within, T.cont), d: free }));
  if (T.redAll) s.push(t("<b>{n}</b> no canal vermelho ({o} em aberto).", { n: plural(T.redAll, "processo"), o: T.redOpen }));
  return s.join(" ");
}

    <a class="tile hero" href="#processos"><div class="k">${t("Custo total")}</div><div class="v">${brlK(T.total)}</div><div class="s">${T.cont ? brl(T.total / T.cont) + " " + t("por contêiner") : ""}</div></a>
    <div class="tile kpi"><div class="k">${t("Estadia sem custo extra (≤ {d} dias)", { d: free })}</div><div class="v">${pct(T.within, T.cont)}</div><div class="s">${t("{a} de {b} contêineres", { a: T.within, b: T.cont })}</div></div>
    <div class="tile"><div class="k">${gKey("regular")}${t("Custos regulares")}</div><div class="v">${brlK(T.regular)}</div><div class="s">${t("{v} por contêiner · meta {m}", { v: brl(cpu), m: brl(meta) })}</div></div>
    <a class="tile" href="#extras"><div class="k"><span class="key" style="background:var(--brand)"></span>${t("Custos extras")}</div><div class="v">${brlK(T.extra)}</div><div class="s">${pct(T.extra, T.total)} ${t("do total")} · ${plural(T.withExtra, "processo")}</div></a>
    <a class="tile" href="#extras"><div class="k">${gKey("extra_storage")}${t("Extra armazenagem")}</div><div class="v">${brlK(T.extra_storage)}</div><div class="s">KPI 1 · Storage</div></a>
    <a class="tile" href="#extras"><div class="k">${gKey("extra_customs")}${t("Extra desembaraço")}</div><div class="v">${brlK(T.extra_customs)}</div><div class="s">KPI 3 · Customs costs</div></a>

  </div>
  ${redOnly.length ? `<div class="warnbox">ⓘ ${t("{n} processo(s) da planilha Red Channel ainda sem demonstrativo da Santos Brasil: {ids}. Eles aparecem em Canal vermelho e entram nos custos quando o demonstrativo chegar.", { n: redOnly.length, ids: redOnly.join(", ") })}</div>` : ""}
  ${T.unknown ? `<div class="warnbox">⚠ ${t("{n} serviço(s) sem regra de classificação. Revise em Configurações.", { n: T.unknown })}</div>` : ""}

function attention(rows) {
  const items = [];
  for (const { id, A, R, M } of rows) {
    const pay = Data.db.pay[id] || {};
    if (R && M.stage !== "cleared" && M.stage !== "out" && R.nextStepDate && R.nextStepDate < today()) items.push({ id, w: 3, t: t("Próximo passo vencido em {d}: {s}", { d: fmtD(R.nextStepDate), s: R.nextStep || "—" }) });
    if (A && A.tariffIssues) items.push({ id, w: 3, t: t("{n} cobrança(s) diferentes do tarifário", { n: A.tariffIssues }) });
    if (M.mapaFlag && !R?.reason) items.push({ id, w: 2, t: t("Canal verde com custos de inspeção ({v}): confirmar se houve MAPA", { v: brl(A.extra_customs) }) });
    if (A && A.extra > 0.004 && !(R?.reason || R?.infoRequested) && !M.mapaFlag) items.push({ id, w: 2, t: t("{v} de custo extra sem motivo registrado", { v: brl(A.extra) }) });
    if (A && pay.approval !== "aprovado") items.push({ id, w: 2, t: t("Pagamento sem aprovação de diretor registrada") });
    if (A && A.over) items.push({ id, w: 1, t: t("{a} de {b} contêineres além do período livre (máx. {m} dias)", { a: A.over, b: A.n, m: A.maxStay }) });
    if (A && Data.db.processes[id]?.warnings?.length) items.push({ id, w: 2, t: t("Valores não conferem com o total do terminal") });
  }
  items.sort((a, b) => b.w - a.w);
  if (!items.length) return `<p class="okbox">${t("Nada pendente nos processos filtrados.")}</p>`;
  return `<table><tbody>${items.slice(0, 12).map((i) => `<tr class="click" onclick="location.hash='#p/${key(i.id)}'"><td style="width:110px"><b>${esc(i.id)}</b></td><td>${i.w === 3 ? "🔴" : i.w === 2 ? "🟠" : "🟡"} ${esc(i.t)}</td></tr>`).join("")}</tbody></table>
  ${items.length > 12 ? `<p class="axis-note">${t("+{n} outros pontos.", { n: items.length - 12 })}</p>` : ""}`;
}

function viewProcesso(id) {
  const P = Data.db.processes[id], R = Data.db.red[id] || null, H = Data.hist(id);
  if (!P && !R && !H) { view().innerHTML = `<h1>${t("Processo não encontrado")}</h1><p><a href="#processos">← ${t("voltar")}</a></p>`; return; }
  const A = P ? Data.analysis(id) : null;
  const M = Data.merged(id, P, R, A, H);
  const free = Data.freeDays();
  const agg = (extra) => {
    const m = {};
    for (const l of A.lines.filter((x) => (extra ? x.group !== "regular" : x.group === "regular"))) {
      const k = (m[l.key] ??= { key: l.key, group: l.group, value: 0, conts: new Set(), qty: 0, unit: new Set() });
      k.value += l.value; k.conts.add(l.container); k.qty += l.qty || 1; k.unit.add((l.unit ?? l.value).toFixed(2));
    }
    return Object.values(m).sort((a, b) => b.value - a.value);
  };
  const brkTable = (items, sum, isExtra) => items.length ? `<div class="tbl-wrap"><table><thead><tr><th>${t("Item")}</th>${isExtra ? "<th>KPI</th>" : ""}<th class="n">${t("Contêineres")}</th><th class="n">${t("Qtd.")}</th><th class="n">${t("Valor unit.")}</th><th class="n">${t("Total")}</th><th class="n">%</th></tr></thead><tbody>
    ${items.map((i) => `<tr><td>${gKey(i.group)} ${esc(itemName(i.key))}</td>${isExtra ? `<td><span class="kpi-tag">${kpiName(i.group)}</span></td>` : ""}<td class="n">${i.conts.size}</td><td class="n">${i.qty}${i.group === "extra_storage" ? " " + t("dias") : ""}</td>
      <td class="n">${i.unit.size === 1 ? brl(+[...i.unit][0]) : t("variável")}</td><td class="n">${brl(i.value)}</td><td class="n">${pct(i.value, sum)}</td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="${isExtra ? 5 : 4}">${t("Total")}</td><td class="n">${brl(sum)}</td><td></td></tr></tfoot></table></div>` : `<p class="okbox">${t("Nenhum custo extra neste processo.")}</p>`;
  const tariffCell = (l) => {
    const c = l.tariff;

    if (!c.ok) return `<span class="badge b-warn">⚠ ${t("esperado")} ${brl(c.expected)}</span>`;
    if (c.aboveMin) return `<span class="badge b-none" title="${esc(t("Acima do mínimo: pode ser % do CIF"))}">≥ ${t("mín.")}</span>`;
    return `<span class="badge b-ok">✓</span>`;
  };

  view().innerHTML = `
  <p class="small"><a href="#processos">← ${t("Processos")}</a></p>
  <div class="title-row"><h1>${esc(id)} ${chBadge(M.channel, M.channelSource)} ${stageBadge(M, R)}</h1>
    <div class="row"><button class="btn" onclick="editRed('${esc(id)}')">✎ ${t("Desembaraço / motivo")}</button>${A ? `<button class="btn" onclick="approvalEmail('${esc(id)}')">✉ ${t("E-mail de aprovação")}</button>` : ""}</div></div>
  ${P ? `<p class="muted small">BL <b>${esc(P.bl)}</b> · ${esc(P.duimp)} · ${t("Navio")} ${esc(P.vessel)} ${esc(P.voyage)} · ${t("Origem")} ${esc(P.origin)} · CIF US$ ${nf(P.cifUsd ?? 0, 2)} · NF-e ${esc(P.nfe)} · RPS ${esc(P.rps)} · ${t("Despachante")} ${esc(P.broker)}<br>
    ${t("Demonstrativo Santos Brasil emitido em {d}", { d: esc(P.issuedAt || "—") })} · ${t("arquivo")} <i>${esc(P.file)}</i></p>` : `<div class="warnbox">${t("Este processo ainda não tem demonstrativo da Santos Brasil: importe o arquivo {id} para ver os custos.", { id: esc(id) })}</div>`}
  ${P?.warnings?.length ? P.warnings.map((w) => `<div class="warnbox">⚠ ${esc(w)}</div>`).join("") : P ? `<div class="okbox small">✓ ${t("Valores conferidos: a soma dos serviços bate com os totais informados pelo terminal ({v}).", { v: brl(P.grandTotal) })}</div>` : ""}
  ${M.mapaFlag ? `<div class="warnbox">⚠ ${t("Canal verde (planilha COMEX) com custos de inspeção de {v}. O tarifário prevê posicionamento e lacres só para MAPA ou canal diferente de verde: confirmar se houve inspeção do MAPA e registrar o motivo.", { v: brl(A.extra_customs) })}</div>` : ""}

    <div class="tile hero"><div class="k">${t("Custo total")}</div><div class="v">${brl(A.total)}</div><div class="s">${brl(A.total / A.n)} ${t("por contêiner")}</div></div>
    <div class="tile"><div class="k">${gKey("regular")}${t("Regular")}</div><div class="v">${brl(A.regular)}</div><div class="s">${t("{v} por contêiner · meta {m}", { v: brl(A.regular / A.n), m: brl(M.channel && M.channel !== "Verde" ? REF_CPU.other : REF_CPU.green) })}</div></div>
    <div class="tile"><div class="k">${gKey("extra_storage")}${t("Extra armazenagem")}</div><div class="v">${brl(A.extra_storage)}</div><div class="s">KPI 1 · ${t("{n} contêiner-dias", { n: A.containers.reduce((a, c) => a + c.extraDays, 0) })}</div></div>

    <div class="tile kpi"><div class="k">${t("Estadia sem custo extra (≤ {d} dias)", { d: free })}</div><div class="v">${A.n - A.over} / ${A.n}</div><div class="s">${t("contêineres dentro do prazo")}</div></div>
    <div class="tile"><div class="k">${t("Estadia")}</div><div class="v">${t("{n} dias", { n: A.maxStay })}</div><div class="s">${fmtD(A.firstEntry)} → ${fmtD(A.lastExit)}</div></div>
  </div>
  <div class="panel"><h2>${t("Composição do custo")}</h2>${compBar(A)}</div>` : ""}
  <div class="grid2">
    <div class="panel"><div class="title-row"><h2>${t("Desembaraço e motivo da estadia / custos extras")}</h2><button class="btn sm" onclick="editRed('${esc(id)}')">✎ ${t("Editar")}</button></div>${redPanel(id, R, A, H, M)}</div>
    <div class="panel"><div class="title-row"><h2>${t("Pagamento e controle")}</h2>${A ? `<button class="btn sm" onclick="editPay('${esc(id)}')">✎ ${t("Editar")}</button>` : ""}</div>${A ? payPanel(id, P, A, R, M) : `<p class="muted">${t("Disponível quando o demonstrativo for importado.")}</p>`}</div>
  </div>
  ${H ? histPanel(H) : ""}
  ${A ? `<div class="grid2">

  <div class="panel"><h2>${t("Contêineres")}</h2><p class="muted small">${t("Clique num contêiner para ver os serviços cobrados pelo terminal, a conferência com o tarifário e as observações.")}</p>

  ${A.containers.map((c, i) => `<tr class="click" onclick="toggleRow(${i})"><td><b>${esc(c.id)}</b> <span class="muted">▸</span></td><td>${fmtD(c.entry)}</td><td>${fmtD(c.exit)}</td>

    <td class="n">${brl(c.regular)}</td><td class="n">${brl(c.extra_storage)}${c.extraDays ? `<br><span class="muted small">${c.extraDays} d × ${brl(c.dayRate)}</span>` : ""}</td><td class="n">${brl(c.extra_customs)}</td><td class="n"><b>${brl(c.total)}</b></td>

function approvalBadge(id) {
